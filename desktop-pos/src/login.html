<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>GO ERP — تسجيل الدخول</title><link rel="stylesheet" href="login.css"></head>
<body><main class="login">
  <section class="identity" aria-label="GO ERP"><img src="assets/go-erp.svg" alt="GO ERP SYSTEM"><p dir="ltr">THE INTELLIGENT SYSTEM FOR SALES, INVENTORY AND HR</p><p>لوحة واحدة لإدارة التطبيقات والطلبات</p></section>
  <section class="panel"><span class="eyebrow">لوحة التحكم</span><h1>تسجيل الدخول</h1><p class="description">أدخل بيانات حسابك للمتابعة</p>
    <p id="error" class="error" role="alert" hidden></p>
    <form id="login" autocomplete="off">
      <label for="email">البريد الإلكتروني أو رقم الموبايل</label><input id="email" name="email" type="text" required maxlength="320" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="أدخل بريدك الإلكتروني أو رقم الموبايل">
      <label for="password">كلمة المرور</label><div class="password"><input id="password" name="password" type="password" required maxlength="4096" autocomplete="new-password" placeholder="أدخل كلمة المرور"><button id="show-password" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false" aria-controls="password">◉</button></div>
      <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox">تذكرني</label>
      <button id="submit" type="submit">تسجيل الدخول</button><p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </form>
  </section>
</main><script src="login.js"></script></body></html>
