<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>GO ERP</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f4f5f8;color:#14243b;font-family:Tahoma,Arial,sans-serif;text-align:center}.panel{padding:32px;max-width:480px}h1{font-family:Arial,sans-serif;letter-spacing:2px;font-size:38px;margin:0 0 24px}p{font-size:19px;line-height:1.8;margin:12px 0}.note{font-size:14px;color:#617084}.loader{width:32px;height:32px;border:3px solid #dce1e9;border-top-color:#ed8524;border-radius:50%;margin:0 auto 22px;animation:turn 1s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}
</style>
<main class="panel" role="status" aria-live="polite"><h1 dir="ltr">GO ERP</h1><div class="loader" aria-hidden="true"></div><p>جارٍ فتح الداشبورد…</p><p class="note">يتم تجهيز بيانات الجهاز. سيظهر حسابك تلقائيًا.</p></main>
</html>
