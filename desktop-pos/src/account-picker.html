<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>GO ERP — اختيار الحساب</title>
  <link rel="stylesheet" href="account-picker.css">
  <script src="account-picker-renderer.js" defer></script>
</head>
<body>
  <main class="picker" aria-labelledby="picker-title">
    <header class="header"><span class="brand" dir="ltr" aria-hidden="true">GO</span><span class="product" dir="ltr">GO ERP</span></header>
    <h1 id="picker-title">اختيار الحساب</h1>
    <p class="intro">اختر حسابًا محفوظًا، أو أضف حسابًا آخر.<br>لكل حساب بياناته وإعداداته المحفوظة.</p>
    <div id="account-list" class="account-list" role="group" aria-label="الحسابات المحفوظة" aria-busy="true"></div>
    <p id="account-status" class="status" role="status" aria-live="polite">جارٍ عرض الحسابات…</p>
    <button id="account-select" class="button primary" type="button" disabled>فتح الحساب</button>
    <button id="account-add" class="button secondary" type="button" disabled><span aria-hidden="true">＋</span> إضافة حساب</button>
    <footer><button id="account-cancel" class="cancel" type="button">إلغاء</button></footer>
  </main>
</body>
</html>
