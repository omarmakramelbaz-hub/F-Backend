name: GO ERP precise activation permissions
on:
  push:
    branches: [codex/go-erp-activation-permissions-20261021, codex/go-erp-automation-20261021, codex/go-erp-current-activation-20261021, codex/go-erp-current-activation-20261021-r2]
    paths:
      - 'deployment/diagnose_go_erp_activation_permissions_root.sh'
      - 'tests/go_erp_activation_permissions_test.py'
      - '.github/workflows/go-erp-activation-permissions.yml'
  pull_request:
    paths:
      - 'deployment/diagnose_go_erp_activation_permissions_root.sh'
      - 'tests/go_erp_activation_permissions_test.py'
      - '.github/workflows/go-erp-activation-permissions.yml'
permissions:
  contents: read
jobs:
  pinned-permission-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate the root console entry
        run: bash -n deployment/diagnose_go_erp_activation_permissions_root.sh
      - name: Exercise exact source pins and descriptor permission changes as root
        run: sudo -n -- python3 -B tests/go_erp_activation_permissions_test.py
