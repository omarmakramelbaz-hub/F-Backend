name: Dashboard V3 live error

on:
  push:
    branches:
      - codex/dashboard-v3-live-error-20261003
    paths:
      - '.github/workflows/dashboard-v3-live-error.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Read live Laravel error
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519             -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20             root@187.127.92.124 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/fasakhaninja/public_html
          echo "HEAD=$(git rev-parse HEAD)"
          echo "__LATEST_EXCEPTION_BLOCK__"
          python3 - <<'PY'
from pathlib import Path
p=Path("storage/logs/laravel.log")
if not p.exists():
    print("NO_LOG")
    raise SystemExit
lines=p.read_text(errors="replace").splitlines()
start=max(0,len(lines)-500)
chunk=lines[start:]
hits=[i for i,l in enumerate(chunk) if ("production.ERROR" in l or "local.ERROR" in l)]
if not hits:
    print("\n".join(chunk[-120:]))
else:
    i=hits[-1]
    print("\n".join(chunk[max(0,i):min(len(chunk),i+90)]))
PY
          echo "__BLADE_CACHE__"
          ls -lt storage/framework/views | head -n 8 || true
          echo "__LAYOUT_SNIPPETS__"
          grep -n "fasV3Actor" resources/views/admin/index.blade.php resources/views/admin/layouts/header.blade.php resources/views/admin/layouts/menu.blade.php resources/views/admin/layouts/navbar.blade.php || true
          REMOTE
