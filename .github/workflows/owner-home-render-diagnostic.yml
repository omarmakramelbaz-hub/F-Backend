name: Owner home browser layout diagnostic

on:
  push:
    branches: ['codex/go-erp-owner-home-diagnostic-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser driver and use genuine runner Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/owner-home-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
          owner_chrome=$(command -v google-chrome || true)
          if [[ -z "$owner_chrome" && -x /opt/google/chrome/chrome ]]; then
            owner_chrome=/opt/google/chrome/chrome
          fi
          if [[ -n "$owner_chrome" && -x "$owner_chrome" ]]; then
            "$owner_chrome" --version
            printf 'DESKTOP_TEST_BROWSER_EXECUTABLE=%s\n' "$owner_chrome" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/owner-home-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          fi
      - name: Measure genuine owner chart resize and idle activity
        env:
          NODE_PATH: ${{ runner.temp }}/owner-home-browser/node_modules
        run: node tests/browser/owner-home-render-diagnostic.cjs
