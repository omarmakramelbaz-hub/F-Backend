name: Verify November 5 employee correction
on:
  push:
    branches: [codex/hr-correction-nov05-20261105]
    paths:
      - deployment/employee_attendance_nov05/**
      - tests/hr_nov05_runtime/**
      - .github/workflows/hr-nov05-correction-tests.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - run: php -l deployment/employee_attendance_nov05/repair.php
      - run: bash -n deployment/employee_attendance_nov05/run_root.sh
      - run: composer install --working-dir=tests/hr_nov05_runtime --no-interaction --prefer-dist --no-progress
      - run: php tests/hr_nov05_runtime/run.php
