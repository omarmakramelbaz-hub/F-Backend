permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, zip
          coverage: none
      - name: Install the existing application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-req=php+ --no-security-blocking
      - name: Prepare the isolated runtime
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views} bootstrap/cache
          cp .env.example .env
          php artisan key:generate
      - name: Verify application orders and branch isolation
        run: vendor/bin/phpunit --filter 'OrderBoard|GoStoreBoard|DashboardOrderIsolation|DashboardOrderMenu|DashboardOrderPayment|DashboardInbox|DashboardTakeaway|DashboardPosService|OrderProvider|DashboardManualNotification|DashboardBranchExpenses|DashboardBranchShift'
      - name: Verify compiled templates and JavaScript
        run: |
          php artisan view:cache
          node --check public/dashboard/js/order-board.js
          node --check public/dashboard/js/order-board-menu.js
          node --check public/dashboard/js/dashboard-navigation.js
          node --check public/dashboard/js/dashboard-spa.js
          node --check public/dashboard/js/dashboard-inbox.js
          node --check public/dashboard/js/dashboard-support-chat.js
          node --check public/dashboard/js/dashboard-print.js
          node --check public/dashboard/js/dashboard-invoice-details.js
          node --check public/dashboard/js/takeaway-pos.js
          node --check public/dashboard/js/dining-pos.js
          node --check public/dashboard/js/phone-orders.js
          node --check public/dashboard/js/branch-print-receiver.js
          node --check public/dashboard/js/branch-shifts.js
          node --check public/dashboard/js/branch-expenses.js
          node --check public/dashboard/js/branch-operations.js
          node --check public/dashboard/js/dashboard-location-picker.js
          node --check public/dashboard/js/print-settings.js
          bash -n deployment/apply_order_board.sh
          bash -n deployment/apply_dashboard_runtime_root.sh
          bash tests/deployment/dashboard_scheduler.sh
  takeaway-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: takeaway_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      TAKEAWAY_TEST_CONNECTION: mysql
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: takeaway_test
      DB_USERNAME: root
      DB_PASSWORD: test_password
      CACHE_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, zip
          coverage: none
      - name: Install the existing application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-req=php+ --no-security-blocking
      - name: Prepare the isolated runtime
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views} bootstrap/cache
          cp .env.example .env
          php artisan key:generate
      - name: Verify POS tickets, receipts and cash ledger on MySQL
        run: vendor/bin/phpunit --filter 'DashboardTakeaway|DashboardPosService|DashboardBranchExpenses|DashboardBranchShift'
