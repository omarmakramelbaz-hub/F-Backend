name: Prove attended GO ERP setup diagnostics on accepted preview30
'on':
  workflow_dispatch:
  push:
    branches: [codex/go-erp-setup-inspector30-20261023]
    paths:
      - deployment/diagnose_go_erp_setup.ps1
      - deployment/test_go_erp_setup_inspector.ps1
      - .github/workflows/go-erp-setup-inspector-proof.yml
permissions:
  contents: read
  actions: read
jobs:
  packaged-electron-powershell5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate immutable accepted installer artifact
        shell: powershell
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.repository }}' -cne 'omarmakramelbaz-hub/F-Backend') { throw 'REPOSITORY_DIFFERS' }
          $headers = @{ Authorization = "Bearer $env:ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
          $base = 'https://api.github.com/repos/${{ github.repository }}/actions'
          $run = Invoke-RestMethod -Headers $headers -Uri "$base/runs/39872151507"
          if ($run.id -ne 39872151507 -or $run.run_attempt -ne 1 -or $run.head_sha -cne 'c6605145f740371485944aed1a04045efe71e828' -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.repository.id -ne 1311412084 -or $run.head_repository.id -ne 1311412084) { throw 'ACCEPTED_RUN_DIFFERS' }
          $artifact = Invoke-RestMethod -Headers $headers -Uri "$base/artifacts/12467904684"
          if ($artifact.id -ne 12467904684 -or $artifact.expired -or $artifact.name -cne 'fasakhansta-dashboard-installer-preview' -or $artifact.size_in_bytes -ne 415501243 -or $artifact.digest -cne 'sha256:419f6a014686a164db10d07b8df89dc1f930a3712a0fa35cf93c3ca8ac2b8b3d' -or $artifact.workflow_run.id -ne 39872151507 -or $artifact.workflow_run.head_sha -cne 'c6605145f740371485944aed1a04045efe71e828') { throw 'ACCEPTED_ARTIFACT_DIFFERS' }
      - name: Download accepted archive without rebuilding the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '12467904684'
          run-id: '39872151507'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inspector-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify archive and installer bytes before execution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/inspector-download" -File -Recurse)
          if ($archives.Count -ne 1 -or $archives[0].Length -ne 415501243 -or (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '419f6a014686a164db10d07b8df89dc1f930a3712a0fa35cf93c3ca8ac2b8b3d') { throw 'ARCHIVE_BYTES_DIFFER' }
          $archive = Join-Path $env:RUNNER_TEMP 'accepted-preview30.zip'
          Move-Item -LiteralPath $archives[0].FullName -Destination $archive
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/accepted-preview30"
          $setup = Join-Path $env:RUNNER_TEMP 'accepted-preview30/GO-ERP-Preview-Setup.exe'
          if ((Get-Item -LiteralPath $setup).Length -ne 415858374 -or (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne '7fe210fdf6f81f66054e276a1753b7dce6d08e0ab799d05b4cc4a7cab2adbffa') { throw 'INSTALLER_BYTES_DIFFER' }
          $receipt = Get-Content -LiteralPath "$env:RUNNER_TEMP/accepted-preview30/installer-checks.json" -Raw | ConvertFrom-Json
          if ($receipt.sourceRevision -cne 'c6605145f740371485944aed1a04045efe71e828' -or $receipt.version -cne '0.4.4-preview.30' -or $receipt.installation -ne $true -or $receipt.installer.sha256 -cne '7fe210fdf6f81f66054e276a1753b7dce6d08e0ab799d05b4cc4a7cab2adbffa') { throw 'ACCEPTANCE_RECEIPT_DIFFERS' }
      - name: Exercise packaged main run failure with actual Windows PowerShell 5
        shell: powershell
        run: |
          & ./deployment/test_go_erp_setup_inspector.ps1 -InstallerPath "$env:RUNNER_TEMP/accepted-preview30/GO-ERP-Preview-Setup.exe"
          if (-not $?) { throw 'INSPECTOR_PROOF_FAILED' }
