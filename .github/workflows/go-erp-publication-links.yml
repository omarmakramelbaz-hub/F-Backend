name: GO ERP successful publication links
on:
  push:
    branches: [codex/go-erp-publication-links-20261021]
  pull_request:
    paths:
      - 'deployment/finalize_go_erp_publication_links_root.py'
      - 'tests/test_go_erp_publication_links_root.py'
      - '.github/workflows/go-erp-publication-links.yml'
permissions:
  contents: read
jobs:
  verified-link-finalization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Preserve backup bytes and finalize only proven source links
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_publication_links_root.py
