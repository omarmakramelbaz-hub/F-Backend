name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fasakhansta-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          # GitHub-hosted runners can occasionally time out on ssh-keyscan.
          # Host-key verification is handled explicitly by the SSH commands below.
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production backend
        shell: bash
        run: |
          set -euo pipefail
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@187.127.92.124

      - name: Run Laravel migrations and clear caches
        shell: bash
        run: |
          set -euo pipefail
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@187.127.92.124 \
            'set -e; cd /home/fasakhaninja/public_html; php artisan migrate --force; php artisan optimize:clear; php artisan tinker --execute="echo \Illuminate\Support\Facades\Schema::hasColumn(\x27pending_vendors\x27, \x27source_app\x27) ? \x27__SOURCE_APP_OK__\x27 : \x27__SOURCE_APP_MISSING__\x27;" | grep __SOURCE_APP_OK__'

      - name: Bootstrap GO schema and check professions API
        shell: bash
        run: |
          set -euo pipefail
          echo "=== GO schema bootstrap / professions ==="
          curl --fail-with-body -sS \
            --connect-timeout 8 --max-time 45 \
            -H 'Accept: application/json' \
            -H 'Lang: ar' \
            -H 'X-App-Scope: go' \
            https://fasakhaninja.com/api/professions
          echo

      - name: Check delegate API reachability
        shell: bash
        run: |
          set +e
          echo "=== Public DNS ==="
          getent ahostsv4 fasakhaninja.com || true
          echo "=== Public /api/profile ==="
          curl -sS -o /tmp/profile-public.out \
            -w 'HTTP %{http_code} DNS %{time_namelookup}s CONNECT %{time_connect}s TOTAL %{time_total}s\n' \
            --connect-timeout 8 --max-time 15 \
            -H 'Accept: application/json' \
            https://fasakhaninja.com/api/profile || true
          head -c 300 /tmp/profile-public.out 2>/dev/null || true
          echo
          echo "=== Direct VPS /api/profile with production host ==="
          curl -k -sS -o /tmp/profile-direct.out \
            -w 'HTTP %{http_code} CONNECT %{time_connect}s TOTAL %{time_total}s\n' \
            --connect-timeout 8 --max-time 15 \
            --resolve fasakhaninja.com:443:187.127.92.124 \
            -H 'Accept: application/json' \
            https://fasakhaninja.com/api/profile || true
          head -c 300 /tmp/profile-direct.out 2>/dev/null || true
          echo

      - name: Check GitHub Pages CORS for driver login
        shell: bash
        run: |
          set +e
          ORIGIN='https://omarmakramelbaz-hub.github.io'

          echo "=== OPTIONS /api/login from GitHub Pages (ignore TLS only for diagnosis) ==="
          curl -k -sS -D /tmp/cors-options.headers -o /tmp/cors-options.body \
            -X OPTIONS \
            --connect-timeout 8 --max-time 15 \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,lang' \
            https://fasakhaninja.com/api/login || true
          cat /tmp/cors-options.headers 2>/dev/null || true
          head -c 300 /tmp/cors-options.body 2>/dev/null || true
          echo

          echo "=== Invalid POST /api/login from GitHub Pages (ignore TLS only for diagnosis) ==="
          curl -k -sS -D /tmp/cors-post.headers -o /tmp/cors-post.body \
            -X POST \
            --connect-timeout 8 --max-time 15 \
            -H "Origin: $ORIGIN" \
            -H 'Accept: application/json' \
            -H 'Lang: ar' \
            -F 'mobile=00000000000' \
            -F 'password=invalid-cors-check' \
            -F 'account_type=delegate' \
            -F 'fcm_id=' \
            https://fasakhaninja.com/api/login || true
          cat /tmp/cors-post.headers 2>/dev/null || true
          head -c 300 /tmp/cors-post.body 2>/dev/null || true
          echo

      - name: Check SSL certificate and renewal command access
        shell: bash
        run: |
          set +e
          echo "=== Public TLS certificate ==="
          echo | openssl s_client -servername fasakhaninja.com -connect fasakhaninja.com:443 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates || true

          echo "=== Remote command capability ==="
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@187.127.92.124 \
            'echo __REMOTE_COMMAND_OK__; whoami; command -v certbot || true; command -v whmapi1 || true; command -v /usr/local/cpanel/bin/autossl_check || true' || true
