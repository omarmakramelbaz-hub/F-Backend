name: Original local dashboard on Windows

on:
  push:
    branches: ['main', 'codex/desktop-offline-pos-20261007', 'codex/go-erp-minute-updates-20261020', 'codex/go-erp-live-source-20261021', 'codex/go-erp-media-capacity-20261022', 'codex/go-erp-snapshot-transport-20261022']
  workflow_dispatch:
  pull_request:
    paths:
      # Every tracked application root packaged by build-runtime.cjs needs fresh acceptance.
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'desktop/**'
      - 'desktop-pos/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'artisan'
      - 'composer.json'
      - 'composer.lock'
      - 'deployment/go_erp_live_source_candidate.json'
      - 'tests/desktop_dashboard_runtime/**'
      - 'tests/request_autoload_compatibility.php'
      - '.gitattributes'
      - '.github/workflows/desktop-dashboard-tests.yml'
      - '.github/scripts/desktop-*.cjs'
      - '.github/scripts/prepare-desktop-vcredist.ps1'

permissions:
  contents: read

concurrency:
  group: desktop-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve exact live source bytes at checkout
        if: github.ref == 'refs/heads/codex/go-erp-live-source-20261021' || github.ref == 'refs/heads/codex/go-erp-media-capacity-20261022' || github.ref == 'refs/heads/codex/go-erp-snapshot-transport-20261022'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout configuration failed.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout line-ending configuration failed.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Electron test dependencies
        shell: pwsh
        run: |
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron test dependencies failed.' }
          node desktop-pos/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0 -or !(Test-Path desktop-pos/node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron binary download did not complete.' }
      - name: Verify actual connected Electron requests and encrypted recovery
        shell: pwsh
        run: |
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/connected-request-native.cjs desktop-pos/dist/connected-request-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron connected request acceptance failed.' }
          $connectedProof = Get-Content desktop-pos/dist/connected-request-native.json -Raw | ConvertFrom-Json
          $lockedConnectedElectron = (Get-Content desktop-pos/package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['packages']['node_modules/electron']['version']
          if ($connectedProof.electronVersion -isnot [string] -or $connectedProof.electronVersion -ne $lockedConnectedElectron) { throw 'The actual connected Electron process differs from its exact lock.' }
          if ($connectedProof.sourceRevision -ne $env:GITHUB_SHA -or $connectedProof.platform -ne 'win32' -or $connectedProof.hardware -isnot [bool] -or $connectedProof.hardware -ne $false -or $connectedProof.completed -isnot [bool] -or $connectedProof.completed -ne $true) { throw 'Native connected proof is incomplete or from another source.' }
          foreach ($field in @('actualElectronSessionFetch', 'actualWebRequest', 'actualDpapi', 'pinnedLoopbackHttps', 'pairedProofOnWire', 'internalMarkerStripped', 'foreignProofStripped', 'nativeReplayBlocked', 'fragmentNormalized', 'oldProtocolBlocked', 'lostReplyRetained', 'unboundedOriginalWrite', 'nativeReauthentication', 'expiredCookieBlocked', 'reauthSameActorProtocol', 'reauthWrongActorBlocked', 'reauthOldProtocolBlocked', 'reauthMutationBlocked', 'reauthCancelled', 'reauthPreservedMode', 'reauthNoPreload', 'reauthRedirectBlocked', 'nativeLocalReauthentication')) {
            if ($connectedProof.$field -isnot [bool] -or $connectedProof.$field -ne $true) { throw "Native connected proof is missing $field." }
          }
          if ($connectedProof.printedSources -ne 4 -or $connectedProof.originalWrites -ne 1 -or $connectedProof.invocations -ne 4 -or $connectedProof.lostPrintRequests -ne 1 -or $connectedProof.reauthentications -ne 6 -or $connectedProof.reauthOriginalSignins -ne 5 -or $connectedProof.reauthSuccesses -ne 3 -or $connectedProof.localReauthentications -ne 1) { throw 'Native connected proof did not complete every original request and print lifecycle.' }
      - name: Retain the exact connected native acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-request-native-windows
          path: desktop-pos/dist/connected-request-native.json
          if-no-files-found: error
          retention-days: 14
  original-runtime:
    needs: connected-native
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Preserve exact live source bytes at checkout
        if: github.ref == 'refs/heads/codex/go-erp-live-source-20261021' || github.ref == 'refs/heads/codex/go-erp-media-capacity-20261022' || github.ref == 'refs/heads/codex/go-erp-snapshot-transport-20261022'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout configuration failed.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout line-ending configuration failed.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.34'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, exif, gd, fileinfo, intl, curl, openssl, sodium
          ini-values: opcache.jit=0, opcache.jit_buffer_size=0
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bounded fixture recovery from repeated API rate limits
        shell: pwsh
        run: |
          & php tests/desktop_dashboard_runtime/remote-attempts.php --retry-helper-self-test 2>&1 | Tee-Object -Variable rateRetryOutput
          $rateRetryExit = $LASTEXITCODE
          $rateRetryMatches = [regex]::Matches(($rateRetryOutput -join "`n"), '(?m)^REMOTE_ATTEMPT_RATE_RETRY_SELF_TEST_COMPLETE (\{[^\r\n]+\})$')
          if ($rateRetryExit -ne 0 -or $rateRetryMatches.Count -ne 1) { throw 'Bounded fixture rate-limit recovery did not complete exactly once.' }
          $rateRetryReceipt = $rateRetryMatches[0].Groups[1].Value | ConvertFrom-Json
          foreach ($entry in @{ checks = 30; max_retries = 3; total_budget_seconds = 125; http_timeout_reserved_seconds = 15; boundary_slack_seconds = 1 }.GetEnumerator()) {
            $actual = $rateRetryReceipt.($entry.Key)
            if (($actual -isnot [int] -and $actual -isnot [long]) -or $actual -ne $entry.Value) { throw "Bounded fixture rate-limit policy differs: $($entry.Key)" }
          }
          if ($rateRetryReceipt.exact_request_identity -isnot [bool] -or $rateRetryReceipt.exact_request_identity -ne $true -or $rateRetryReceipt.production_limiter_changed -isnot [bool] -or $rateRetryReceipt.production_limiter_changed -ne $false) { throw 'Fixture recovery changed its exact request identity or production limiter boundary.' }
      - name: Install pinned test application dependencies
        # A reviewed supported lock is required; dependency security blocking stays enabled.
        run: composer install --working-dir=desktop-pos/runtime --no-dev --no-scripts --no-interaction --prefer-dist
      - name: Install pinned browser test dependency
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/browser-tests" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed.' }
          "DESKTOP_TEST_BROWSER_MODULE=$env:RUNNER_TEMP/browser-tests/node_modules/playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the pinned official Windows PDF runtime and test-only parser
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $env:DESKTOP_7ZIP = if ($sevenZip) { $sevenZip.Source } else { Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (!(Test-Path $env:DESKTOP_7ZIP)) { throw 'The Windows archive extractor is unavailable.' }
          node .github/scripts/desktop-wkhtmltox.cjs "$env:RUNNER_TEMP/wkhtmltox-official"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned official PDF payload verification failed.' }
          "DESKTOP_TEST_WKHTMLTOX=$env:RUNNER_TEMP/wkhtmltox-official/wkhtmltox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $parser = "$env:RUNNER_TEMP/contract-pdf-parser"
          python -m venv $parser
          if ($LASTEXITCODE -ne 0) { throw 'Private PDF parser environment creation failed.' }
          & "$parser/Scripts/python.exe" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tests/desktop_dashboard_runtime/requirements-pdf-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test-only PDF parser verification failed.' }
          "DESKTOP_TEST_PDF_PYTHON=$parser/Scripts/python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the original Laravel dashboard with private disposable MariaDB
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/mariadb.zip"
          Invoke-WebRequest 'https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-11.4.13-winx64.zip' -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd62986d433eeebfde218560b276103831604a61e929e87f1a17f5aebd80257e2') { throw 'MariaDB archive hash differs.' }
          Expand-Archive $archive "$env:RUNNER_TEMP/mariadb"
          $server = (Get-ChildItem "$env:RUNNER_TEMP/mariadb/*/bin/mariadbd.exe")[0].FullName
          $bin = Split-Path $server
          $maria = Split-Path $bin
          $phpRoot = Split-Path (Get-Command php).Source
          # Exercise the actual native PDF command path with spaces.
          $bundle = "$env:RUNNER_TEMP/dashboard PDF bundle"
          $env:DESKTOP_TEST_SNAPSHOT_FILE = "$env:RUNNER_TEMP/dashboard-synthetic-snapshot.json"
          "DESKTOP_TEST_SNAPSHOT_FILE=$env:DESKTOP_TEST_SNAPSHOT_FILE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node desktop-pos/build-runtime.cjs . $bundle desktop-pos/runtime $phpRoot $maria $env:GITHUB_SHA "$env:DESKTOP_TEST_WKHTMLTOX"
          if ($LASTEXITCODE -ne 0) { throw 'Original source packaging failed.' }
          $runtimeEngine = (Get-Content "$bundle/manifest.json" -Raw | ConvertFrom-Json).runtimeFramework
          if ($runtimeEngine -ne '12.70.0') { throw 'The reviewed runtime engine was not packaged.' }
          & php tests/desktop_dashboard_runtime/engine-compatibility.php "$bundle/application" $runtimeEngine 2>&1 | Tee-Object -Variable engineCompatibilityOutput
          if ($LASTEXITCODE -ne 0 -or !(($engineCompatibilityOutput -join "`n") -match '(?m)^ENGINE_COMPATIBILITY_COMPLETE ')) { throw 'The actual Windows engine failed its source-contract, calendar or permission compatibility checks.' }
          & php tests/request_autoload_compatibility.php "$bundle/application" 2>&1 | Tee-Object -Variable requestAutoloadOutput
          if ($LASTEXITCODE -ne 0 -or !(($requestAutoloadOutput -join "`n") -match '(?m)^REQUEST_AUTOLOAD_COMPATIBILITY_COMPLETE 7$')) { throw 'Original request autoload compatibility checks did not complete.' }
          & php tests/desktop_dashboard_runtime/live-shift-closing.php "$bundle/application" $runtimeEngine 2>&1 | Tee-Object -Variable liveShiftOutput
          $liveShiftExit = $LASTEXITCODE
          $liveShiftMatches = [regex]::Matches(($liveShiftOutput -join "`n"), '(?m)^LIVE_SHIFT_MERGE_COMPLETE (\{[^\r\n]+\})$')
          if ($liveShiftExit -ne 0 -or $liveShiftMatches.Count -ne 1) { throw 'The current pending-invoice and desktop shift regression did not complete exactly once.' }
          $liveShiftReceipt = $liveShiftMatches[0].Groups[1].Value | ConvertFrom-Json
          if ($liveShiftReceipt.checks -ne 38 -or $liveShiftReceipt.framework -cne $runtimeEngine -or $liveShiftReceipt.driver -cne 'sqlite' -or $liveShiftReceipt.sourceClassSha256 -cne (Get-FileHash app/Services/Dashboard/BranchShiftClosing.php -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'The live shift receipt differs from the exact current packaged class or engine.' }
          foreach ($field in @('privateDatabase', 'sourceCopied', 'phpBusinessExecution')) {
            if ($liveShiftReceipt.$field -isnot [bool] -or $liveShiftReceipt.$field -ne $true) { throw "The live shift regression did not execute its private actual business boundary: $field" }
          }
          foreach ($field in @('retainedVendorModified', 'productionEnvironmentLoaded', 'physicalPrinter')) {
            if ($liveShiftReceipt.$field -isnot [bool] -or $liveShiftReceipt.$field -ne $false) { throw "The live shift regression scope differs: $field" }
          }
          $liveShiftReceipt | Add-Member -NotePropertyName sourceRevision -NotePropertyValue $env:GITHUB_SHA
          $liveShiftReceipt | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/live-shift-closing-windows.json" -Encoding utf8NoBOM
          $data = "$env:RUNNER_TEMP/desktop-fixture-database"
          & "$bin/mariadb-install-db.exe" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'Disposable database initialization failed.' }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $process = Start-Process $server -ArgumentList @('--no-defaults', "--datadir=`"$data`"", '--bind-address=127.0.0.1', "--port=$port", '--console') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/maria-out.log" -RedirectStandardError "$env:RUNNER_TEMP/maria-error.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($process.HasExited) { Get-Content "$env:RUNNER_TEMP/maria-error.log"; throw 'Disposable database stopped.' }
              $client = [System.Net.Sockets.TcpClient]::new()
              try { if ($client.ConnectAsync('127.0.0.1', $port).Wait(250)) { $ready = $true; break } } catch {} finally { $client.Dispose() }
              Start-Sleep -Milliseconds 250
            }
            if (!$ready) { throw 'Disposable database readiness timed out.' }
            $pdfProofDirectory = "$env:RUNNER_TEMP/contract-pdf-windows"
            New-Item -ItemType Directory -Path $pdfProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/contract-pdf-http.php "$bundle/application" $port $pdfProofDirectory windows $env:GITHUB_SHA 2>&1 | Tee-Object -Variable pdfProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($pdfProofOutput -join "`n") -match '(?m)^CONTRACT_PDF_HTTP_COMPLETE ')) { throw 'The original contract route did not complete its Windows PDF smoke.' }
            & $env:DESKTOP_TEST_PDF_PYTHON tests/desktop_dashboard_runtime/contract-pdf-parser-test.py
            if ($LASTEXITCODE -ne 0) { throw 'Strict Arabic PDF extraction comparison controls failed.' }
            & $env:DESKTOP_TEST_PDF_PYTHON tests/desktop_dashboard_runtime/verify-contract-pdf.py $pdfProofDirectory $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'The real Windows contract PDF could not be parsed with its saved literal and Arabic text.' }
            $pdfReceipt = Get-Content "$pdfProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            $parsedPdfReceipt = Get-Content "$pdfProofDirectory/parsed-pdf-receipt.json" -Raw | ConvertFrom-Json
            if (!$pdfReceipt.completed -or !$pdfReceipt.databaseDropped -or !$pdfReceipt.httpServerStopped -or $pdfReceipt.mode -ne 'windows' -or $pdfReceipt.sourceRevision -ne $env:GITHUB_SHA -or $pdfReceipt.helperBinding -ne 'exact-git-revision' -or $pdfReceipt.journalCommands -ne 0 -or $pdfReceipt.externalAssetRequests -ne 0 -or $pdfReceipt.fullDashboard -ne $false -or !$parsedPdfReceipt.completed -or $parsedPdfReceipt.sourceRevision -ne $env:GITHUB_SHA -or $parsedPdfReceipt.fullDashboard -ne $false) { throw 'The contract PDF proof source, cleanup or bounded scope differs.' }
            $customerDirectoryProofDirectory = "$env:RUNNER_TEMP/customer-directory-browser"
            New-Item -ItemType Directory -Path $customerDirectoryProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/customer-directory-browser-http.php "$bundle/application" $port $customerDirectoryProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable customerDirectoryProofOutput
            $customerDirectoryExit = $LASTEXITCODE
            $customerDirectoryMarkers = [regex]::Matches(($customerDirectoryProofOutput -join "`n"), '(?m)^ORIGINAL_CUSTOMER_DIRECTORY_BROWSER_COMPLETE [^\r\n]+$')
            if ($customerDirectoryExit -ne 0 -or $customerDirectoryMarkers.Count -ne 1) { throw 'Original customer directory Edge fixture did not complete exactly once.' }
            $customerDirectoryReceipt = Get-Content "$customerDirectoryProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            foreach ($field in @('completed','verifiedImport','privateDatabasesDropped','httpStopped','browserStopped','sourceVerifiedAfter','helpersVerifiedAfter')) {
              if ($customerDirectoryReceipt.$field -ne $true) { throw "Original customer directory receipt is incomplete: $field" }
            }
            if ($customerDirectoryReceipt.helperBinding -ne 'exact-git-revision' -or $customerDirectoryReceipt.sourceRevision -ne $env:GITHUB_SHA -or $customerDirectoryReceipt.fixtureRevision -ne $env:GITHUB_SHA -or $customerDirectoryReceipt.importedSnapshotTables -ne 109 -or $customerDirectoryReceipt.schemaInventory -ne 106 -or $customerDirectoryReceipt.unchangedImportedTables -ne 106 -or $customerDirectoryReceipt.checks -ne 16 -or $customerDirectoryReceipt.fullDashboard -ne $false) { throw 'Original customer directory receipt source, schema or bounded coverage differs.' }
            $customerDirectoryProof = $customerDirectoryReceipt.browserProof
            if ($customerDirectoryReceipt.browserExitCode -ne 0 -or $customerDirectoryProof.browser -ne 'Windows Edge' -or $customerDirectoryProof.browserPlatform -ne 'win32' -or $customerDirectoryProof.sourceCommit -ne $env:GITHUB_SHA -or $customerDirectoryProof.fixtureRevision -ne $env:GITHUB_SHA -or $customerDirectoryProof.newPageErrors -ne 0 -or $customerDirectoryProof.createPostCount -ne 1) { throw 'Original customer directory browser proof differs from this exact Windows fixture.' }
            foreach ($scope in @($customerDirectoryReceipt,$customerDirectoryProof)) {
              foreach ($field in @('domInjection','providersReplaced')) {
                if ($scope.$field -isnot [bool] -or $scope.$field -ne $false) { throw "Original customer directory proof must preserve the original application: $field" }
              }
            }
            foreach ($field in @('create','edit','explicitConsent','scopedWithdrawal','recordedWithdrawalReopenRejected','committedResponseLost','recoveredSameUuid')) {
              if ($customerDirectoryProof.$field -ne $true) { throw "Original customer directory browser proof did not exercise: $field" }
            }
            & php tests/desktop_dashboard_runtime/delta-local.php "$bundle/application" $port 2>&1 | Tee-Object -Variable deltaLocalOutput
            if ($LASTEXITCODE -ne 0 -or ([regex]::Matches(($deltaLocalOutput -join "`n"), '(?m)^DESKTOP_DELTA_LOCAL_COMPLETE 12$')).Count -ne 1) { throw 'The actual InnoDB nonblocking delta capture, reconstruction and cleanup fixture did not complete.' }
            & php tests/desktop_dashboard_runtime/delta-handoff.php "$bundle/application" $port 2>&1 | Tee-Object -Variable deltaHandoffOutput
            $deltaHandoffExit = $LASTEXITCODE
            $deltaHandoffMarkers = [regex]::Matches(($deltaHandoffOutput -join "`n"), '(?m)^DESKTOP_DELTA_HANDOFF_COMPLETE (\{[^\r\n]+\})$')
            if ($deltaHandoffExit -ne 0 -or $deltaHandoffMarkers.Count -ne 1) { throw 'The actual Laravel background delta, signed handoff and bounded final archive fixture did not complete exactly once.' }
            $deltaHandoffReceipt = $deltaHandoffMarkers[0].Groups[1].Value | ConvertFrom-Json
            if ($deltaHandoffReceipt.checks -ne 16 -or $deltaHandoffReceipt.runtimeFramework -cne $runtimeEngine -or $deltaHandoffReceipt.actualPrintProtocol -ne 1 -or $deltaHandoffReceipt.productionEnvironmentLoaded -isnot [bool] -or $deltaHandoffReceipt.productionEnvironmentLoaded -ne $false) { throw 'The delta handoff proof differs from the captured runtime or private scope.' }
            foreach ($field in @('actualFramework','actualMariaDB','fullVerificationBeforeFence','noHistoryScanUnderFence')) { if ($deltaHandoffReceipt.$field -isnot [bool] -or $deltaHandoffReceipt.$field -ne $true) { throw "The delta handoff did not verify $field" } }
            $employeeIdentityProofDirectory = "$env:RUNNER_TEMP/employee-identity-browser"
            New-Item -ItemType Directory -Path $employeeIdentityProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/employee-identity-http.php "$bundle/application" $port $employeeIdentityProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable employeeIdentityOutput
            $employeeIdentityExit = $LASTEXITCODE
            $employeeIdentityMarkers = [regex]::Matches(($employeeIdentityOutput -join "`n"), '(?m)^ORIGINAL_EMPLOYEE_IDENTITY_BROWSER_COMPLETE [^\r\n]+$')
            if ($employeeIdentityExit -ne 0 -or $employeeIdentityMarkers.Count -ne 1) { throw 'The original employee identity browser and device replay proof did not complete exactly once.' }
            $employeeIdentityReceipt = Get-Content "$employeeIdentityProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            foreach ($field in @('completed','verifiedImport','privateDatabasesDropped','httpStopped','browserStopped','sourceVerifiedAfter','helpersVerifiedAfter','privateMediaHttpVerified','consentJournalVerified','consentReplayVerified','duplicateReplayVerified','staleQueuedConsentRejected')) {
              if ($employeeIdentityReceipt.$field -isnot [bool] -or $employeeIdentityReceipt.$field -ne $true) { throw "Original employee identity receipt is incomplete: $field" }
            }
            if ($employeeIdentityReceipt.kind -cne 'original-employee-identity-browser' -or $employeeIdentityReceipt.helperBinding -cne 'exact-git-revision' -or $employeeIdentityReceipt.sourceRevision -cne $env:GITHUB_SHA -or $employeeIdentityReceipt.fixtureRevision -cne $env:GITHUB_SHA -or $employeeIdentityReceipt.schemaInventory -ne 106 -or $employeeIdentityReceipt.checks -lt 45) { throw 'Original employee identity proof differs from the exact candidate source or bounded coverage.' }
            foreach ($phase in @('central','local')) {
              $employeeProof = $employeeIdentityReceipt.browserProof.$phase
              if ($employeeProof.browser -cne 'Windows Edge' -or $employeeProof.browserPlatform -cne 'win32' -or $employeeProof.phase -cne $phase -or $employeeProof.sourceCommit -cne $env:GITHUB_SHA -or $employeeProof.fixtureRevision -cne $env:GITHUB_SHA -or $employeeProof.newPageErrors -ne 0 -or $employeeProof.newEmployeeConsoleErrors -ne 0) { throw "Original employee identity proof is not actual Windows Edge for this candidate: $phase" }
              foreach ($field in @('regulationRendered','privatePublicUrlDenied')) { if ($employeeProof.$field -ne $true) { throw "Employee browser did not exercise $phase $field" } }
              foreach ($field in @('domInjection','providersReplaced')) { if ($employeeProof.$field -isnot [bool] -or $employeeProof.$field -ne $false) { throw "Employee browser changed the original application: $phase $field" } }
            }
            foreach ($field in @('realUpload','immutableABA','staleConsentRejected','firstAcceptanceDatePreserved','withdrawal','branchReadOnly','outOfScopeDenied')) {
              if ($employeeIdentityReceipt.browserProof.central.$field -ne $true) { throw "Employee central browser did not exercise: $field" }
            }
            if ($employeeIdentityReceipt.browserProof.local.externalRequestsBlocked -ne 0) { throw 'The actual offline employee page attempted an external request.' }
            foreach ($field in @('privatePhotos','imagesDecoded','displayedPhotoSourcesBound','onlineUploadExplanation','consentJournal')) {
              if ($employeeIdentityReceipt.browserProof.local.$field -ne $true) { throw "Employee local browser did not exercise: $field" }
            }
            foreach ($field in @('fullDashboard','domInjection','providersReplaced')) { if ($employeeIdentityReceipt.$field -isnot [bool] -or $employeeIdentityReceipt.$field -ne $false) { throw "Employee identity proof scope differs: $field" } }
            & php tests/desktop_dashboard_runtime/settings-engine-compatibility.php "$bundle/application" $port 2>&1 | Tee-Object -Variable settingsEngineOutput
            if ($LASTEXITCODE -ne 0 -or !(($settingsEngineOutput -join "`n") -match '(?m)^SETTINGS_ENGINE_COMPATIBILITY_COMPLETE ')) { throw 'The actual Windows settings engine changed original row identities, locks, payloads or transaction behavior.' }
            & php tests/desktop_dashboard_runtime/settings.php "$bundle/application" $port 2>&1 | Tee-Object -Variable settingsProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($settingsProofOutput -join "`n") -match '(?m)^DESKTOP_SETTINGS_COMPLETE (?:11[2-9]|1[2-9][0-9]|[2-9][0-9]{2}|[1-9][0-9]{3,})$')) { throw 'Original nonsecret settings controller, protected balance, rollback, journal, replay, native outcomes and legacy image import did not complete.' }
            foreach ($fixture in @('run.php', 'legacy.php', 'wallet-cash.php', 'outbox-review.php', 'print-ledger.php', 'user-accounts.php', 'order-board-component-run.php', 'enrollment-run.php', 'connected-request-actor.php', 'core-authority.php', 'created-scopes.php')) {
              if ($fixture -eq 'print-ledger.php') {
                & ./tests/desktop_dashboard_runtime/isolated-print-ledger.ps1 -MariaDbBin $bin -Application "$bundle/application" -Php (Get-Command php).Source 2>&1 | Tee-Object -Variable fixtureOutput
              } else {
                & php "tests/desktop_dashboard_runtime/$fixture" "$bundle/application" $port 2>&1 | Tee-Object -Variable fixtureOutput
              }
              $fixtureExit = $LASTEXITCODE
              $summary = switch ($fixture) {
                'run.php' { '\d+ checks passed using the original Laravel application and real MariaDB' }
                'legacy.php' { '\d+ legacy schema checks passed' }
                'wallet-cash.php' { '(?m)^WALLET_CASH_CHECKS=\d+$' }
