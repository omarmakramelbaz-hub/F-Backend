name: Original local dashboard on Windows

on:
  push:
    branches: ['codex/desktop-offline-pos-20261007']
  pull_request:
    paths:
      - 'app/Services/Dashboard/DesktopDashboard*.php'
      - 'app/Services/Dashboard/CategoryOrdering.php'
      - 'app/Repositories/ResturantProductRepository.php'
      - 'app/Http/Controllers/Dashboard/CategoryController.php'
      - 'app/Http/Controllers/Dashboard/ContractController.php'
      - 'config/snappy.php'
      - 'app/Http/Controllers/Api/V1/Vendor/ResturantProductController.php'
      - 'app/Http/Requests/Api/Vendor/CopyMenuRequest.php'
      - 'routes/admin.php'
      - 'app/Http/Middleware/DesktopDashboardJournal.php'
      - 'app/Exceptions/Handler.php'
      - 'desktop/**'
      - 'desktop-pos/**'
      - 'tests/desktop_dashboard_runtime/**'
      - 'public/dashboard/js/desktop-dashboard.js'
      - 'public/dashboard/js/dashboard-spa.js'
      - 'public/dashboard/vendor/desktop-external/**'
      - 'resources/views/admin/**'
      - '.gitattributes'
      - '.github/workflows/desktop-dashboard-tests.yml'
      - '.github/scripts/desktop-wkhtmltox.cjs'

permissions:
  contents: read

concurrency:
  group: desktop-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.34'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, exif, gd, fileinfo, intl, curl, openssl, sodium
          ini-values: opcache.jit=0, opcache.jit_buffer_size=0
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test application dependencies
        # Legacy preview only: preserve audit findings; a normal release requires a clean reviewed audit.
        run: composer install --working-dir=desktop-pos/runtime --no-dev --no-scripts --no-interaction --prefer-dist --no-security-blocking
      - name: Install pinned browser test dependency
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/browser-tests" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependencies failed.' }
          "DESKTOP_TEST_BROWSER_MODULE=$env:RUNNER_TEMP/browser-tests/node_modules/playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the pinned official Windows PDF runtime and test-only parser
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $env:DESKTOP_7ZIP = if ($sevenZip) { $sevenZip.Source } else { Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (!(Test-Path $env:DESKTOP_7ZIP)) { throw 'The Windows archive extractor is unavailable.' }
          node .github/scripts/desktop-wkhtmltox.cjs "$env:RUNNER_TEMP/wkhtmltox-official"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned official PDF payload verification failed.' }
          "DESKTOP_TEST_WKHTMLTOX=$env:RUNNER_TEMP/wkhtmltox-official/wkhtmltox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $parser = "$env:RUNNER_TEMP/contract-pdf-parser"
          python -m venv $parser
          if ($LASTEXITCODE -ne 0) { throw 'Private PDF parser environment creation failed.' }
          & "$parser/Scripts/python.exe" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tests/desktop_dashboard_runtime/requirements-pdf-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test-only PDF parser verification failed.' }
          "DESKTOP_TEST_PDF_PYTHON=$parser/Scripts/python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the original Laravel dashboard with private disposable MariaDB
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/mariadb.zip"
          Invoke-WebRequest 'https://archive.mariadb.org/mariadb-11.4.13/winx64-packages/mariadb-11.4.13-winx64.zip' -OutFile $archive -TimeoutSec 300
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd62986d433eeebfde218560b276103831604a61e929e87f1a17f5aebd80257e2') { throw 'MariaDB archive hash differs.' }
          Expand-Archive $archive "$env:RUNNER_TEMP/mariadb"
          $server = (Get-ChildItem "$env:RUNNER_TEMP/mariadb/*/bin/mariadbd.exe")[0].FullName
          $bin = Split-Path $server
          $maria = Split-Path $bin
          $phpRoot = Split-Path (Get-Command php).Source
          # Exercise the actual native PDF command path with spaces.
          $bundle = "$env:RUNNER_TEMP/dashboard PDF bundle"
          $env:DESKTOP_TEST_SNAPSHOT_FILE = "$env:RUNNER_TEMP/dashboard-synthetic-snapshot.json"
          "DESKTOP_TEST_SNAPSHOT_FILE=$env:DESKTOP_TEST_SNAPSHOT_FILE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node desktop-pos/build-runtime.cjs . $bundle desktop-pos/runtime $phpRoot $maria $env:GITHUB_SHA "$env:DESKTOP_TEST_WKHTMLTOX"
          if ($LASTEXITCODE -ne 0) { throw 'Original source packaging failed.' }
          & php tests/request_autoload_compatibility.php "$bundle/application" 2>&1 | Tee-Object -Variable requestAutoloadOutput
          if ($LASTEXITCODE -ne 0 -or !(($requestAutoloadOutput -join "`n") -match '(?m)^REQUEST_AUTOLOAD_COMPATIBILITY_COMPLETE 7$')) { throw 'Original request autoload compatibility checks did not complete.' }
          $data = "$env:RUNNER_TEMP/desktop-fixture-database"
          & "$bin/mariadb-install-db.exe" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw 'Disposable database initialization failed.' }
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $process = Start-Process $server -ArgumentList @('--no-defaults', "--datadir=`"$data`"", '--bind-address=127.0.0.1', "--port=$port", '--console') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/maria-out.log" -RedirectStandardError "$env:RUNNER_TEMP/maria-error.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($process.HasExited) { Get-Content "$env:RUNNER_TEMP/maria-error.log"; throw 'Disposable database stopped.' }
              $client = [System.Net.Sockets.TcpClient]::new()
              try { if ($client.ConnectAsync('127.0.0.1', $port).Wait(250)) { $ready = $true; break } } catch {} finally { $client.Dispose() }
              Start-Sleep -Milliseconds 250
            }
            if (!$ready) { throw 'Disposable database readiness timed out.' }
            $pdfProofDirectory = "$env:RUNNER_TEMP/contract-pdf-windows"
            New-Item -ItemType Directory -Path $pdfProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/contract-pdf-http.php "$bundle/application" $port $pdfProofDirectory windows $env:GITHUB_SHA 2>&1 | Tee-Object -Variable pdfProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($pdfProofOutput -join "`n") -match '(?m)^CONTRACT_PDF_HTTP_COMPLETE ')) { throw 'The original contract route did not complete its Windows PDF smoke.' }
            & $env:DESKTOP_TEST_PDF_PYTHON tests/desktop_dashboard_runtime/contract-pdf-parser-test.py
            if ($LASTEXITCODE -ne 0) { throw 'Strict Arabic PDF extraction comparison controls failed.' }
            & $env:DESKTOP_TEST_PDF_PYTHON tests/desktop_dashboard_runtime/verify-contract-pdf.py $pdfProofDirectory $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'The real Windows contract PDF could not be parsed with its saved literal and Arabic text.' }
            $pdfReceipt = Get-Content "$pdfProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            $parsedPdfReceipt = Get-Content "$pdfProofDirectory/parsed-pdf-receipt.json" -Raw | ConvertFrom-Json
            if (!$pdfReceipt.completed -or !$pdfReceipt.databaseDropped -or !$pdfReceipt.httpServerStopped -or $pdfReceipt.mode -ne 'windows' -or $pdfReceipt.sourceRevision -ne $env:GITHUB_SHA -or $pdfReceipt.helperBinding -ne 'exact-git-revision' -or $pdfReceipt.journalCommands -ne 0 -or $pdfReceipt.externalAssetRequests -ne 0 -or $pdfReceipt.fullDashboard -ne $false -or !$parsedPdfReceipt.completed -or $parsedPdfReceipt.sourceRevision -ne $env:GITHUB_SHA -or $parsedPdfReceipt.fullDashboard -ne $false) { throw 'The contract PDF proof source, cleanup or bounded scope differs.' }
            foreach ($fixture in @('run.php', 'legacy.php')) {
              & php "tests/desktop_dashboard_runtime/$fixture" "$bundle/application" $port 2>&1 | Tee-Object -Variable fixtureOutput
              $fixtureExit = $LASTEXITCODE
              $summary = if ($fixture -eq 'run.php') { '\d+ checks passed using the original Laravel application and real MariaDB' } else { '\d+ legacy schema checks passed' }
              if ($fixtureExit -ne 0 -or !(($fixtureOutput -join "`n") -match $summary)) { throw "Original application fixture did not complete: $fixture" }
              if ($fixture -eq 'run.php') {
                $waLine = @(($fixtureOutput -join "`n") -split "`n" | Where-Object { $_ -match '^WHATSAPP_NATIVE_UNPREPARED_COMPLETE ' })
                if ($waLine.Count -ne 1) { throw 'The original unprepared WhatsApp boundary fixture did not complete.' }
                $waReceipt = $waLine[0].Substring('WHATSAPP_NATIVE_UNPREPARED_COMPLETE '.Length) | ConvertFrom-Json
                if ($waReceipt.checks -ne 13 -or !$waReceipt.local404 -or !$waReceipt.authorizationRetained -or !$waReceipt.attachmentGet -or $waReceipt.queries -ne 0 -or $waReceipt.providerCalls -ne 0 -or !$waReceipt.outboxUnchanged -or !$waReceipt.storageUnchanged -or $waReceipt.fullDashboard -ne $false) { throw 'The original unprepared WhatsApp boundary receipt differs.' }
                $metaLine = @(($fixtureOutput -join "`n") -split "`n" | Where-Object { $_ -match '^META_NATIVE_UNPREPARED_COMPLETE ' })
                if ($metaLine.Count -ne 1) { throw 'The original unprepared Meta boundary fixture did not complete.' }
                $metaReceipt = $metaLine[0].Substring('META_NATIVE_UNPREPARED_COMPLETE '.Length) | ConvertFrom-Json
                if ($metaReceipt.checks -ne 45 -or $metaReceipt.routes -ne 15 -or $metaReceipt.httpKernelRoutes -ne 5 -or !$metaReceipt.local404 -or !$metaReceipt.authorizationRetained -or !$metaReceipt.serverOnlyTablesExcluded -or $metaReceipt.queries -ne 0 -or $metaReceipt.providerCalls -ne 0 -or $metaReceipt.callbacks -ne 0 -or !$metaReceipt.outboxUnchanged -or !$metaReceipt.privateStorageUnchanged -or !$metaReceipt.profileWorkerUnavailable -or $metaReceipt.fullDashboard -ne $false) { throw 'The original unprepared Meta boundary receipt differs.' }
              }
              if ($fixture -eq 'legacy.php' -and !(($fixtureOutput -join "`n") -match 'PASS real browser signs in')) { throw 'The real offline browser checks did not execute.' }
              if ($fixture -eq 'legacy.php' -and (!(($fixtureOutput -join "`n") -match '(?m)^Restaurant flag original local and reconciliation acceptance completed$') -or !(($fixtureOutput -join "`n") -match '(?m)^Restaurant flag original native outcome acceptance completed$'))) { throw 'Both original restaurant flag acceptance modules must complete.' }
              if ($fixture -eq 'legacy.php' -and (!(($fixtureOutput -join "`n") -match '(?m)^Restaurant product original GET acceptance completed$') -or !(($fixtureOutput -join "`n") -match '(?m)^Restaurant product original native GET outcomes completed$'))) { throw 'Both original product GET acceptance modules must complete.' }
              if ($fixture -eq 'legacy.php' -and (!(($fixtureOutput -join "`n") -match '(?m)^RESTAURANT_PRODUCT_CRUD_COMPLETE ') -or !(($fixtureOutput -join "`n") -match '(?m)^RESTAURANT_PRODUCT_CRUD_REMOTE_COMPLETE '))) { throw 'Both original product CRUD acceptance modules must complete.' }
              if ($fixture -eq 'legacy.php') {
                foreach ($module in @(@{ marker = 'RESTAURANT_MENU_COPY_LOCAL_COMPLETE'; checks = 42 }, @{ marker = 'RESTAURANT_MENU_COPY_REMOTE_COMPLETE'; checks = 42 })) {
                  $match = [regex]::Matches(($fixtureOutput -join "`n"), ('(?m)^' + $module.marker + ' (\{[^\r\n]+\})$'))
                  if ($match.Count -ne 1) { throw "Original menu-copy acceptance must complete exactly once: $($module.marker)" }
                  $copyModule = $match[0].Groups[1].Value | ConvertFrom-Json
                  if ($copyModule.checks -ne $module.checks -or $copyModule.schemaInventory -ne 106 -or $copyModule.productColumns -ne 13 -or $copyModule.mediaColumns -ne 18 -or $copyModule.fullDashboard -ne $false) { throw "Original menu-copy acceptance count or scope differs: $($module.marker)" }
                  foreach ($field in @('originalMultipart','originalController','fullImagesCopied','sourceImagesPreserved','sourceAndTargetRevocation')) {
                    if ($copyModule.$field -ne $true) { throw "Original menu-copy acceptance is incomplete: $($module.marker).$field" }
                  }
                  $copyFields = if ($module.marker -eq 'RESTAURANT_MENU_COPY_LOCAL_COMPLETE') { @('orderedDuplicates','rollbackAtomic','mappedServerIdentities','repeatedPriceClock','historicalNoopOccurrence','typedProducerConsumerChain') } else { @('nativeCancellation') }
                  foreach ($field in $copyFields) { if ($copyModule.$field -ne $true) { throw "Original menu-copy acceptance did not exercise: $($module.marker).$field" } }
                }
              }
            }
            $reviewProofDirectory = "$env:RUNNER_TEMP/review-delete-browser"
            New-Item -ItemType Directory -Path $reviewProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/review-deletion-browser-http.php "$bundle/application" $port $reviewProofDirectory 2>&1 | Tee-Object -Variable reviewProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($reviewProofOutput -join "`n") -match '(?m)^ORIGINAL_REVIEW_BROWSER_COMPLETE ')) { throw 'Original Review Edge fixture did not complete.' }
            $reviewReceipt = Get-Content "$reviewProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            $soundFixtureSha256 = (Get-FileHash tests/desktop_dashboard_runtime/browser-sound.cjs -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($reviewReceipt.soundFixtureSha256 -ne $soundFixtureSha256 -or !$reviewReceipt.soundFixtureVerifiedAfter) { throw 'Review browser sound helper differs from this exact fixture source.' }
            if (!$reviewReceipt.completed -or !$reviewReceipt.verifiedImport -or !$reviewReceipt.privateDatabasesDropped -or !$reviewReceipt.httpStopped -or !$reviewReceipt.browserStopped -or $reviewReceipt.sourceRevision -ne $env:GITHUB_SHA -or $reviewReceipt.importedSnapshotTables -ne 106 -or $reviewReceipt.checks -ne 7 -or $reviewReceipt.browserExitCode -ne 0 -or $reviewReceipt.browserProof.browser -ne 'Windows Edge' -or $reviewReceipt.browserProof.newPageErrors -ne 0 -or !$reviewReceipt.browserProof.committedResponseLost -or !$reviewReceipt.browserProof.originalFormRetrySameUuid) { throw 'Original Review Edge receipt does not match this complete source-bound fixture.' }
            $wishlistProofDirectory = "$env:RUNNER_TEMP/wishlist-delete-browser"
            New-Item -ItemType Directory -Path $wishlistProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/wishlist-deletion-browser-http.php "$bundle/application" $port $wishlistProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable wishlistProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($wishlistProofOutput -join "`n") -match '(?m)^ORIGINAL_WISHLIST_BROWSER_COMPLETE ')) { throw 'Original Wishlist Edge fixture did not complete.' }
            $wishlistReceipt = Get-Content "$wishlistProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            if (!$wishlistReceipt.completed -or !$wishlistReceipt.verifiedImport -or !$wishlistReceipt.privateDatabasesDropped -or !$wishlistReceipt.httpStopped -or !$wishlistReceipt.browserStopped -or !$wishlistReceipt.sourceVerifiedAfter -or !$wishlistReceipt.vendorUnchanged -or !$wishlistReceipt.mediaPreserved -or $wishlistReceipt.sourceRevision -ne $env:GITHUB_SHA -or $wishlistReceipt.fixtureRevision -ne $env:GITHUB_SHA -or $wishlistReceipt.importedSnapshotTables -ne 106 -or $wishlistReceipt.checks -ne 10 -or $wishlistReceipt.browserExitCode -ne 0 -or $wishlistReceipt.browserProof.browser -ne 'Windows Edge' -or $wishlistReceipt.browserProof.browserPlatform -ne 'win32' -or $wishlistReceipt.browserProof.sourceCommit -ne $env:GITHUB_SHA -or $wishlistReceipt.browserProof.fixtureRevision -ne $env:GITHUB_SHA -or $wishlistReceipt.browserProof.newPageErrors -ne 0 -or !$wishlistReceipt.browserProof.committedResponseLost -or !$wishlistReceipt.browserProof.originalFormRetrySameUuid -or $wishlistReceipt.fullDashboard -ne $false) { throw 'Original Wishlist Edge receipt does not match this complete source-bound fixture.' }
            $dateProofDirectory = "$env:RUNNER_TEMP/restaurant-date-http"
            New-Item -ItemType Directory -Path $dateProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/restaurant-nullable-date-http.php "$bundle/application" $port $dateProofDirectory fixed 2>&1 | Tee-Object -Variable dateProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($dateProofOutput -join "`n") -match '(?m)^RESTAURANT_NULLABLE_DATE_HTTP_COMPLETE ')) { throw 'Original restaurant date HTTP fixture did not complete.' }
            $dateReceipt = Get-Content "$dateProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            if (!$dateReceipt.completed -or !$dateReceipt.databaseDropped -or $dateReceipt.mode -ne 'fixed' -or $dateReceipt.sourceRevision -ne $env:GITHUB_SHA -or $dateReceipt.schemaTables -ne 106 -or $dateReceipt.checks -ne 24) { throw 'Original restaurant date receipt does not match this source and complete fixture.' }
            $flagsProofDirectory = "$env:RUNNER_TEMP/restaurant-flags-browser"
            New-Item -ItemType Directory -Path $flagsProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/restaurant-flags-browser-http.php "$bundle/application" $port $flagsProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable flagsProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($flagsProofOutput -join "`n") -match '(?m)^ORIGINAL_RESTAURANT_FLAGS_BROWSER_COMPLETE ')) { throw 'Original restaurant checkbox Edge fixture did not complete.' }
            $flagsReceipt = Get-Content "$flagsProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            if ($flagsReceipt.format -ne 1 -or $flagsReceipt.kind -ne 'original-restaurant-flags-and-ordering-browser') { throw 'Restaurant checkbox proof envelope differs.' }
            if (!$flagsReceipt.browserProof.actualAssociatedFormControls -or !$flagsReceipt.browserProof.exactSerializedCsrfAndUuid) { throw 'Restaurant checkbox proof must inspect original associated controls and exact transmitted CSRF/UUID fields.' }
            if ($flagsReceipt.schemaInventory -ne 106 -or $flagsReceipt.originalBusinessTablesBefore.tables -ne 106 -or $flagsReceipt.originalBusinessTablesAfter.tables -ne 106 -or $flagsReceipt.reflectionBindings -ne 5 -or $flagsReceipt.laravel -ne '8.83.29' -or $flagsReceipt.applicationValidated -ne $false -or $flagsReceipt.providersReplaced -ne $false -or @($flagsReceipt.browserProof.operations).Count -ne 6 -or @($flagsReceipt.browserProof.retries).Count -ne 2 -or !$flagsReceipt.browserProof.originalForm -or !$flagsReceipt.browserProof.originalQueryReadPreserved -or !$flagsReceipt.browserProof.originalCheckboxFormsHaveNoPageField -or $flagsReceipt.browserProof.force -ne $false -or $flagsReceipt.browserProof.domInjection -ne $false -or $flagsReceipt.vendorBefore.sha256 -ne $flagsReceipt.vendorAfter.sha256 -or $flagsReceipt.vendorBefore.files -ne $flagsReceipt.vendorAfter.files -or $flagsReceipt.installedGraphBefore.sha256 -ne $flagsReceipt.installedGraphAfter.sha256 -or $flagsReceipt.installedGraphBefore.packages -ne $flagsReceipt.installedGraphAfter.packages -or $flagsReceipt.originalBusinessTablesBefore.sha256 -ne $flagsReceipt.originalBusinessTablesAfter.sha256) { throw 'Restaurant checkbox proof inventory or immutable dependency/business binding differs.' }
            if (!$flagsReceipt.browserProof.originalFeaturedOrderingSubmit -or !$flagsReceipt.browserProof.originalSortingHasPageField -or $flagsReceipt.browserProof.featuredOrderingCommands -ne 2 -or $flagsReceipt.browserProof.featuredOrderingFinalValue -ne 8 -or $flagsReceipt.browserProof.sortingRetry.field -ne 'sortby_is_featured' -or !$flagsReceipt.browserProof.sortingRetry.committedResponseLost -or $flagsReceipt.browserProof.sortingRetry.changedSameUuidStatus -ne 409 -or !$flagsReceipt.browserProof.sortingRetry.persistedAfterChangedStillSeven -or $flagsReceipt.browserProof.sortingRetry.originalValueSameUuidStatus -ne 302 -or !$flagsReceipt.browserProof.sortingRetry.actualNumberAndSubmitControls -or $flagsReceipt.browserProof.sortingRetry.isNavigationRequest -ne $false -or $flagsReceipt.browserProof.sortingRetry.resourceType -ne 'fetch' -or !$flagsReceipt.browserProof.sortingRetry.originalFormRetainedAfterLoss) { throw 'Original featured ordering proof must use the original number/submit/page controls and retain UUID through lost/changed/original retries.' }
            if (!$flagsReceipt.completed -or !$flagsReceipt.verifiedImport -or !$flagsReceipt.privateDatabasesDropped -or !$flagsReceipt.httpStopped -or !$flagsReceipt.browserStopped -or !$flagsReceipt.sourceVerifiedAfter -or !$flagsReceipt.fixturesVerifiedAfter -or !$flagsReceipt.vendorUnchanged -or !$flagsReceipt.installedGraphUnchanged -or !$flagsReceipt.mediaPreserved -or !$flagsReceipt.originalBusinessTablesUnchanged -or $flagsReceipt.sourceRevision -ne $env:GITHUB_SHA -or $flagsReceipt.fixtureRevision -ne $env:GITHUB_SHA -or $flagsReceipt.importedSnapshotTables -ne 106 -or $flagsReceipt.targetColumnCount -ne 29 -or $flagsReceipt.commands -ne 6 -or $flagsReceipt.checks -ne 29 -or $flagsReceipt.browserExitCode -ne 0 -or $flagsReceipt.browserProof.browser -ne 'Windows Edge' -or $flagsReceipt.browserProof.browserPlatform -ne 'win32' -or $flagsReceipt.browserProof.sourceCommit -ne $env:GITHUB_SHA -or $flagsReceipt.browserProof.fixtureRevision -ne $env:GITHUB_SHA -or $flagsReceipt.browserProof.newPageErrors -ne 0 -or !$flagsReceipt.browserProof.originalCheckboxOnchange -or !$flagsReceipt.browserProof.checkedAndUncheckedBothFlags -or $flagsReceipt.browserProof.committedResponsesLost -ne 2 -or $flagsReceipt.browserProof.oppositeSameUuidRejected -ne 2 -or $flagsReceipt.browserProof.originalValueRetrySameUuid -ne 2 -or !$flagsReceipt.browserProof.freshUuidOnlyAfterAcceptedNavigation -or $flagsReceipt.fullDashboard -ne $false) { throw 'Original restaurant checkbox receipt does not match this complete source-bound fixture.' }
            $crudProofDirectory = "$env:RUNNER_TEMP/restaurant-product-crud-browser"
            New-Item -ItemType Directory -Path $crudProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/restaurant-product-crud-browser-http.php "$bundle/application" $port $crudProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable crudProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($crudProofOutput -join "`n") -match '(?m)^ORIGINAL_RESTAURANT_PRODUCT_CRUD_BROWSER_COMPLETE ')) { throw 'Original restaurant product CRUD Edge fixture did not complete.' }
            $crudReceipt = Get-Content "$crudProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            if ($crudReceipt.format -ne 1 -or $crudReceipt.kind -ne 'original-restaurant-product-crud-browser' -or $crudReceipt.sourceRevision -ne $env:GITHUB_SHA -or $crudReceipt.fixtureRevision -ne $env:GITHUB_SHA -or $crudReceipt.schemaInventory -ne 106 -or $crudReceipt.importedSnapshotTables -ne 106 -or $crudReceipt.targetColumnCount -ne 13 -or $crudReceipt.mediaColumnCount -ne 18 -or $crudReceipt.reflectionBindings -ne 8 -or $crudReceipt.checks -ne 30 -or $crudReceipt.commands -ne 4 -or $crudReceipt.fullDashboard -ne $false -or $crudReceipt.applicationValidated -ne $false) { throw 'Original CRUD receipt source, schema, bindings or bounded coverage differs.' }
            foreach ($field in @('completed','verifiedImport','privateDatabasesDropped','httpStopped','browserStopped','sourceVerifiedAfter','fixturesVerifiedAfter','vendorUnchanged','installedGraphUnchanged','mediaPreserved','originalBusinessTablesUnchanged','originalForm','actualAssociatedFormControls','exactSerializedCsrfAndUuid','retainedFileAfterLoss','changedSameUuid409','originalRetry302','createUpdateReplaceDelete')) {
              if ($crudReceipt.$field -ne $true) { throw "Original CRUD receipt is incomplete: $field" }
            }
            $crudProof = $crudReceipt.browserProof
            if ($crudReceipt.browserExitCode -ne 0 -or $crudProof.browser -ne 'Windows Edge' -or $crudProof.browserPlatform -ne 'win32' -or $crudProof.sourceCommit -ne $env:GITHUB_SHA -or $crudProof.fixtureRevision -ne $env:GITHUB_SHA -or $crudProof.newPageErrors -ne 0 -or $crudProof.force -ne $false -or $crudProof.domInjection -ne $false -or @($crudProof.operations).Count -ne 4) { throw 'Original CRUD browser proof differs from this complete fixture.' }
            foreach ($field in @('originalForm','actualAssociatedFormControls','exactSerializedCsrfAndUuid','retainedFileAfterLoss','changedSameUuid409','originalRetry302','createUpdateReplaceDelete','originalAddModal','originalEditModal','originalConfirmedDelete','originalMultipartFiles','originalAjaxCatalogAndAddons','noImageUpdate','replacementImageUpdate','originalQueryReadPreserved','freshUuidOnlyAfterAcceptedNavigation')) {
              if ($crudProof.$field -ne $true) { throw "Original CRUD browser proof did not exercise: $field" }
            }
            if ($crudReceipt.originalBusinessTablesBefore.tables -ne 106 -or $crudReceipt.originalBusinessTablesAfter.tables -ne 106 -or $crudReceipt.originalBusinessTablesBefore.sha256 -ne $crudReceipt.originalBusinessTablesAfter.sha256 -or $crudReceipt.vendorBefore.sha256 -ne $crudReceipt.vendorAfter.sha256 -or $crudReceipt.vendorBefore.files -ne $crudReceipt.vendorAfter.files -or $crudReceipt.installedGraphBefore.sha256 -ne $crudReceipt.installedGraphAfter.sha256 -or $crudReceipt.installedGraphBefore.packages -ne $crudReceipt.installedGraphAfter.packages) { throw 'Original CRUD immutable business or dependency inventories differ.' }
            $menuProofDirectory = "$env:RUNNER_TEMP/restaurant-menu-copy-browser"
            New-Item -ItemType Directory -Path $menuProofDirectory -Force | Out-Null
            & php tests/desktop_dashboard_runtime/restaurant-menu-copy-browser-http.php "$bundle/application" $port $menuProofDirectory $env:GITHUB_SHA 2>&1 | Tee-Object -Variable menuProofOutput
            if ($LASTEXITCODE -ne 0 -or !(($menuProofOutput -join "`n") -match '(?m)^ORIGINAL_RESTAURANT_MENU_COPY_BROWSER_COMPLETE ')) { throw 'Original restaurant menu-copy Edge fixture did not complete.' }
            $menuReceipt = Get-Content "$menuProofDirectory/receipt.json" -Raw | ConvertFrom-Json
            if ($menuReceipt.format -ne 1 -or $menuReceipt.kind -ne 'original-restaurant-menu-copy-browser' -or $menuReceipt.sourceRevision -ne $env:GITHUB_SHA -or $menuReceipt.fixtureRevision -ne $env:GITHUB_SHA -or $menuReceipt.schemaInventory -ne 106 -or $menuReceipt.importedSnapshotTables -ne 106 -or $menuReceipt.targetColumnCount -ne 29 -or $menuReceipt.productColumnCount -ne 13 -or $menuReceipt.mediaColumnCount -ne 18 -or $menuReceipt.reflectionBindings -ne 9 -or $menuReceipt.checks -ne 30 -or $menuReceipt.commands -ne 2 -or $menuReceipt.copiedProducts -ne 3 -or $menuReceipt.copiedImages -ne 2 -or $menuReceipt.sourceImagesImported -ne 4 -or $menuReceipt.fullDashboard -ne $false -or $menuReceipt.applicationValidated -ne $false -or $menuReceipt.providersReplaced -ne $false) { throw 'Original menu-copy receipt source, schema, bindings or bounded coverage differs.' }
            foreach ($field in @('completed','verifiedImport','privateDatabasesDropped','httpStopped','browserStopped','sourceVerifiedAfter','fixturesVerifiedAfter','vendorUnchanged','installedGraphUnchanged','originalBusinessTablesUnchanged','sourceImagesPreserved','fullImagesCopied','originalForm')) {
              if ($menuReceipt.$field -ne $true) { throw "Original menu-copy receipt is incomplete: $field" }
            }
            $menuProof = $menuReceipt.browserProof
            if ($menuReceipt.browserExitCode -ne 0 -or $menuProof.browser -ne 'Windows Edge' -or $menuProof.browserPlatform -ne 'win32' -or $menuProof.sourceCommit -ne $env:GITHUB_SHA -or $menuProof.fixtureRevision -ne $env:GITHUB_SHA -or $menuProof.newPageErrors -ne 0 -or $menuProof.force -ne $false -or $menuProof.domInjection -ne $false -or @($menuProof.operations).Count -ne 2 -or @($menuProof.formDiagnostics).Count -ne 2 -or @($menuProof.imageResponses).Count -ne 2 -or @($menuProof.visibleIds).Count -ne 3 -or @($menuReceipt.mediaFiles).Count -ne 2) { throw 'Original menu-copy browser proof differs from this complete fixture.' }
            foreach ($field in @('originalForm','originalChooseAddWay','originalCopyModal','actualAssociatedFormControls','exactSerializedCsrfAndUuid','originalCheckboxOrder','fullImagesCopied','existingPriceOnly','noImageClone','freshUuidOnlyAfterAcceptedNavigation')) {
              if ($menuProof.$field -ne $true) { throw "Original menu-copy browser proof did not exercise: $field" }
            }
            $menuRetry = $menuProof.retry
            if (!$menuRetry.committedResponseLost -or $menuRetry.changedSameUuidStatus -ne 409 -or $menuRetry.originalSelectionSameUuidStatus -ne 302 -or !$menuRetry.originalFormRetained -or !$menuRetry.originalCheckboxes -or $menuRetry.resourceType -ne 'fetch' -or $menuRetry.isNavigationRequest -ne $false -or $menuRetry.command -ne $menuProof.operations[0].command -or $menuProof.operations[0].command -eq $menuProof.operations[1].command) { throw 'Original menu-copy lost-response retry must retain the actual ordered form and UUID through lost302, changed409 and exact302.' }
            if ($menuReceipt.originalBusinessTablesBefore.tables -ne 106 -or $menuReceipt.originalBusinessTablesAfter.tables -ne 106 -or $menuReceipt.originalBusinessTablesBefore.sha256 -ne $menuReceipt.originalBusinessTablesAfter.sha256 -or $menuReceipt.vendorBefore.sha256 -ne $menuReceipt.vendorAfter.sha256 -or $menuReceipt.vendorBefore.files -ne $menuReceipt.vendorAfter.files -or $menuReceipt.installedGraphBefore.sha256 -ne $menuReceipt.installedGraphAfter.sha256 -or $menuReceipt.installedGraphBefore.packages -ne $menuReceipt.installedGraphAfter.packages) { throw 'Original menu-copy immutable business or dependency inventories differ.' }
            foreach ($receipt in @($wishlistReceipt,$flagsReceipt,$crudReceipt,$menuReceipt)) {
              if ($receipt.fixtureSourceBindings.'browser-sound.cjs' -ne $soundFixtureSha256) { throw 'A browser sound helper differs from its frozen fixture source.' }
            }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Retain the real Windows contract PDF and source-bound receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-contract-pdf-windows
          path: ${{ runner.temp }}/contract-pdf-windows
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original Review Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-review-delete-browser
          path: ${{ runner.temp }}/review-delete-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant date HTTP receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-date-http
          path: ${{ runner.temp }}/restaurant-date-http
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original Wishlist Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-wishlist-delete-browser
          path: ${{ runner.temp }}/wishlist-delete-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant checkbox Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-flags-browser
          path: ${{ runner.temp }}/restaurant-flags-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant product CRUD Edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-product-crud-browser
          path: ${{ runner.temp }}/restaurant-product-crud-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant menu-copy Edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-menu-copy-browser
          path: ${{ runner.temp }}/restaurant-menu-copy-browser
          if-no-files-found: error
          retention-days: 14
      - name: Verify native dashboard preparation and restart recovery
        shell: pwsh
        timeout-minutes: 25
        run: |
          node desktop-pos/test/generation-native.cjs "$env:RUNNER_TEMP/dashboard PDF bundle" $env:DESKTOP_TEST_SNAPSHOT_FILE
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows generation supervisor checks failed.' }
      - name: Check desktop reconciliation and existing POS regressions
        working-directory: desktop-pos
        run: node --test test/*.test.cjs ../tests/desktop_dashboard_runtime/protocol/offline-print-interleavings.test.cjs
      - name: Assemble and audit the installer runtime
        shell: pwsh
        run: |
          $installerPhpRoot = Split-Path (Get-Command php).Source
          $installerMariaExecutable = (Get-ChildItem "$env:RUNNER_TEMP/mariadb/*/bin/mariadbd.exe")[0].FullName
          $installerMariaRoot = Split-Path (Split-Path $installerMariaExecutable)
          node desktop-pos/build-runtime.cjs . desktop-pos/runtime-bundle desktop-pos/runtime $installerPhpRoot $installerMariaRoot $env:GITHUB_SHA "$env:DESKTOP_TEST_WKHTMLTOX"
          if ($LASTEXITCODE -ne 0) { throw 'Installer source packaging failed.' }
          New-Item -ItemType Directory -Path desktop-pos/dist -Force | Out-Null
          Copy-Item $env:DESKTOP_TEST_SNAPSHOT_FILE desktop-pos/dist/dashboard-synthetic-snapshot.json
          $auditJson = composer audit --locked --no-dev --format=json --working-dir=desktop-pos/runtime | Out-String
          $auditExitCode = $LASTEXITCODE
          if ($auditExitCode -notin @(0, 1, 2, 3)) { throw 'Runtime advisory review could not complete.' }
          $audit = @{ format = 1; exitCode = $auditExitCode; lockSha256 = (Get-FileHash desktop-pos/runtime/composer.lock -Algorithm SHA256).Hash.ToLowerInvariant(); result = ($auditJson | ConvertFrom-Json) }
          $audit | ConvertTo-Json -Depth 64 | Set-Content desktop-pos/dist/runtime-audit.json -Encoding utf8
          # Audit findings are retained above and checked by the release gate. GitHub's
          # PowerShell wrapper must not treat the handled advisory exit as a script failure.
          $global:LASTEXITCODE = 0
      - name: Retain the tested runtime for the installer job
        uses: actions/upload-artifact@v4
        with:
          name: tested-dashboard-runtime
          path: |
            desktop-pos/runtime-bundle
            desktop-pos/dist/runtime-audit.json
            desktop-pos/dist/dashboard-synthetic-snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  windows-installer:
    needs: original-runtime
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the exact runtime tested by the original application job
        # Download bytes first: v4's streamed extraction repeatedly failed with
        # the 48,821-file runtime under the runner's forced Node 24 environment.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/installer-runtime-download
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified runtime archive using Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/installer-runtime-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one verified runtime archive.' }
          $runtimeZip = "$env:RUNNER_TEMP/tested-runtime.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath desktop-pos -Force
          Remove-Item -LiteralPath $runtimeZip
          if (!(Test-Path desktop-pos/runtime-bundle/manifest.json)) { throw 'Runtime manifest was not extracted.' }
          if (!(Test-Path desktop-pos/dist/runtime-audit.json)) { throw 'Dependency review was not extracted.' }
          if (!(Test-Path desktop-pos/dist/dashboard-synthetic-snapshot.json)) { throw 'Synthetic installation fixture was not extracted.' }
      - name: Build the reviewed Windows installer preview
        shell: pwsh
        run: |
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron build dependencies failed.' }
          node .github/scripts/desktop-nsis-compile-deadline.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed compiler deadline setup failed.' }
          Copy-Item .github/scripts/desktop-runtime-copy-hook.cjs desktop-pos/runtime-copy-hook.cjs
          try {
            npm run build:win --prefix desktop-pos -- --config.afterPack=./runtime-copy-hook.cjs --config.nsis.script=installer-windows.nsi
            $buildResult = $LASTEXITCODE
          } finally {
            if (Test-Path desktop-pos/dist/nsis-build-drive.json) {
              $mapping = Get-Content desktop-pos/dist/nsis-build-drive.json -Raw | ConvertFrom-Json
              if ($mapping.drive -ne 'R:') { throw 'Unexpected compiler mapping.' }
              subst.exe $mapping.drive /d
            }
          }
          if ($buildResult -ne 0) { throw 'Windows installer preview failed.' }
      - name: Verify actual Windows installation and retained unsynced data
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node desktop-pos/test/installer-native.cjs
      - name: Retain the installer preview and exact verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: fasakhansta-dashboard-installer-preview
          path: |
            desktop-pos/dist/Fasakhansta-Dashboard-Preview-Setup.exe
            desktop-pos/dist/installer-checks.json
            desktop-pos/dist/runtime-package.json
            desktop-pos/dist/runtime-audit.json
          if-no-files-found: error
          retention-days: 30
