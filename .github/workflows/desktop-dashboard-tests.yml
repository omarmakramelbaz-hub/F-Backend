          path: ${{ runner.temp }}/customer-directory-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original employee identity Windows Edge and device receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-employee-identity-windows
          path: ${{ runner.temp }}/employee-identity-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original Review Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-review-delete-browser
          path: ${{ runner.temp }}/review-delete-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant date HTTP receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-date-http
          path: ${{ runner.temp }}/restaurant-date-http
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original Wishlist Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-wishlist-delete-browser
          path: ${{ runner.temp }}/wishlist-delete-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant checkbox Edge receipt
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-flags-browser
          path: ${{ runner.temp }}/restaurant-flags-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant product CRUD Edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-product-crud-browser
          path: ${{ runner.temp }}/restaurant-product-crud-browser
          if-no-files-found: error
          retention-days: 14
      - name: Retain the original restaurant menu-copy Edge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-restaurant-menu-copy-browser
          path: ${{ runner.temp }}/restaurant-menu-copy-browser
          if-no-files-found: error
          retention-days: 14
      - name: Verify native dashboard preparation and restart recovery
        shell: pwsh
        timeout-minutes: 25
        run: |
          node desktop-pos/test/generation-native.cjs "$env:RUNNER_TEMP/dashboard PDF bundle" $env:DESKTOP_TEST_SNAPSHOT_FILE
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows generation supervisor checks failed.' }
      - name: Check desktop reconciliation and existing POS regressions
        working-directory: desktop-pos
        run: node --test test/*.test.cjs ../tests/desktop_dashboard_runtime/protocol/offline-print-interleavings.test.cjs
      - name: Assemble and audit the installer runtime
        shell: pwsh
        run: |
          $installerPhpRoot = Split-Path (Get-Command php).Source
          $installerMariaExecutable = (Get-ChildItem "$env:RUNNER_TEMP/mariadb/*/bin/mariadbd.exe")[0].FullName
          $installerMariaRoot = Split-Path (Split-Path $installerMariaExecutable)
          node desktop-pos/build-runtime.cjs . desktop-pos/runtime-bundle desktop-pos/runtime $installerPhpRoot $installerMariaRoot $env:GITHUB_SHA "$env:DESKTOP_TEST_WKHTMLTOX"
          if ($LASTEXITCODE -ne 0) { throw 'Installer source packaging failed.' }
          New-Item -ItemType Directory -Path desktop-pos/dist -Force | Out-Null
          Copy-Item $env:DESKTOP_TEST_SNAPSHOT_FILE desktop-pos/dist/dashboard-synthetic-snapshot.json
          $auditJson = composer audit --locked --no-dev --format=json --working-dir=desktop-pos/runtime | Out-String
          $auditExitCode = $LASTEXITCODE
          if ($auditExitCode -ne 0) { throw 'The runtime dependency audit must complete without vulnerabilities or abandoned packages.' }
          $audit = @{ format = 1; exitCode = $auditExitCode; lockSha256 = (Get-FileHash desktop-pos/runtime/composer.lock -Algorithm SHA256).Hash.ToLowerInvariant(); result = ($auditJson | ConvertFrom-Json) }
          $audit | ConvertTo-Json -Depth 64 | Set-Content desktop-pos/dist/runtime-audit.json -Encoding utf8
      - name: Retain the tested runtime for the installer job
        uses: actions/upload-artifact@v4
        with:
          name: tested-dashboard-runtime
          path: |
            desktop-pos/runtime-bundle
            desktop-pos/dist/runtime-audit.json
            desktop-pos/dist/dashboard-synthetic-snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  windows-installer:
    needs: [original-runtime, connected-native]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve exact live source bytes at checkout
        if: github.ref == 'refs/heads/codex/go-erp-live-source-20261021' || github.ref == 'refs/heads/codex/go-erp-media-capacity-20261022' || github.ref == 'refs/heads/codex/go-erp-snapshot-transport-20261022'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout configuration failed.' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Exact live source checkout line-ending configuration failed.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the exact runtime tested by the original application job
        # Download bytes first: v4's streamed extraction repeatedly failed with
        # the 48,821-file runtime under the runner's forced Node 24 environment.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/installer-runtime-download
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified runtime archive using Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/installer-runtime-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one verified runtime archive.' }
          $runtimeZip = "$env:RUNNER_TEMP/tested-runtime.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath desktop-pos -Force
          Remove-Item -LiteralPath $runtimeZip
          if (!(Test-Path desktop-pos/runtime-bundle/manifest.json)) { throw 'Runtime manifest was not extracted.' }
          if (!(Test-Path desktop-pos/dist/runtime-audit.json)) { throw 'Dependency review was not extracted.' }
          if (!(Test-Path desktop-pos/dist/dashboard-synthetic-snapshot.json)) { throw 'Synthetic installation fixture was not extracted.' }
          $runtimeManifest = Get-Content desktop-pos/runtime-bundle/manifest.json -Raw | ConvertFrom-Json
          if ($runtimeManifest.sourceRevision -cne $env:GITHUB_SHA -or $runtimeManifest.runtimeFramework -cne '12.70.0') { throw 'The fresh tested runtime belongs to another source or engine.' }
      - name: Restore this source's actual connected Electron receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connected-request-native-windows
          path: desktop-pos/dist
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Require the connected receipt before packaging
        shell: pwsh
        run: |
          $connectedProof = Get-Content desktop-pos/dist/connected-request-native.json -Raw | ConvertFrom-Json
          $lockedConnectedElectron = (Get-Content desktop-pos/package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['packages']['node_modules/electron']['version']
          if ($connectedProof.electronVersion -isnot [string] -or $connectedProof.electronVersion -ne $lockedConnectedElectron) { throw 'The actual connected Electron process differs from its exact lock.' }
          if ($connectedProof.sourceRevision -ne $env:GITHUB_SHA -or $connectedProof.platform -ne 'win32' -or $connectedProof.hardware -isnot [bool] -or $connectedProof.hardware -ne $false -or $connectedProof.completed -isnot [bool] -or $connectedProof.completed -ne $true) { throw 'Native connected proof is incomplete or from another source.' }
          foreach ($field in @('actualElectronSessionFetch', 'actualWebRequest', 'actualDpapi', 'pinnedLoopbackHttps', 'pairedProofOnWire', 'internalMarkerStripped', 'foreignProofStripped', 'nativeReplayBlocked', 'fragmentNormalized', 'oldProtocolBlocked', 'lostReplyRetained', 'unboundedOriginalWrite', 'nativeReauthentication', 'expiredCookieBlocked', 'reauthSameActorProtocol', 'reauthWrongActorBlocked', 'reauthOldProtocolBlocked', 'reauthMutationBlocked', 'reauthCancelled', 'reauthPreservedMode', 'reauthNoPreload', 'reauthRedirectBlocked', 'nativeLocalReauthentication')) {
            if ($connectedProof.$field -isnot [bool] -or $connectedProof.$field -ne $true) { throw "Native connected proof is missing $field." }
          }
          if ($connectedProof.printedSources -ne 4 -or $connectedProof.originalWrites -ne 1 -or $connectedProof.invocations -ne 4 -or $connectedProof.lostPrintRequests -ne 1 -or $connectedProof.reauthentications -ne 6 -or $connectedProof.reauthOriginalSignins -ne 5 -or $connectedProof.reauthSuccesses -ne 3 -or $connectedProof.localReauthentications -ne 1) { throw 'Native connected proof did not complete every original request and print lifecycle.' }
      - name: Build the reviewed Windows installer preview
        shell: pwsh
        run: |
          & .github/scripts/prepare-desktop-vcredist.ps1 -Project desktop-pos
          $prerequisiteSummary = '(?m)^PASS 44 Visual C\+\+ prerequisite checks: missing/older/newer, cancellation, failure and restart; real signed payload=True; Windows executable lock=True\.$'
          & ./desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe 2>&1 | Tee-Object -Variable prerequisiteCoreOutput
          if ([regex]::Matches(($prerequisiteCoreOutput -join "`n"), $prerequisiteSummary).Count -ne 1) { throw 'PowerShell prerequisite checks did not complete exactly once with the real signed payload and executable lock.' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe 2>&1 | Tee-Object -Variable prerequisiteDesktopOutput
          if ($LASTEXITCODE -ne 0 -or [regex]::Matches(($prerequisiteDesktopOutput -join "`n"), $prerequisiteSummary).Count -ne 1) { throw 'Windows PowerShell prerequisite checks did not complete exactly once with the real signed payload and executable lock.' }
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron build dependencies failed.' }
          node desktop-pos/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0 -or !(Test-Path desktop-pos/node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron binary download did not complete.' }
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/print-effects-native.cjs desktop-pos/dist/offline-print-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron print lifecycle acceptance failed.' }
          $printProof = Get-Content desktop-pos/dist/offline-print-native.json -Raw | ConvertFrom-Json
          if ($printProof.sourceRevision -ne $env:GITHUB_SHA -or $printProof.platform -ne 'win32' -or $printProof.hardware -ne $false -or $printProof.invocations -ne 7 -or $printProof.accepted -ne 6 -or $printProof.review -ne 1) { throw 'Native print proof is incomplete or from another source.' }
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/outbox-review-native.cjs desktop-pos/dist/outbox-review-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Electron synchronization review and Windows DPAPI audit checks failed.' }
          $reviewProof = Get-Content desktop-pos/dist/outbox-review-native.json -Raw | ConvertFrom-Json
          if ($reviewProof.sourceRevision -ne $env:GITHUB_SHA -or $reviewProof.platform -ne 'win32' -or $reviewProof.completed -ne $true -or $reviewProof.actualDpapiAudit -ne $true -or $reviewProof.durableIntentBeforeRetry -ne $true -or $reviewProof.unchangedCommandId -ne $true) { throw 'Native review proof is incomplete or from another source.' }
          node .github/scripts/desktop-nsis-compile-deadline.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed compiler deadline setup failed.' }
          Copy-Item .github/scripts/desktop-runtime-copy-hook.cjs desktop-pos/runtime-copy-hook.cjs
          try {
            npm run build:win --prefix desktop-pos -- --config.afterPack=./runtime-copy-hook.cjs --config.nsis.script=installer-windows.nsi
            $buildResult = $LASTEXITCODE
          } finally {
            if (Test-Path desktop-pos/dist/nsis-build-drive.json) {
              $mapping = Get-Content desktop-pos/dist/nsis-build-drive.json -Raw | ConvertFrom-Json
              if ($mapping.drive -ne 'R:') { throw 'Unexpected compiler mapping.' }
              subst.exe $mapping.drive /d
            }
          }
          if ($buildResult -ne 0) { throw 'Windows installer preview failed.' }
      - name: Verify actual Windows installation and retained unsynced data
        shell: pwsh
        timeout-minutes: 40
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $diagnosedAcceptance = @'
          'use strict';
          const cp = require('node:child_process');
          const original = cp.execFileSync;
          cp.execFileSync = function (...args) {
            try { return Reflect.apply(original, this, args); }
            catch (error) {
              const bounded = value => value == null ? null : String(value).slice(0, 8192);
              process.stderr.write('DESKTOP_ACTUAL_CHILD_FAILURE ' + JSON.stringify({ executable: require('node:path').basename(String(args[0])), status: error.status ?? null, code: error.code ?? null, signal: error.signal ?? null, killed: error.killed ?? null, stdout: bounded(error.stdout), stderr: bounded(error.stderr) }) + '\n');
              throw error;
            }
          };
          require('./desktop-pos/test/installer-native.cjs');
          '@
          node -e $diagnosedAcceptance
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed dashboard acceptance failed; original child failure metadata was logged.' }
      - name: Bind the minute update publication to this accepted source and installer
        shell: pwsh
        run: |
          node .github/scripts/desktop-update-receipt.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'The accepted installer release receipt could not be created.' }
          node .github/scripts/desktop-live-source-acceptance.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'The current live-source acceptance receipt could not be created.' }
      - name: Retain the installer preview and exact verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: fasakhansta-dashboard-installer-preview
          path: |
            desktop-pos/dist/GO-ERP-Preview-Setup.exe
            desktop-pos/dist/installer-checks.json
            desktop-pos/dist/runtime-package.json
            desktop-pos/dist/runtime-audit.json
            desktop-pos/dist/prerequisites/vcredist-package.json
            desktop-pos/dist/offline-print-native.json
            desktop-pos/dist/outbox-review-native.json
            desktop-pos/dist/connected-request-native.json
            desktop-pos/dist/go-erp-update-release.json
            desktop-pos/dist/go-erp-live-source-acceptance.json
          if-no-files-found: error
          retention-days: 30
