name: Diagnose bundled PHP in Arabic Windows paths

on:
  push:
    branches: ['codex/runtime-ca-portability-20261009']
    paths: ['.github/workflows/desktop-php-path-probe.yml', '.github/scripts/desktop-php-path-probe.cjs']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  php-path-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the exact independently tested runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/php-probe-download
          run-id: 37991914018
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified archive with Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/php-probe-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified runtime archive.' }
          $zip = "$env:RUNNER_TEMP/php-probe.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $zip
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/php-probe" -Force
      - name: Probe the packaged PHP before rebuilding an installer
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/scripts/desktop-php-path-probe.cjs "${{ runner.temp }}/php-probe/runtime-bundle/php"
