name: Validate daily branch digest

on:
  push:
    branches: [codex/branch-daily-digest-20261106]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch immutable report sources
        env:
          DIGEST_SHA: ${{ github.sha }}
          DIGEST_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p digest
          for source in report.php template.php test.php install_root.sh; do
            curl --fail --silent --show-error --location --retry 2 \
              --proto '=https' --proto-redir '=https' --max-time 60 \
              "https://raw.githubusercontent.com/$DIGEST_REPO/$DIGEST_SHA/deployment/branch_daily_digest/$source" \
              -o "digest/$source"
          done
      - name: Check syntax and run report fixture tests
        run: |
          set -euo pipefail
          php --version
          bash -n digest/install_root.sh
          php -l digest/report.php
          php -l digest/template.php
          php -l digest/test.php
          php digest/test.php
          php digest/test.php --render-fixture > digest/fixture.html
          test -s digest/fixture.html
          systemd-analyze calendar '*-*-* 00:00:00 Africa/Cairo'
