name: GO ERP read-only watcher diagnosis
on:
  push:
    branches: [codex/go-erp-watcher-diagnosis-20261021]
  pull_request:
    paths:
      - 'deployment/diagnose_go_erp_live_watcher_root.py'
      - 'tests/test_go_erp_live_watcher_root.py'
      - '.github/workflows/go-erp-watcher-diagnosis.yml'
permissions:
  contents: read
jobs:
  read-only-watcher-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 10
      - name: Verify pinned read-only probes and private output boundaries
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_live_watcher_root.py
