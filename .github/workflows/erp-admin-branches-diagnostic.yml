name: ERP admin and branches diagnostic

on:
  push:
    branches:
      - codex/erp-admin-orders-and-branches-20261002
    paths:
      - '.github/workflows/erp-admin-branches-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Inspect production ERP account and branches
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519             -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20             root@187.127.92.124 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/fasakha/public_html
          echo "HEAD=$(git rev-parse HEAD)"
          runuser -u fasakha -- php artisan tinker --execute='
          echo "__ADMIN_MATCHES__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("users")
            ->where(function($q){
              $q->whereRaw("LOWER(email) = ?", ["omarmakramelbazz@gmail.com"])
                ->orWhereRaw("LOWER(email) = ?", ["omarmakramelbaz@gmail.com"]);
            })
            ->select("id","name","email","account_type")
            ->get() as $u) {
              $roles = \Illuminate\Support\Facades\DB::table("model_has_roles")->where("model_id",$u->id)->pluck("role_id")->implode(",");
              echo json_encode(["id"=>$u->id,"name"=>$u->name,"email"=>$u->email,"account_type"=>$u->account_type,"roles"=>$roles],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo "__ERP_BRANCHES__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("erp_branches")->orderBy("id")->get() as $b) {
              echo json_encode($b,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo "__RESTAURANTS__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("resturants")
            ->select("id","name","status","parent_id","user_id","added_by")
            ->orderBy("id")->get() as $r) {
              echo json_encode($r,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }'
          REMOTE
