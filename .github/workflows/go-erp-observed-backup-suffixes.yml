name: GO ERP observed source backup suffixes
on:
  push:
    branches: [codex/go-erp-observed-backup-suffixes-20261021]
  pull_request:
    paths:
      - 'deployment/archive_go_erp_meta_backups_root.py'
      - 'tests/test_go_erp_meta_backup_archive_root.py'
      - 'tests/test_go_erp_backup_redacted_inventory.py'
      - '.github/workflows/go-erp-observed-backup-suffixes.yml'
permissions:
  contents: read
jobs:
  observed-backup-suffixes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
      - name: Verify exact suffixes, retained originals and legacy custody
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_meta_backup_archive_root.py
      - name: Verify redacted backup inventory remains metadata only
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_backup_redacted_inventory.py
