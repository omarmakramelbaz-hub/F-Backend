name: ERP admin SSO diagnostic

on:
  push:
    branches:
      - codex/erp-admin-sso-fix-20261002
    paths:
      - '.github/workflows/erp-admin-sso-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Inspect designated admin account
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519             -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20             root@187.127.92.124 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/fasakha/public_html
          runuser -u fasakha -- php artisan tinker --execute='
          foreach (\Illuminate\Support\Facades\DB::table("users")
            ->whereRaw("LOWER(email) = ?", ["omarmakramelbazz@gmail.com"])
            ->select("id","name","email","account_type")
            ->get() as $u) {
              $roles = \Illuminate\Support\Facades\DB::table("model_has_roles")->where("model_id",$u->id)->pluck("role_id")->implode(",");
              echo "__ACCOUNT__".json_encode(["id"=>$u->id,"name"=>$u->name,"email"=>$u->email,"account_type"=>$u->account_type,"roles"=>$roles],JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          echo "__CONFIG__".json_encode(config("erp.legacy_order_admin_emails"),JSON_UNESCAPED_UNICODE).PHP_EOL;
          '
          REMOTE
