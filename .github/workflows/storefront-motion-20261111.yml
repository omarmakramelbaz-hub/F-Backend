name: Storefront motion UI checks

on:
  push:
    branches:
      - codex/storefront-motion-live-20261111
    paths:
      - resources/views/site/home.blade.php
      - resources/views/site/motion/header.blade.php
      - resources/views/site/motion/hero.blade.php
      - resources/views/site/motion/directory.blade.php
      - resources/views/site/motion/products.blade.php
      - resources/views/site/motion/visit.blade.php
      - resources/views/site/motion/app.blade.php
      - resources/views/site/motion/contact.blade.php
      - resources/views/site/motion/footer.blade.php
      - public/storefront/storefront.js
      - public/storefront/motion.js
      - public/storefront/motion.css
      - public/storefront/motion-regular.woff
      - public/storefront/motion-bold.woff
      - public/storefront/motion-logo.webp
      - public/storefront/hero-motion.mp4
      - public/storefront/hero-motion-poster.webp
      - public/storefront/fasakhansta-qr.png
      - public/storefront/fasakhansta-qr.svg
      - tests/storefront/**
      - deployment/storefront-motion-20261111/**
      - .github/workflows/storefront-motion-20261111.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fasakhansta-storefront-motion-production
  cancel-in-progress: false

jobs:
  storefront:
    if: github.repository == 'omarmakramelbaz-hub/F-Backend' && github.ref == 'refs/heads/codex/storefront-motion-live-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the exact public source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/omarmakramelbaz-hub/F-Backend.git
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated storefront test dependencies
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/storefront-test-deps" --ignore-scripts --no-audit --no-fund happy-dom@21.0.4
      - name: Validate storefront contract and deployment source
        shell: bash
        run: |
          set -euo pipefail
          node --check public/storefront/storefront.js
          node --check public/storefront/motion.js
          NODE_PATH="$RUNNER_TEMP/storefront-test-deps/node_modules" node --test tests/storefront/*.test.cjs
          bash -n deployment/storefront-motion-20261111/run_root.sh
          python3 -m py_compile deployment/storefront-motion-20261111/install.py
          python3 deployment/storefront-motion-20261111/install.py --revision "$GITHUB_SHA" --check-local "$GITHUB_WORKSPACE"
