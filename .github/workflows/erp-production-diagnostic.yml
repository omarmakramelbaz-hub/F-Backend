name: ERP production diagnostic

on:
  push:
    branches:
      - codex/fasakhansta-erp-orders-ui-20261002
    paths:
      - '.github/workflows/erp-production-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Check ERP production render
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519             -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20             root@187.127.92.124 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/fasakha/public_html
          echo "HEAD=$(git rev-parse HEAD)"
          code=$(curl -ksS -o /tmp/erp-login.html -w '%{http_code}'             --resolve fasakhaninja.com:443:127.0.0.1             https://fasakhaninja.com/erp/login || true)
          echo "ERP_LOGIN_HTTP=$code"
          head -c 120 /tmp/erp-login.html | tr '\n' ' '; echo

          cat >/tmp/erp-render-probe.php <<'PHP'
          <?php
          use Illuminate\Support\Facades\Auth;
          use Illuminate\Support\Facades\Facade;
          use Illuminate\Http\Request;
          try {
              require __DIR__.'/vendor/autoload.php';
              $app=require __DIR__.'/bootstrap/app.php';
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              config(['session.driver'=>'array']);
              $app['session']->forgetDrivers();
              $owner=Auth::guard('admin')->getProvider()->retrieveById((int)config('erp.legacy_owner_id'));
              if(!$owner) throw new RuntimeException('ERP owner not found');
              Auth::guard('admin')->setUser($owner);
              $url=rtrim((string)config('app.url'),'/');
              $r=Request::create($url.'/erp/orders','GET');
              $app->instance('request',$r);
              Facade::clearResolvedInstance('request');
              $app['url']->setRequest($r);
              $response=$app['router']->dispatch($r);
              echo "ERP_ORDERS_STATUS=".$response->getStatusCode().PHP_EOL;
              echo "ERP_ORDERS_BYTES=".strlen((string)$response->getContent()).PHP_EOL;
          } catch (Throwable $e) {
              echo "ERP_ORDERS_EXCEPTION=".get_class($e).PHP_EOL;
              echo "ERP_ORDERS_MESSAGE=".$e->getMessage().PHP_EOL;
              echo "ERP_ORDERS_FILE=".$e->getFile().":".$e->getLine().PHP_EOL;
              exit(2);
          }
          PHP
          sed -i "s#__DIR__.'/vendor#__DIR__.'/home/fasakha/public_html/vendor#" /tmp/erp-render-probe.php || true
          # Execute from app root using a self-contained inline probe instead.
          runuser -u fasakha -- php -r '
          chdir("/home/fasakha/public_html");
          require "vendor/autoload.php";
          $app=require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          config(["session.driver"=>"array"]);
          $app["session"]->forgetDrivers();
          $owner=Illuminate\Support\Facades\Auth::guard("admin")->getProvider()->retrieveById((int)config("erp.legacy_owner_id"));
          if(!$owner){fwrite(STDERR,"ERP owner not found\n");exit(2);}
          Illuminate\Support\Facades\Auth::guard("admin")->setUser($owner);
          $url=rtrim((string)config("app.url"),"/");
          try{
            $r=Illuminate\Http\Request::create($url."/erp/orders","GET");
            $app->instance("request",$r);
            Illuminate\Support\Facades\Facade::clearResolvedInstance("request");
            $app["url"]->setRequest($r);
            $response=$app["router"]->dispatch($r);
            echo "ERP_ORDERS_STATUS=".$response->getStatusCode().PHP_EOL;
            echo "ERP_ORDERS_BYTES=".strlen((string)$response->getContent()).PHP_EOL;
          }catch(Throwable $e){
            echo "ERP_ORDERS_EXCEPTION=".get_class($e).PHP_EOL;
            echo "ERP_ORDERS_MESSAGE=".$e->getMessage().PHP_EOL;
            echo "ERP_ORDERS_FILE=".$e->getFile().":".$e->getLine().PHP_EOL;
            exit(2);
          }'
          echo "LATEST_LARAVEL_ERRORS"
          tail -n 180 storage/logs/laravel.log 2>/dev/null | grep -E 'production.ERROR|local.ERROR|ErrorException|ParseError|ViewException|orders.blade|layout.blade' | tail -n 30 || true
          REMOTE
