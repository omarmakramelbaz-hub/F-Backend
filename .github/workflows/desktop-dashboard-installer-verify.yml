name: Verify installer from tested dashboard runtime

on:
  push:
    branches: ['codex/runtime-ca-portability-20261009']
    paths: ['.github/workflows/desktop-dashboard-installer-verify.yml']
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: 'Run whose original-runtime job passed and retained the exact runtime'
        required: true
        default: '37991914018'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DESKTOP_TESTED_RUN: ${{ inputs.runtime_run_id || '37991914018' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: current-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the original runtime checks to have passed
        shell: pwsh
        env:
          DESKTOP_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          if ($env:DESKTOP_TESTED_RUN -notmatch '^[1-9][0-9]+$') { throw 'Invalid source run.' }
          $headers = @{ Authorization = "Bearer $env:DESKTOP_ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
          $jobs = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN/jobs?per_page=100"
          if (!($jobs.jobs | Where-Object { $_.name -eq 'original-runtime' -and $_.conclusion -eq 'success' })) { throw 'The source runtime has not passed its original application checks.' }
      - name: Restore the exact tested runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/runtime-download
          run-id: ${{ env.DESKTOP_TESTED_RUN }}
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified archive with Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/runtime-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified runtime archive.' }
          $runtimeZip = "$env:RUNNER_TEMP/tested-runtime.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath "$env:RUNNER_TEMP/tested-runtime" -Force
          Remove-Item -LiteralPath $runtimeZip
      - name: Require identical current product code
        id: source
        working-directory: current-source
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP/tested-runtime/runtime-bundle/manifest.json" -Raw | ConvertFrom-Json
          $sourceRevision = $manifest.sourceRevision
          if ($sourceRevision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid tested source revision.' }
          git fetch --depth=1 origin $sourceRevision
          if ($LASTEXITCODE -ne 0) { throw 'The tested revision cannot be independently checked.' }
          $changed = @(& git diff --name-only $sourceRevision HEAD -- app bootstrap config database desktop public resources routes artisan composer.json composer.lock .gitattributes desktop-pos)
          if ($LASTEXITCODE -ne 0) { throw 'The tested source comparison failed.' }
          if ($changed.Count) { throw 'Current application, package or installed-recovery test code differs from the cached runtime; run the full original dashboard checks first.' }
          "revision=$sourceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: b
      - name: Restore verified inputs into their tested checkout
        shell: pwsh
        run: |
          Move-Item "$env:RUNNER_TEMP/tested-runtime/runtime-bundle" b/desktop-pos/runtime-bundle
          New-Item -ItemType Directory -Path b/desktop-pos/dist -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/runtime-audit.json" b/desktop-pos/dist/runtime-audit.json
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/dashboard-synthetic-snapshot.json" b/desktop-pos/dist/dashboard-synthetic-snapshot.json
      - name: Build the installer with exact source and dependency verification
        working-directory: b
        shell: pwsh
        run: |
          & .github/scripts/prepare-desktop-vcredist.ps1 -Project desktop-pos
          & ./desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell prerequisite checks failed.' }
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron build dependencies failed.' }
          node desktop-pos/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0 -or !(Test-Path desktop-pos/node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron binary download did not complete.' }
          $lockedElectron = (Get-Content desktop-pos/package-lock.json -Raw | ConvertFrom-Json).packages.'node_modules/electron'.version
          $electronVersion = & ./desktop-pos/node_modules/electron/dist/electron.exe --version
          if ($LASTEXITCODE -ne 0 -or (($electronVersion -join "`n").Trim() -ne "v$lockedElectron")) { throw 'The actual Electron executable differs from its locked package.' }
          & ./desktop-pos/node_modules/electron/dist/electron.exe desktop-pos/test/print-effects-native.cjs desktop-pos/dist/offline-print-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron print lifecycle acceptance failed.' }
          $printProof = Get-Content desktop-pos/dist/offline-print-native.json -Raw | ConvertFrom-Json
          if ($printProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $printProof.platform -ne 'win32' -or $printProof.hardware -ne $false -or $printProof.invocations -ne 7 -or $printProof.accepted -ne 6 -or $printProof.review -ne 1) { throw 'Native print proof is incomplete or from another source.' }
          & ./desktop-pos/node_modules/electron/dist/electron.exe desktop-pos/test/outbox-review-native.cjs desktop-pos/dist/outbox-review-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Electron synchronization review and Windows DPAPI audit checks failed.' }
          $reviewProof = Get-Content desktop-pos/dist/outbox-review-native.json -Raw | ConvertFrom-Json
          if ($reviewProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $reviewProof.platform -ne 'win32' -or $reviewProof.completed -ne $true -or $reviewProof.actualDpapiAudit -ne $true -or $reviewProof.durableIntentBeforeRetry -ne $true -or $reviewProof.unchangedCommandId -ne $true) { throw 'Native review proof is incomplete or from another source.' }
          & ./desktop-pos/node_modules/electron/dist/electron.exe desktop-pos/test/connected-request-native.cjs desktop-pos/dist/connected-request-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron connected request acceptance failed.' }
          $connectedProof = Get-Content desktop-pos/dist/connected-request-native.json -Raw | ConvertFrom-Json
          if ($connectedProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $connectedProof.platform -ne 'win32' -or $connectedProof.hardware -isnot [bool] -or $connectedProof.hardware -ne $false -or $connectedProof.completed -isnot [bool] -or $connectedProof.completed -ne $true) { throw 'Native connected proof is incomplete or from another source.' }
          foreach ($field in @('actualElectronSessionFetch', 'actualWebRequest', 'actualDpapi', 'pinnedLoopbackHttps', 'pairedProofOnWire', 'internalMarkerStripped', 'foreignProofStripped', 'nativeReplayBlocked', 'fragmentNormalized', 'oldProtocolBlocked', 'lostReplyRetained', 'unboundedOriginalWrite')) {
            if ($connectedProof.$field -isnot [bool] -or $connectedProof.$field -ne $true) { throw "Native connected proof is missing $field." }
          }
          if ($connectedProof.printedSources -ne 4 -or $connectedProof.originalWrites -ne 1 -or $connectedProof.invocations -ne 4 -or $connectedProof.lostPrintRequests -ne 1) { throw 'Native connected proof did not complete every original request and print lifecycle.' }
          node ../current-source/.github/scripts/desktop-nsis-compile-deadline.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed compiler deadline setup failed.' }
          # The preview preserves long installation paths and every verified runtime byte.
          Copy-Item ../current-source/.github/scripts/desktop-runtime-copy-hook.cjs desktop-pos/runtime-copy-hook.cjs
          try {
            npm run build:win --prefix desktop-pos -- --config.afterPack=./runtime-copy-hook.cjs --config.nsis.script=installer-windows.nsi
            $buildResult = $LASTEXITCODE
          } finally {
            if (Test-Path desktop-pos/dist/nsis-build-drive.json) {
              $mapping = Get-Content desktop-pos/dist/nsis-build-drive.json -Raw | ConvertFrom-Json
              if ($mapping.drive -ne 'R:') { throw 'Unexpected compiler mapping.' }
              subst.exe $mapping.drive /d
            }
          }
          if ($buildResult -ne 0) { throw 'Windows installer preview failed.' }
      - name: Verify actual installed dashboard recovery and retained unsynced data
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: b
        run: node desktop-pos/test/installer-native.cjs
      - name: Retain only the verified installer and receipts
        uses: actions/upload-artifact@v4
        with:
          name: fasakhansta-dashboard-installer-preview
          path: |
            b/desktop-pos/dist/Fasakhansta-Dashboard-Preview-Setup.exe
            b/desktop-pos/dist/installer-checks.json
            b/desktop-pos/dist/runtime-package.json
            b/desktop-pos/dist/runtime-audit.json
            b/desktop-pos/dist/prerequisites/vcredist-package.json
            b/desktop-pos/dist/offline-print-native.json
            b/desktop-pos/dist/outbox-review-native.json
            b/desktop-pos/dist/connected-request-native.json
          if-no-files-found: error
          retention-days: 30
