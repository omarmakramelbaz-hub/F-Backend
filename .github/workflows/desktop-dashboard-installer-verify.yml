            need(source.same(fingerprint,SOURCE),'Current selected application source fingerprint differs.');clean();
            const originalRecord=path.join(dist,'runtime-reuse-original-manifest.json'),proofPath=path.join(dist,'runtime-assembly-provenance.json');
