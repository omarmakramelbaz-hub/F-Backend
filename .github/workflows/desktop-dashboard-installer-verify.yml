              originArtifactVerification:'Exact run189 API identity and artifact archive byte digest must pass workflow checks before this script; retained full before-inventory derives from those restored runtime bytes.'};
            const handle=await fs.open(proofPath,'wx',0o600);proofOwned=true;
            try{await handle.writeFile(JSON.stringify(proof,null,2)+'\n');await handle.sync();}finally{await handle.close();}
