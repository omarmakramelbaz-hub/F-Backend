              sourceLoaded = $false
          }
          $failed = $false
          try {
              $projectRoot = [IO.Path]::GetFullPath($Project)
              $payloadPath = Join-Path $projectRoot 'dist/prerequisites/vc_redist.x64.exe'
              $policyPath = Join-Path $projectRoot 'windows-vcredist.json'
              # Dot-sourcing defines functions only; the source's executable entry point is not entered.
              . (Join-Path $projectRoot 'windows-vcredist.ps1') -Action ValidatePayload -PayloadPath $payloadPath -PolicyPath $policyPath
              $report.sourceLoaded = $true
              $policy = Read-DesktopVcPolicy -Path $policyPath
              $report.policy = [ordered]@{
                  architecture = [string]$policy.architecture; minimumVersion = [string]$policy.version
                  bytes = [long]$policy.bytes; sha256 = [string]$policy.sha256; signerSha256 = [string]$policy.signerSha256
              }
              $report.unlocked = Test-ProbePayload -Path $payloadPath -Policy $policy -Locked $false
              $report.locked = Test-ProbePayload -Path $payloadPath -Policy $policy -Locked $true
              if (-not $report.unlocked.success -or -not $report.locked.success) { $failed = $true }
              try {
