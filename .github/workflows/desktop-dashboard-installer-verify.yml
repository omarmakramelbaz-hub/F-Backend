          # Write exact Git blob bytes rather than relying on Windows text conversion.
          node -e "const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');const blob=process.env.DESKTOP_ACCEPTANCE_FIXTURE_BLOB;const bytes=cp.execFileSync('git',['cat-file','blob',blob],{cwd:'current-source'});const hash=data=>crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');if(hash(bytes)!==blob)throw Error('Acceptance source blob mismatch');const file=path.join('b','desktop-pos','test','installer-prerequisite-native.cjs');fs.writeFileSync(file,bytes);if(hash(fs.readFileSync(file))!==blob)throw Error('Acceptance overlay changed');const proof={format:1,testedRun:39363944148,testedArtifact:12240055641,sourceRevision:process.env.DESKTOP_PRODUCT_SOURCE,acceptanceRevision:process.env.DESKTOP_ACCEPTANCE_REVISION,fixturePath:'desktop-pos/test/installer-prerequisite-native.cjs',fixtureBlob:blob,productChanged:true,applicationChanged:false,prerequisiteBootstrapChanged:true,inheritedRuntimeSource:'48b1d0fae8de73a97ab07b53ca0a0667830bf3d9'};fs.writeFileSync(path.join('b','desktop-pos','dist','installer-acceptance-provenance.json'),JSON.stringify(proof,null,2)+'\n');console.log('DESKTOP_INSTALLER_ACCEPTANCE_PROVENANCE '+JSON.stringify(proof));"
          if ($LASTEXITCODE -ne 0) { throw 'The exact reviewed acceptance overlay could not be applied.' }
      - name: Verify actual installed dashboard recovery and retained unsynced data
        env:
