          $promoterPath = Join-Path $env:RUNNER_TEMP 'desktop-promote-tested-runtime.cjs'
          [IO.File]::WriteAllText($promoterPath, $promoter, (New-Object Text.UTF8Encoding($false)))
          node $promoterPath desktop-pos $env:DESKTOP_CURRENT_SOURCE
