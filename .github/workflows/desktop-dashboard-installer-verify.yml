name: Verify installer from tested dashboard runtime

# Historical run176 recovery: the four-path guard below preserves its original
# package metadata and Fasakhansta setup filename. GO ERP branding and changed
# application source require fresh acceptance in desktop-dashboard-tests.yml.
on:
  push:
    branches: ['codex/runtime-ca-portability-20261009']
    paths: ['.github/workflows/desktop-dashboard-installer-verify.yml']
  pull_request:
    branches: ['codex/desktop-current-dashboard-20261019']
    paths: ['.github/workflows/desktop-dashboard-installer-verify.yml', 'desktop-pos/test/installer-prerequisite-native.cjs']
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: 'Run whose original-runtime job passed and retained the exact runtime'
        required: true
        default: '39363944148'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prerequisite-control:
    # Fast positive control must pass before restoring and compiling the complete app.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the original signed payload and pinned compiler dependencies
        shell: pwsh
        run: |
          $revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'The diagnostic source changed.' }
          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic product checkout is not clean.' }
          & .github/scripts/prepare-desktop-vcredist.ps1 -Project desktop-pos
          & ./desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'The fixed Windows PowerShell prerequisite regressions failed.' }
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned diagnostic compiler dependencies failed.' }
      - name: Diagnose the original prerequisite and capture its otherwise silent child output
        shell: pwsh
        run: |
          $control = @'
          'use strict';
          // DIAGNOSTIC ONLY. This is neither a release build nor an acceptance receipt.
          // It embeds the reviewed prerequisite and installer with a private tiny app.
          // It must never be run on a production machine. No repository files are written.
          const fs=require('node:fs/promises'),path=require('node:path'),os=require('node:os'),assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const {execFileSync,spawnSync}=require('node:child_process');
          const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const nsisString=value=>value.replaceAll('$',()=> '$$').replaceAll('"','$\\"');
          const psString=value=>"'"+value.replaceAll("'","''")+"'";
          const bounded=value=>String(value||'').slice(0,8192);
          async function main(){
            assert.equal(process.platform,'win32','This diagnostic requires a disposable Windows runner.');
            const project=path.resolve(process.argv[2]||'desktop-pos'),choice=process.argv[3]||'original';
            assert.ok(['original','capture','both'].includes(choice),'Choose original, capture, or both.');
            const lock=JSON.parse(await fs.readFile(path.join(project,'package-lock.json'),'utf8'));
            const pinned=lock.packages['node_modules/app-builder-lib'].version;
            assert.equal(pinned,'26.15.3');
            const resolver=require.resolve('app-builder-lib/out/toolsets/windows.js',{paths:[project]});
            const installed=JSON.parse(await fs.readFile(path.resolve(path.dirname(resolver),'../../package.json'),'utf8'));
            assert.equal(installed.version,pinned);
            const build=JSON.parse(await fs.readFile(path.join(project,'package.json'),'utf8')).build||{};
            const compiler=await require(resolver).getMakeNsisPath(build.toolsets?.nsis,build.nsis?.customNsisBinary);
            assert.ok((await fs.stat(compiler.path)).isFile());
            const powershell=path.join(process.env.SystemRoot,'System32/WindowsPowerShell/v1.0/powershell.exe');
            const script=path.join(project,'windows-vcredist.ps1'),policyPath=path.join(project,'windows-vcredist.json');
            const payloadPath=path.join(project,'dist/prerequisites/vc_redist.x64.exe');
            const policy=JSON.parse(await fs.readFile(policyPath,'utf8')),payload=await fs.readFile(payloadPath);
            assert.equal(payload.length,policy.bytes);assert.equal(digest(payload),policy.sha256);
            // Dot sourcing never invokes Initialize-DesktopVcRuntime. Refuse the control
            // unless the original helper already observes its registered minimum runtime.
            const preflightCommand="$ErrorActionPreference='Stop'; Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -ErrorAction Stop; Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1') -ErrorAction Stop; . "+psString(script)+" -Action ValidatePayload -PayloadPath "+psString(payloadPath)+" -PolicyPath "+psString(policyPath)+"; "
              +"$p=Read-DesktopVcPolicy -Path "+psString(policyPath)+"; "
              +"$v=Get-DesktopVcInstalledVersion; if(-not [Environment]::Is64BitOperatingSystem -or $null -eq $v -or $v -lt [version]$p.version){throw 'Control refused: the required runtime is not already registered.'}; "
              +"$null=Test-DesktopVcPayload -Path "+psString(payloadPath)+" -Policy $p; "
              +"[pscustomobject]@{installedVersion=$v.ToString();minimumVersion=[string]$p.version;desktop=[Environment]::GetFolderPath('DesktopDirectory');programs=[Environment]::GetFolderPath('Programs')} | ConvertTo-Json -Compress";
            const preflight=()=>JSON.parse(execFileSync(powershell,['-NoProfile','-NonInteractive','-Command',preflightCommand],
              {windowsHide:true,encoding:'utf8',timeout:30000}));
            const before=preflight();assert.ok(before.desktop&&before.programs);
            const original=await fs.readFile(path.join(project,'installer.nsi'),'utf8');
            const reviewed=original.replace(/\$\{PROJECT_DIR\}\/[^"\r\n]+/g,value=>value.replaceAll('/','\\'))
              .replace('SetCompressor /SOLID lzma','SetCompressor /SOLID zlib');
            assert.equal(reviewed.match(/nsExec::ExecToLog /g)?.length,1);
            const reports=[];
            for(const mode of choice==='both'?['original','capture']:[choice]){
              // Recheck immediately before each execution. No helper install is performed
              // by this preflight, and the already-installed path cannot request UAC.
              const guarded=preflight();assert.equal(guarded.installedVersion,before.installedVersion);
              const root=await fs.mkdtemp(path.join(os.tmpdir(),'fasakhansta-vc-control-'));
              const fixture=path.join(root,'fixture'),target=path.join(root,'installed'),setup=path.join(root,'control.exe');
              const childLog=path.join(root,'diagnostic-child.log');
              const key='FasakhanstaVcControl-'+path.basename(root),product='Fasakhansta VC Control '+path.basename(root);
              const registrationPath='HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\'+key;
              const shortcut=path.join(before.desktop,product+'.lnk'),menu=path.join(before.programs,product);
              const report={format:1,diagnosticOnly:true,mode,sourceSha256:digest(original),reviewedSha256:digest(reviewed),
                prerequisiteSha256:digest(payload),registeredBefore:guarded.installedVersion};
              try{
                await fs.mkdir(path.join(fixture,'dist/win-unpacked/resources'),{recursive:true});
                await fs.mkdir(path.join(fixture,'dist/prerequisites'),{recursive:true});
                await fs.mkdir(path.join(fixture,'src/assets'),{recursive:true});
                await fs.mkdir(target);await fs.writeFile(path.join(target,'KEEP.txt'),'unrelated original file');
                await fs.copyFile(path.join(project,'src/assets/app.ico'),path.join(fixture,'src/assets/app.ico'));
                await fs.copyFile(path.join(project,'src/assets/app.ico'),path.join(fixture,'dist/win-unpacked/resources/app.ico'));
                for(const name of ['windows-vcredist.json','windows-vcredist.ps1'])await fs.copyFile(path.join(project,name),path.join(fixture,name));
                await fs.writeFile(path.join(fixture,'dist/prerequisites/vc_redist.x64.exe'),payload);
                await fs.writeFile(path.join(fixture,'dist/win-unpacked/CONTROL-PAYLOAD.txt'),'untampered prerequisite control');
                await fs.writeFile(path.join(fixture,'dist/installer-version.nsh'),
                  '!define FASAKHANSTA_VERSION "0.0.0"\n!define FASAKHANSTA_PRODUCT_NAME "'+product+'"\n'
                  +'!define FASAKHANSTA_UNINSTALL_KEY "'+key+'"\n');
                await fs.writeFile(path.join(fixture,'dist/uninstall-files.nsh'),
                  'Delete "$INSTDIR\\CONTROL-PAYLOAD.txt"\nDelete "$INSTDIR\\resources\\app.ico"\nRMDir "$INSTDIR\\resources"\n');
                let source=reviewed;
                if(mode==='capture'){
                  // The diagnostic variant changes only the plugin's output destination
                  // and drains its extra output stack entry into a private temporary log.
                  // $0 still contains the original return code; every branch is unchanged.
                  source=source.replace('nsExec::ExecToLog ','nsExec::ExecToStack ');
                  assert.equal(source.match(/  Pop \$0\r?\n/g)?.length,1);
                  source=source.replace(/  Pop \$0\r?\n/,'  Pop $0\n  Pop $2\n  FileOpen $3 "'+nsisString(childLog)+'" w\n  FileWriteUTF16LE $3 "$0$\\r$\\n$2"\n  FileClose $3\n');
                }
                report.compiledSourceSha256=digest(source);
                const sourcePath=path.join(fixture,'installer-reviewed-windows.nsi');await fs.writeFile(sourcePath,source);
                const wrapper=path.join(root,'control.nsi');
                const wrapperText='Unicode true\nOutFile "'+nsisString(setup)+'"\n!define PROJECT_DIR "'+nsisString(fixture)+'"\n'
                  +'!macro addLangs\n!insertmacro MUI_LANGUAGE "English"\n!macroend\n!include "'+nsisString(sourcePath)+'"\n';
                report.wrapperSha256=digest(wrapperText);await fs.writeFile(wrapper,wrapperText);
                execFileSync(compiler.path,['/V2',wrapper],{windowsHide:true,timeout:300000,maxBuffer:1024*1024,env:{...process.env,...(compiler.env||{})}});
                report.exeSha256=digest(await fs.readFile(setup));
                const started=Date.now();
                const run=spawnSync(setup,['/S','/D='+target],{windowsHide:true,windowsVerbatimArguments:true,encoding:'utf8',timeout:120000,maxBuffer:1024*1024});
                report.durationMs=Date.now()-started;report.status=run.status;report.signal=run.signal||null;
                report.spawnError=run.error?{name:run.error.name,code:run.error.code||null,errno:run.error.errno||null}:null;
                report.stdout=bounded(run.stdout);report.stderr=bounded(run.stderr);
                if(mode==='capture'){
                  try{const log=await fs.readFile(childLog),decoded=log.toString('utf16le').replace(/^\uFEFF/,''),newline=decoded.indexOf('\n');report.childOutputBytes=log.length;report.pluginStatus=newline<0?bounded(decoded):decoded.slice(0,newline).trim();report.childOutput=bounded(newline<0?'':decoded.slice(newline+1));}
                  catch(error){if(error.code!=='ENOENT')throw error;report.childOutputBytes=0;report.childOutput=null;}
                }
                report.targetTopLevel=(await fs.readdir(target)).sort().slice(0,16);
                report.keepPreserved=await fs.readFile(path.join(target,'KEEP.txt'),'utf8')==='unrelated original file';
                try{report.applicationExtracted=await fs.readFile(path.join(target,'CONTROL-PAYLOAD.txt'),'utf8')==='untampered prerequisite control';}
                catch(error){if(error.code!=='ENOENT')throw error;report.applicationExtracted=false;}
                report.registrationStatus=spawnSync('reg.exe',['query',registrationPath],{windowsHide:true}).status;
                const after=preflight();report.registeredAfter=after.installedVersion;
                assert.equal(after.installedVersion,before.installedVersion,'The control unexpectedly changed runtime registration.');
                assert.ok(report.keepPreserved,'The control changed an unrelated fixture file.');
                const uninstaller=path.join(target,'Uninstall.exe');
                try{
                  await fs.access(uninstaller);
                  // NSIS _?= runs in-place so its process remains waitable; root is later
                  // removed explicitly and includes only this uniquely named test fixture.
                  const uninstall=spawnSync(uninstaller,['/S','_?='+target],{windowsHide:true,windowsVerbatimArguments:true,encoding:'utf8',timeout:120000,maxBuffer:1024*1024});
                  report.uninstallStatus=uninstall.status;report.uninstallError=uninstall.error?uninstall.error.code||uninstall.error.name:null;
                }catch(error){if(error.code!=='ENOENT')throw error;report.uninstallStatus=null;}
              }finally{
                spawnSync('reg.exe',['delete',registrationPath,'/f'],{windowsHide:true});
                await fs.rm(shortcut,{force:true});await fs.rm(menu,{recursive:true,force:true});
                await fs.rm(root,{recursive:true,force:true,maxRetries:5,retryDelay:100});
                report.cleanupComplete=true;reports.push(report);
                process.stdout.write(JSON.stringify(report)+'\n');
              }
            }
            return reports;
          }
          main().catch(error=>{process.stderr.write('CONTROL_DIAGNOSTIC_FAILED '+bounded(error.stack)+'\n');process.exitCode=1;});
          '@
          $controlPath = Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control.cjs'
          [IO.File]::WriteAllText($controlPath, $control, (New-Object Text.UTF8Encoding($false)))
          $output = @(node $controlPath desktop-pos both 2>&1)
          $code = $LASTEXITCODE
          $raw = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
          $raw | Set-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-output.txt') -Encoding utf8NoBOM
          Write-Output $raw
          [ordered]@{ format = 1; diagnosticOnly = $true; sourceRevision = (& git rev-parse HEAD).Trim(); harnessExitCode = $code; releaseVerified = $false } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-state.json') -Encoding utf8NoBOM
      - name: Retain the diagnostic control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-prerequisite-control-DIAGNOSTIC-ONLY
          path: |
            ${{ runner.temp }}/desktop-prerequisite-control-output.txt
            ${{ runner.temp }}/desktop-prerequisite-control-state.json
          if-no-files-found: error
          retention-days: 7
      - name: Require both actual untampered prerequisite controls to install
        shell: pwsh
        run: |
          $state = Get-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-state.json') -Raw | ConvertFrom-Json
          if ($state.harnessExitCode -ne 0 -or $state.sourceRevision -cne $env:GITHUB_SHA) { throw 'The actual prerequisite control did not complete on this source.' }
          $reports = @(Get-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-output.txt') | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($reports.Count -ne 2 -or @($reports.mode | Sort-Object -Unique).Count -ne 2 -or @($reports.mode | Where-Object { $_ -cnotin @('original', 'capture') }).Count -ne 0) { throw 'Both distinct control variants must be present.' }
          foreach ($report in $reports) {
            if ($report.diagnosticOnly -isnot [bool] -or $report.diagnosticOnly -ne $true -or $report.status -ne 0 -or $null -ne $report.spawnError -or $report.applicationExtracted -isnot [bool] -or $report.applicationExtracted -ne $true -or $report.keepPreserved -ne $true -or $report.registrationStatus -ne 0 -or $report.cleanupComplete -ne $true -or $report.registeredBefore -cne $report.registeredAfter -or [version]$report.registeredAfter -lt [version]'14.51.36247.0') { throw 'The real untampered NSIS prerequisite control failed.' }
            if ($report.mode -ceq 'capture' -and $report.pluginStatus -cne '0') { throw 'The actual prerequisite child did not return success.' }
          }
          Write-Output 'PASS both actual untampered NSIS prerequisite controls install after the original signed payload check; registered runtime is unchanged.'
  windows-installer:
    needs: prerequisite-control
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DESKTOP_TESTED_RUN: ${{ inputs.runtime_run_id || '39363944148' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the original runtime checks to have passed
        shell: pwsh
        env:
          DESKTOP_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          if ($env:DESKTOP_TESTED_RUN -cne '39363944148') { throw 'This follow-up is pinned to the completed original-runtime checks in run176.' }
          $headers = @{ Authorization = "Bearer $env:DESKTOP_ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN"
          if ($run.head_sha -cne '939408badb7d3de771b6c9953a4bfd5dbd08df1c' -or $run.run_attempt -ne 1 -or $run.event -cne 'pull_request') { throw 'The reviewed runtime run identity changed.' }
          $jobs = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN/jobs?per_page=100"
          if (!($jobs.jobs | Where-Object { $_.id -eq 118436478259 -and $_.name -ceq 'original-runtime' -and $_.conclusion -ceq 'success' })) { throw 'The exact source runtime has not passed its original application checks.' }
          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN/artifacts?per_page=100"
          $runtime = @($artifacts.artifacts | Where-Object { $_.name -ceq 'tested-dashboard-runtime' })
          if ($runtime.Count -ne 1 -or $runtime[0].id -ne 12240055641 -or $runtime[0].expired -or $runtime[0].digest -cne 'sha256:7083f656f50cf2ef1d5c40bbf95ea5f71c460bb25ef81406a54e682f8d11513a') { throw 'The original tested runtime artifact changed.' }
          Write-Output 'DESKTOP_TESTED_RUNTIME run=39363944148 attempt=1 job=118436478259 artifact=12240055641 sha256=7083f656f50cf2ef1d5c40bbf95ea5f71c460bb25ef81406a54e682f8d11513a'
      - name: Restore the exact tested runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/runtime-download
          run-id: ${{ env.DESKTOP_TESTED_RUN }}
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified archive with Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/runtime-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified runtime archive.' }
          $runtimeZip = "$env:RUNNER_TEMP/tested-runtime.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath "$env:RUNNER_TEMP/tested-runtime" -Force
          Remove-Item -LiteralPath $runtimeZip
      - name: Require unchanged application code and the exact reviewed bootstrap fix
        id: source
        working-directory: current-source
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP/tested-runtime/runtime-bundle/manifest.json" -Raw | ConvertFrom-Json
          $sourceRevision = $manifest.sourceRevision
          if ($sourceRevision -cne '48b1d0fae8de73a97ab07b53ca0a0667830bf3d9' -or $manifest.sourceFingerprint.files -ne 1317 -or $manifest.sourceFingerprint.sha256 -cne '4288c371691750f5278d145b4d036be0d78d7c170d18fd7d61217954c2866a56' -or $manifest.runtimeFramework -cne '12.70.0') { throw 'The downloaded runtime does not identify the exact passed application.' }
          git fetch --depth=1 origin $sourceRevision
          if ($LASTEXITCODE -ne 0) { throw 'The tested revision cannot be independently checked.' }
          $acceptanceRevision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $acceptanceRevision -cne $env:GITHUB_SHA) { throw 'The acceptance checkout does not match this workflow revision.' }
          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'The acceptance checkout is not clean.' }
          $fixture = 'desktop-pos/test/installer-prerequisite-native.cjs'
          $workflow = '.github/workflows/desktop-dashboard-installer-verify.yml'
          $bootstrap = 'desktop-pos/windows-vcredist.ps1'
          $prerequisiteTest = 'desktop-pos/test/windows-prerequisite.ps1'
          $expectedBootstrapBlob = 'dba8aa9601875edf07ccd7ddbd4f59433d9601be'
          $expectedPrerequisiteTestBlob = '79db9a4fee0062f2cc3d31d25660adaf053e3348'
          $expectedFixtureBlob = 'ad24ab9392a7ea0ba37b507ad9310ad739ba8f80'
          # Every tracked file and mode is compared, including build tools and other fixtures.
          $changes = @(& git diff --raw --no-abbrev --no-renames $sourceRevision HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 4) { throw 'Only the exact reviewed bootstrap, prerequisite regression, acceptance fixture and follow-up workflow may differ.' }
          foreach ($change in $changes) {
            if ($change -cnotmatch '^:100644 100644 [a-f0-9]{40} [a-f0-9]{40} M\t(.+)$') { throw 'An unreviewed file mode, type or change entered the acceptance checkout.' }
            if (@($fixture, $workflow, $bootstrap, $prerequisiteTest) -cnotcontains $Matches[1]) { throw 'Product code, dependencies, build tools or another fixture differs; run the full original checks first.' }
          }
          $actualFixtureBlob = (& git rev-parse ("HEAD:" + $fixture)).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualFixtureBlob -cne $expectedFixtureBlob) { throw 'The reviewed acceptance fixture blob changed.' }
          foreach ($pin in @(@{ path = $bootstrap; blob = $expectedBootstrapBlob }, @{ path = $prerequisiteTest; blob = $expectedPrerequisiteTestBlob })) {
            $actual = (& git rev-parse ("HEAD:" + $pin.path)).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $pin.blob) { throw 'The reviewed prerequisite fix or its regression checks changed.' }
          }
          "inherited=$sourceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "revision=$acceptanceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "acceptance=$acceptanceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "fixture=$expectedFixtureBlob" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: b
      - name: Restore verified inputs into their tested checkout
        shell: pwsh
        run: |
          Move-Item "$env:RUNNER_TEMP/tested-runtime/runtime-bundle" b/desktop-pos/runtime-bundle
          New-Item -ItemType Directory -Path b/desktop-pos/dist -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/runtime-audit.json" b/desktop-pos/dist/runtime-audit.json
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/dashboard-synthetic-snapshot.json" b/desktop-pos/dist/dashboard-synthetic-snapshot.json
          # This independent shallow checkout also needs the reviewed origin object.
          git -C b fetch --depth=1 --no-tags origin 48b1d0fae8de73a97ab07b53ca0a0667830bf3d9
          if ($LASTEXITCODE -ne 0) { throw 'The assembly checkout could not fetch its exact inherited source.' }
          $inheritedRevision = (& git -C b rev-parse FETCH_HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $inheritedRevision -cne '48b1d0fae8de73a97ab07b53ca0a0667830bf3d9') { throw 'The inherited source object differs in the actual assembly checkout.' }
      - name: Assemble the current manifest from byte-identical tested runtime inputs
        working-directory: b
        shell: pwsh
        env:
          DESKTOP_CURRENT_SOURCE: ${{ steps.source.outputs.revision }}
        run: |
          $promoter = @'
          'use strict';
          // Usage: node desktop-promote-tested-runtime.cjs /absolute/path/to/desktop-pos ACTUAL_GIT_HEAD
          // The workflow must first verify/download the immutable origin artifact below.
          // This script assembles a new source-bound manifest; it never relabels old test receipts.
          const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process');
          const ORIGIN=Object.freeze({run:39363944148,attempt:1,job:118436478259,artifact:12240055641,
            artifactSha256:'7083f656f50cf2ef1d5c40bbf95ea5f71c460bb25ef81406a54e682f8d11513a',
            runHead:'939408badb7d3de771b6c9953a4bfd5dbd08df1c',sourceRevision:'48b1d0fae8de73a97ab07b53ca0a0667830bf3d9'});
          const SOURCE=Object.freeze({format:1,files:1317,sha256:'4288c371691750f5278d145b4d036be0d78d7c170d18fd7d61217954c2866a56',framework:'8.83.29'});
