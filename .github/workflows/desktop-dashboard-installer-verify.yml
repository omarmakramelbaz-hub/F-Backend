            need(git('rev-parse','HEAD:desktop-pos/test/installer-prerequisite-native.cjs').trim()===FIXTURE,'The pinned prerequisite acceptance fixture changed.');
            const bundle=path.join(project,'runtime-bundle'),dist=path.join(project,'dist');await directory(bundle);
            await fs.mkdir(dist,{recursive:true});await directory(dist);
            const manifestPath=path.join(bundle,'manifest.json');await regular(manifestPath);
            const originalBytes=await fs.readFile(manifestPath),manifest=JSON.parse(originalBytes.toString('utf8'));
            const packaging=require(path.join(project,'installer-runtime.cjs')),source=require(path.join(project,'src/dashboard-source.cjs'));
            const policy=require(path.join(project,'runtime-source-policy.cjs'));
            need(manifest.sourceRevision===ORIGIN.sourceRevision&&manifest.runtimeFramework==='12.70.0'&&source.same(manifest.sourceFingerprint,SOURCE),'The inherited manifest is not the exact passed original runtime.');
            const before=await packaging.verifyBundle(bundle);
            need(before.files['manifest.json']===hash(originalBytes),'The original manifest changed during verification.');
            const currentHashes={},roots=new Set(['app','bootstrap','config','database','desktop','public','resources','routes']);
            for(const name of git('ls-files','-z').split('\0').filter(Boolean)){
