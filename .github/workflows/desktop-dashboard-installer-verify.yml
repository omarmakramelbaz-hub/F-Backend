# Reuses only immutable run189 business/runtime bytes. All installer/native acceptance below is freshly executed at this checkout.
# No inherited receipt is rewritten and no new complete business-suite execution is claimed.
name: Verify GO ERP installer from pinned successful run189 runtime
'on':
  push:
    branches:
    - codex/go-erp-installer-fix-20261020
    paths:
    - .github/workflows/desktop-dashboard-installer-verify.yml
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Only independently pinned run189 is accepted
        required: true
        default: '39388583864'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: go-erp-installer189-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DESKTOP_TESTED_RUN: ${{ inputs.runtime_run_id || '39388583864' }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: b
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Authenticate exact inherited original and native evidence
      env:
        DESKTOP_ARTIFACT_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        if ('${{ github.repository }}' -cne 'omarmakramelbaz-hub/F-Backend') { throw 'The inherited runtime repository differs.' }
        if ($env:DESKTOP_TESTED_RUN -cne '39388583864') { throw 'Only the exact reviewed run189 is admitted.' }
        $headers = @{ Authorization = "Bearer $env:DESKTOP_ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
        $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/39388583864"
        if ($run.id -ne 39388583864 -or $run.head_sha -cne '91364fbb1210a0834b9d7b05835a97b5307bec19' -or $run.run_attempt -ne 1 -or $run.event -cne 'pull_request' -or $run.status -cne 'completed' -or $run.repository.id -ne 1311412084 -or $run.head_repository.id -ne 1311412084) { throw 'The reviewed origin run identity changed.' }
        $jobs = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/39388583864/jobs?per_page=100"
        foreach ($pin in @(@{id=118514626590;name='original-runtime'},@{id=118514336204;name='connected-native'})) {
          $match = @($jobs.jobs | Where-Object { $_.id -eq $pin.id -and $_.name -ceq $pin.name -and $_.conclusion -ceq 'success' })
          if ($match.Count -ne 1) { throw 'The exact original application and native jobs must both have passed.' }
        }
        $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/39388583864/artifacts?per_page=100"
        $runtime = @($artifacts.artifacts | Where-Object { $_.name -ceq 'tested-dashboard-runtime' })
        if ($runtime.Count -ne 1 -or $runtime[0].id -ne 12250176654 -or $runtime[0].expired -or $runtime[0].size_in_bytes -ne 305205298 -or $runtime[0].digest -cne 'sha256:73daba107dbd086a9db695f08d4967004649945c0d7237fcdf0eca2c97a03170' -or $runtime[0].workflow_run.id -ne 39388583864 -or $runtime[0].workflow_run.head_sha -cne '91364fbb1210a0834b9d7b05835a97b5307bec19') { throw 'The immutable reviewed run189 runtime artifact changed.' }
        Write-Output 'DESKTOP_INHERITED_RUNTIME run=39388583864 attempt=1 originalJob=118514626590 nativeJob=118514336204 artifact=12250176654 sha256=73daba107dbd086a9db695f08d4967004649945c0d7237fcdf0eca2c97a03170; original business results are inherited, not rerun.'
    - name: Download the immutable exact run189 runtime
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: tested-dashboard-runtime
        path: ${{ runner.temp }}/runtime189-download
        run-id: ${{ env.DESKTOP_TESTED_RUN }}
        github-token: ${{ github.token }}
        skip-decompress: true
        digest-mismatch: error
    - name: Independently verify archive bytes before extracting
      shell: pwsh
      run: |
        $archives = @(Get-ChildItem "$env:RUNNER_TEMP/runtime189-download" -File)
        if ($archives.Count -ne 1 -or $archives[0].Length -ne 305205298 -or (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '73daba107dbd086a9db695f08d4967004649945c0d7237fcdf0eca2c97a03170') { throw 'Downloaded origin archive bytes differ from the independently pinned artifact.' }
        $archivePath=Join-Path $env:RUNNER_TEMP 'tested-runtime189.zip'
        if (Test-Path -LiteralPath $archivePath) { throw 'A foreign origin archive staging path already exists.' }
        Move-Item -LiteralPath $archives[0].FullName -Destination $archivePath
        Expand-Archive -LiteralPath $archivePath -DestinationPath b/desktop-pos -Force
        Remove-Item -LiteralPath $archivePath
        foreach ($file in @('runtime-bundle/manifest.json','dist/runtime-audit.json','dist/dashboard-synthetic-snapshot.json')) { if (!(Test-Path -LiteralPath "b/desktop-pos/$file" -PathType Leaf)) { throw 'A required inherited input is missing.' } }
    - name: Require exact clean current source and reviewed installer delta
      id: source
      working-directory: b
      shell: pwsh
      run: |
        $revision = (& git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA) { throw 'Current checkout is not this exact workflow revision.' }
        git diff-index --quiet HEAD --
        if ($LASTEXITCODE -ne 0) { throw 'Current tracked product checkout is not clean.' }
        git fetch --depth=1 --no-tags --no-recurse-submodules origin 43580d40b22fe42809563f8818728d1173fa1348
        if ($LASTEXITCODE -ne 0 -or (& git rev-parse FETCH_HEAD).Trim() -cne '43580d40b22fe42809563f8818728d1173fa1348') { throw 'The exact inherited source object is unavailable.' }
        $manifest = Get-Content desktop-pos/runtime-bundle/manifest.json -Raw | ConvertFrom-Json
        if ($manifest.sourceRevision -cne '43580d40b22fe42809563f8818728d1173fa1348' -or $manifest.sourceFingerprint.files -ne 1324 -or $manifest.sourceFingerprint.sha256 -cne 'e1c889bfd170466c7c81e1d8da5d375606eda60d7526b8a48ae348ce36cad1f7' -or $manifest.sourceFingerprint.framework -cne '8.83.29' -or $manifest.runtimeFramework -cne '12.70.0') { throw 'Inherited application source or actual runtime engine differs.' }
        $workflow = '.github/workflows/desktop-dashboard-installer-verify.yml'
        $workflowBlob = (& git rev-parse ("HEAD:"+$workflow)).Trim()
        if ($LASTEXITCODE -ne 0 -or $workflowBlob -cnotmatch '^[a-f0-9]{40}$') { throw 'The current workflow blob is unavailable.' }
        # The workflow cannot contain its own final blob hash. Its authenticated actual
        # checkout supplies that single new blob; independent delivery verification pins it.
        $expected = @(
          @{path='desktop-pos/installer.nsi';oldMode='100644';newMode='100644';status='M';oldBlob='0ff9da3811112e6e5df8530105b5b27b841c43c8';newBlob='7220581721fb987167eb282d646cd137879c683c'},
          @{path='.github/scripts/desktop-runtime-copy-hook.cjs';oldMode='100644';newMode='100644';status='M';oldBlob='bff8525db42f2aab9901242b620d973fbf6438e7';newBlob='9c7e9f51e102abbd36e1f156a361e535f02774b5'},
          @{path='desktop-pos/test/installer-runtime.test.cjs';oldMode='100644';newMode='100644';status='M';oldBlob='3fe4be50b5cd1be4f7a91634d54cae87a0187a2a';newBlob='5550508b739ad0ed113a60ec2187ed5058dcb34b'},
          @{path=$workflow;oldMode='100644';newMode='100644';status='M';oldBlob='83f77f64871e2e2138cf1cb83c33888dd47d2871';newBlob=$workflowBlob}
        )
        foreach ($pin in $expected) { if ($pin.oldBlob -cnotmatch '^[a-f0-9]{40}$' -or $pin.newBlob -cnotmatch '^[a-f0-9]{40}$') { throw 'A reviewed installer-fix pin is not frozen.' } }
        $changes = @(& git -c core.quotePath=false diff --raw --no-abbrev --no-renames --no-ext-diff 43580d40b22fe42809563f8818728d1173fa1348 HEAD)
        if ($LASTEXITCODE -ne 0 -or $changes.Count -ne $expected.Count) { throw 'Only the exact reviewed installer, copy hook, focused test and follow-up workflow may differ.' }
        $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
        foreach ($change in $changes) {
          if ($change -cnotmatch '^:100644 100644 ([a-f0-9]{40}) ([a-f0-9]{40}) M\t(.+)$') { throw 'Unreviewed raw mode/type/status change.' }
          $old=$Matches[1];$new=$Matches[2];$path=$Matches[3]
          $pin=@($expected | Where-Object { $_.path -ceq $path })
          if ($pin.Count -ne 1 -or -not ($seen.Add($path)) -or $pin[0].oldBlob -cne $old -or $pin[0].newBlob -cne $new) { throw 'Application, client, dependency, another build tool or fixture differs from the exact reviewed delta.' }
        }
        $pinJson = ConvertTo-Json -InputObject $expected -Depth 8 -Compress
        "DESKTOP_REVIEWED_GIT_CHANGES_JSON=$pinJson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "workflowBlob=$workflowBlob" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Output ('DESKTOP_CURRENT_INSTALLER_SCOPE '+$pinJson)
    - name: Promote only manifest identity with full independently pinned origin inventory
      working-directory: b
      shell: pwsh
      run: |
        $promoter = @'
        'use strict';
        // Usage: node SCRIPT /absolute/path/to/desktop-pos ACTUAL_GITHUB_SHA
        // The workflow MUST authenticate ORIGIN's run/attempt/jobs/artifact/digest first.
        // DESKTOP_REVIEWED_GIT_CHANGES_JSON must be constructed from literal owner-reviewed
        // installer/helper/test pins. Only the workflow's own newBlob is derived from the
        // exact authenticated GITHUB_SHA; an external verifier pins that final blob.
        const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
        const {execFileSync}=require('node:child_process');
        const {isDeepStrictEqual}=require('node:util');
        const ORIGIN=Object.freeze({run:39388583864,attempt:1,job:118514626590,
          artifact:12250176654,
          artifactSha256:'73daba107dbd086a9db695f08d4967004649945c0d7237fcdf0eca2c97a03170',
          runHead:'91364fbb1210a0834b9d7b05835a97b5307bec19',sourceRevision:'43580d40b22fe42809563f8818728d1173fa1348'});
        const ORIGIN_ARTIFACT_BYTES=305205298,ORIGIN_NATIVE_JOB=118514336204;
        const SOURCE=Object.freeze({format:1,files:1324,sha256:'e1c889bfd170466c7c81e1d8da5d375606eda60d7526b8a48ae348ce36cad1f7',framework:'8.83.29'});
        const LOCK='324b9e1cadb31e1e0eebb7ba354c6a764debae3621d8a69f698fdeda49d2c33b';
        const COMPAT='ccfcb0b22a3f1b7f7fff2539da17a303d21409b4881feed06df544bd58ce4662';
        const FROZEN=Object.freeze({runtimeFiles:49464,
          originalManifestSha256:'7ab55b284ddb9e74666720f04cf3d9bdfe41b987645277fe9c3e61474a84581e',
          originalInventorySha256:'8043e0043e9cb75dc5dc8b73be105e8f20adfba84aa2178e037bd8609f6b8842',
          identicalNonManifestInventorySha256:'7c7d397ee3ab3f0ddeab06a6d92bc33b3ae314688efc043a32be0ac09530bef5',
          auditSha256:'5f72e8ae46fe2c1dc166941b7f10e79f01e208c7b0878a2b87bbe22131baf544',
          snapshotSha256:'4a4c4113bc56dd21195e567db4b8d632ebfa8a17b7fc0807286d4cceee43d02e'});
        const WORKFLOW='.github/workflows/desktop-dashboard-installer-verify.yml';
        const ALLOWED=new Set([WORKFLOW,'desktop-pos/installer.nsi',
          '.github/scripts/desktop-runtime-copy-hook.cjs','desktop-pos/test/installer-runtime.test.cjs']);
        const REV=/^[a-f0-9]{40}$/,SHA=/^[a-f0-9]{64}$/;
        const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
        const ordered=keys=>keys.sort((a,b)=>Buffer.compare(Buffer.from(a),Buffer.from(b)));
        const canonical=files=>JSON.stringify(ordered(Object.keys(files)).map(name=>[name,files[name]]));
        const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
        const need=(condition,message)=>{if(!condition)throw Error(message);};
        async function regular(file){const stat=await fs.lstat(file);need(stat.isFile()&&!stat.isSymbolicLink(),'Expected a regular file: '+file);return stat;}
        async function directory(file){const stat=await fs.lstat(file);need(stat.isDirectory()&&!stat.isSymbolicLink(),'Expected a real directory: '+file);}
        async function bytes(file,limit=64*1024**2){const stat=await regular(file);need(stat.size>0&&stat.size<=limit,'Input exceeds its bound: '+file);const b=await fs.readFile(file);need(b.length===stat.size,'Input changed during read: '+file);return b;}
        async function atomicWrite(file,data,stagingDirectory){
          const staging=path.join(stagingDirectory,'.runtime-manifest-'+crypto.randomUUID()+'.tmp');
          try{await fs.writeFile(staging,data,{flag:'wx',mode:0o600});await fs.rename(staging,file);}
          finally{await fs.rm(staging,{force:true});}
        }
        async function saveOriginal(file,data){
          try{await fs.writeFile(file,data,{flag:'wx',mode:0o600});}
          catch(error){if(error.code!=='EEXIST')throw error;need((await bytes(file)).equals(data),'An existing original record differs: '+file);}
        }
        function reviewedChanges(){
          const input=process.env.DESKTOP_REVIEWED_GIT_CHANGES_JSON;
          need(typeof input==='string'&&input.length>0&&Buffer.byteLength(input)<=16384,'Missing bounded hardcoded reviewed Git pin JSON.');
          const rows=JSON.parse(input);need(Array.isArray(rows)&&rows.length>=2&&rows.length<=4,'Expected two to four reviewed Git changes.');
          const seen=new Set(),result=[];
          for(const row of rows){
            need(object(row)&&isDeepStrictEqual(Object.keys(row).sort(),['path','oldMode','newMode','oldBlob','newBlob','status'].sort()),'Invalid reviewed Git pin fields.');
            need(ALLOWED.has(row.path)&&!seen.has(row.path)&&row.oldMode==='100644'&&row.newMode==='100644'
              &&row.status==='M'&&REV.test(row.oldBlob)&&REV.test(row.newBlob)&&row.oldBlob!==row.newBlob,'Invalid/unreviewed Git path, mode, type or blob pin.');
            seen.add(row.path);result.push(`:${row.oldMode} ${row.newMode} ${row.oldBlob} ${row.newBlob} ${row.status}\t${row.path}`);
          }
          need(seen.has(WORKFLOW)&&seen.has('desktop-pos/installer.nsi'),'The reviewed follow-up and installer fix must both be pinned.');
          return ordered(result);
        }
        async function selectedFingerprint(checkout,framework){
          // Same selected roots, exclusions and CRLF normalization as dashboard-source.cjs;
          // a bare Git checkout has no generated runtime composer.lock.
          const roots=['app','bootstrap','config','database','desktop','resources','routes','public/dashboard/js','public/dashboard/css','public/dashboard/vendor/desktop-external'];
          const excluded=/(?:^|\/)(?:\.env(?:\..*)?|firebase(?:_credentials)?\.json|service[-_]account[^/]*\.json|[^/]+\.(?:key|pem)|error_log)$/i;
          const files={},cases=new Set();let total=0;
          const add=async name=>{
            const file=path.join(checkout,...name.split('/'));await regular(file);
            need(/^[a-zA-Z0-9_.@/-]+$/.test(name)&&!cases.has(name.toLowerCase()),'Invalid/colliding selected source path.');
            const b=await fs.readFile(file);total+=b.length;
            need(total<=64*1024**2&&Object.keys(files).length<20000,'Selected source exceeds its verification limit.');
            cases.add(name.toLowerCase());files[name]=hash(Buffer.from(b.toString('latin1').replace(/\r\n/g,'\n'),'latin1'));
          };
          const walk=async relative=>{
            if(relative==='bootstrap/cache'||excluded.test(relative))return;
            for(const entry of await fs.readdir(path.join(checkout,...relative.split('/')),{withFileTypes:true})){
              const name=relative+'/'+entry.name;if(name.startsWith('bootstrap/cache/')||excluded.test(name))continue;
              need(!entry.isSymbolicLink(),'A selected source entry is a symlink.');
              if(entry.isDirectory())await walk(name);else if(/\.(?:php|js|css|json|html|scss|vue)$/i.test(name))await add(name);
            }
          };
          for(const root of roots){try{await directory(path.join(checkout,...root.split('/')));}catch(error){if(error.code==='ENOENT')continue;throw error;}await walk(root);}
          try{await add('artisan');}catch(error){if(error.code!=='ENOENT')throw error;}
          const digest=crypto.createHash('sha256').update('desktop-dashboard-source:1\n');
          for(const name of ordered(Object.keys(files)))digest.update(name+'\0'+files[name]+'\n');
          return {format:1,files:Object.keys(files).length,sha256:digest.digest('hex'),framework};
        }
        async function main(){
          need(process.argv.length===4,'Expected desktop-pos directory and exact current checkout SHA.');
          const expected=process.argv[3];need(REV.test(expected)&&expected!==ORIGIN.sourceRevision,'Expected a new actual current Git checkout.');
          const project=await fs.realpath(process.argv[2]);await directory(project);
          const checkout=await fs.realpath(execFileSync('git',['rev-parse','--show-toplevel'],{cwd:project,encoding:'utf8'}).trim());
          const git=(...args)=>execFileSync('git',args,{cwd:checkout,encoding:'utf8',maxBuffer:16*1024**2,env:{...process.env,GIT_OPTIONAL_LOCKS:'0',GIT_NO_REPLACE_OBJECTS:'1'}});
          need(checkout===await fs.realpath(path.dirname(project)),'The Electron project must be directly under its Git checkout.');
          const expectedChanges=reviewedChanges();
          const clean=()=>{need(git('rev-parse','HEAD').trim()===expected,'Actual Git HEAD differs from assembly revision.');git('diff-index','--quiet','HEAD','--');};clean();
          need(git('rev-parse','--verify',ORIGIN.sourceRevision+'^{commit}').trim()===ORIGIN.sourceRevision,'The exact original checkout object is missing.');
          const raw=git('diff','--raw','--no-abbrev','--no-renames',ORIGIN.sourceRevision,'HEAD').trim();
          const changes=raw?raw.split('\n'):[];
          need(isDeepStrictEqual(ordered([...changes]),expectedChanges),'The complete tracked Git delta differs from its exact reviewed mode/blob/path pins.');
          for(const line of expectedChanges){const match=/^:100644 100644 ([a-f0-9]{40}) ([a-f0-9]{40}) M\t(.+)$/.exec(line);
            need(match&&git('rev-parse',ORIGIN.sourceRevision+':'+match[3]).trim()===match[1]
              &&git('rev-parse','HEAD:'+match[3]).trim()===match[2],'An exact reviewed Git blob is unavailable.');}
          const bundle=path.join(project,'runtime-bundle'),dist=path.join(project,'dist');await directory(bundle);
          await fs.mkdir(dist,{recursive:true});await directory(dist);
          const manifestPath=path.join(bundle,'manifest.json'),originalBytes=await bytes(manifestPath,4*1024**2);
          need(hash(originalBytes)===FROZEN.originalManifestSha256,'Restored original manifest bytes differ from independently verified run189 artifact.');
          const manifest=JSON.parse(originalBytes.toString('utf8').replace(/^\uFEFF/,''));
          const packaging=require(path.join(project,'installer-runtime.cjs')),source=require(path.join(project,'src/dashboard-source.cjs'));
          const policy=require(path.join(project,'runtime-source-policy.cjs'));
          need(manifest.format===1&&manifest.platform==='win32-x64'&&manifest.sourceRevision===ORIGIN.sourceRevision
            &&manifest.runtimeFramework==='12.70.0'&&source.same(manifest.sourceFingerprint,SOURCE)
            &&manifest.channel==='preview'&&manifest.fullDashboard===false&&manifest.runtimeCompatibilitySha256===COMPAT,'Inherited manifest is not the exact passed run189 runtime.');
          const before=await packaging.verifyBundle(bundle);
          need(before.files['manifest.json']===hash(originalBytes)&&before.lockSha256===LOCK
            &&before.files['application/compatibility.php']===COMPAT,'Original manifest, runtime lock or compatibility bytes differ.');
          need(Object.keys(before.files).length===FROZEN.runtimeFiles
            &&hash(Buffer.from(canonical(before.files)))===FROZEN.originalInventorySha256,'Restored full runtime inventory differs from independently verified run189 artifact.');
          const frozenNonManifest={...before.files};delete frozenNonManifest['manifest.json'];
          need(hash(Buffer.from(canonical(frozenNonManifest)))===FROZEN.identicalNonManifestInventorySha256,'Restored non-manifest inventory differs from independently verified run189 artifact.');
          const untouched={};
          for(const name of ['runtime-audit.json','dashboard-synthetic-snapshot.json'])untouched[name]=hash(await bytes(path.join(dist,name)));
          need(untouched['runtime-audit.json']===FROZEN.auditSha256&&untouched['dashboard-synthetic-snapshot.json']===FROZEN.snapshotSha256,'Restored audit or synthetic snapshot differs from independently verified run189 artifact.');
          const audit=JSON.parse((await bytes(path.join(dist,'runtime-audit.json'))).toString('utf8').replace(/^\uFEFF/,''));
          need(audit.format===1&&audit.exitCode===0&&audit.lockSha256===LOCK&&object(audit.result),'Inherited dependency audit differs.');
          for(const field of ['advisories','ignored-advisories','abandoned']){
            const value=audit.result[field]??{};need((object(value)||Array.isArray(value))&&Object.keys(value).length===0,'Inherited audit has '+field);}
          need(Object.hasOwn(audit.result,'advisories'),'Inherited audit omits advisories.');
          const currentHashes={},roots=new Set(['app','bootstrap','config','database','desktop','public','resources','routes']);
          for(const name of git('ls-files','-z').split('\0').filter(Boolean)){
            if((!roots.has(name.split('/')[0])&&name!=='artisan')||policy.excludedPath(name))continue;
            const file=path.join(checkout,name);await regular(file);const b=await fs.readFile(file);
            if(!policy.credentialJson(name,b))currentHashes[name]=hash(b);
          }
          need(canonical(currentHashes)===canonical(manifest.sourceHashes),'Current complete Git application bytes differ from inherited runtime.');
          const fingerprint=await selectedFingerprint(checkout,manifest.sourceFingerprint.framework);
          need(source.same(fingerprint,SOURCE),'Current selected source fingerprint differs.');clean();
          const originalRecord=path.join(dist,'runtime-reuse-original-manifest.json');
          const inventoryRecord=path.join(dist,'runtime-reuse-original-inventory.json');
          const proofPath=path.join(dist,'runtime-assembly-provenance.json');
          try{await fs.lstat(proofPath);throw Error('Assembly provenance already exists.');}catch(error){if(error.code!=='ENOENT')throw error;}
          const inventoryBytes=Buffer.from(JSON.stringify(Object.fromEntries(ordered(Object.keys(before.files)).map(name=>[name,before.files[name]])),null,2)+'\n');
          await saveOriginal(originalRecord,originalBytes);await saveOriginal(inventoryRecord,inventoryBytes);
          const nextBytes=Buffer.from(JSON.stringify({...manifest,sourceRevision:expected},null,2)+'\n');
          let changed=false,proofOwned=false;
          try{
            // Every runtime byte, dependency, audit and inherited receipt remains unchanged.
            changed=true;await atomicWrite(manifestPath,nextBytes,dist);
            const after=await packaging.verifyBundle(bundle);clean();
            need(after.manifest.sourceRevision===expected&&after.files['manifest.json']===hash(nextBytes),'Assembled manifest identity differs.');
            const names=ordered(Object.keys(before.files));
            need(isDeepStrictEqual(names,ordered(Object.keys(after.files))),'Runtime inventory roster changed.');
            const changedPaths=names.filter(name=>before.files[name]!==after.files[name]);
            need(isDeepStrictEqual(changedPaths,['manifest.json']),'A runtime byte other than manifest.json changed.');
            const nonManifestBefore={...before.files},nonManifestAfter={...after.files};delete nonManifestBefore['manifest.json'];delete nonManifestAfter['manifest.json'];
            need(canonical(nonManifestBefore)===canonical(nonManifestAfter),'Inherited non-manifest runtime bytes differ.');
            for(const [name,digest]of Object.entries(untouched))need(hash(await bytes(path.join(dist,name)))===digest,'An inherited receipt/input changed: '+name);
            need((await bytes(originalRecord)).equals(originalBytes)&&(await bytes(inventoryRecord)).equals(inventoryBytes),'A retained original manifest/inventory changed.');
            const proof={format:1,assemblyOnly:true,sourceRevision:expected,inheritedFrom:ORIGIN,
              originArtifactBytes:ORIGIN_ARTIFACT_BYTES,originNativeJob:ORIGIN_NATIVE_JOB,
              originalManifestSha256:hash(originalBytes),assembledManifestSha256:hash(nextBytes),
