name: Verify installer from tested dashboard runtime

on:
  push:
    branches: ['codex/runtime-ca-portability-20261009']
    paths: ['.github/workflows/desktop-dashboard-installer-verify.yml']
  pull_request:
    branches: ['codex/desktop-current-dashboard-20261019']
    paths: ['.github/workflows/desktop-dashboard-installer-verify.yml', 'desktop-pos/test/installer-prerequisite-native.cjs']
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: 'Run whose original-runtime job passed and retained the exact runtime'
        required: true
        default: '39363944148'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prerequisite-control:
    # Temporary diagnostic job: never produces a release or changes product source.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48b1d0fae8de73a97ab07b53ca0a0667830bf3d9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the original signed payload and pinned compiler dependencies
        shell: pwsh
        run: |
          $revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne '48b1d0fae8de73a97ab07b53ca0a0667830bf3d9') { throw 'The diagnostic source changed.' }
          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic product checkout is not clean.' }
          & .github/scripts/prepare-desktop-vcredist.ps1 -Project desktop-pos
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned diagnostic compiler dependencies failed.' }
      - name: Diagnose the original prerequisite and capture its otherwise silent child output
        shell: pwsh
        run: |
          $control = @'
          'use strict';
          // DIAGNOSTIC ONLY. This is neither a release build nor an acceptance receipt.
          // It embeds the reviewed prerequisite and installer with a private tiny app.
          // It must never be run on a production machine. No repository files are written.
          const fs=require('node:fs/promises'),path=require('node:path'),os=require('node:os'),assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const {execFileSync,spawnSync}=require('node:child_process');
          const digest=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const nsisString=value=>value.replaceAll('$',()=> '$$').replaceAll('"','$\\"');
          const psString=value=>"'"+value.replaceAll("'","''")+"'";
          const bounded=value=>String(value||'').slice(0,8192);
          async function main(){
            assert.equal(process.platform,'win32','This diagnostic requires a disposable Windows runner.');
            const project=path.resolve(process.argv[2]||'desktop-pos'),choice=process.argv[3]||'original';
            assert.ok(['original','capture','both'].includes(choice),'Choose original, capture, or both.');
            const lock=JSON.parse(await fs.readFile(path.join(project,'package-lock.json'),'utf8'));
            const pinned=lock.packages['node_modules/app-builder-lib'].version;
            assert.equal(pinned,'26.15.3');
            const resolver=require.resolve('app-builder-lib/out/toolsets/windows.js',{paths:[project]});
            const installed=JSON.parse(await fs.readFile(path.resolve(path.dirname(resolver),'../../package.json'),'utf8'));
            assert.equal(installed.version,pinned);
            const build=JSON.parse(await fs.readFile(path.join(project,'package.json'),'utf8')).build||{};
            const compiler=await require(resolver).getMakeNsisPath(build.toolsets?.nsis,build.nsis?.customNsisBinary);
            assert.ok((await fs.stat(compiler.path)).isFile());
            const powershell=path.join(process.env.SystemRoot,'System32/WindowsPowerShell/v1.0/powershell.exe');
            const script=path.join(project,'windows-vcredist.ps1'),policyPath=path.join(project,'windows-vcredist.json');
            const payloadPath=path.join(project,'dist/prerequisites/vc_redist.x64.exe');
            const policy=JSON.parse(await fs.readFile(policyPath,'utf8')),payload=await fs.readFile(payloadPath);
            assert.equal(payload.length,policy.bytes);assert.equal(digest(payload),policy.sha256);
            // Dot sourcing never invokes Initialize-DesktopVcRuntime. Refuse the control
            // unless the original helper already observes its registered minimum runtime.
            const preflightCommand="$ErrorActionPreference='Stop'; Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -ErrorAction Stop; Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1') -ErrorAction Stop; . "+psString(script)+" -Action ValidatePayload -PayloadPath "+psString(payloadPath)+" -PolicyPath "+psString(policyPath)+"; "
              +"$p=Read-DesktopVcPolicy -Path "+psString(policyPath)+"; "
              +"$v=Get-DesktopVcInstalledVersion; if(-not [Environment]::Is64BitOperatingSystem -or $null -eq $v -or $v -lt [version]$p.version){throw 'Control refused: the required runtime is not already registered.'}; "
              +"$null=Test-DesktopVcPayload -Path "+psString(payloadPath)+" -Policy $p; "
              +"[pscustomobject]@{installedVersion=$v.ToString();minimumVersion=[string]$p.version;desktop=[Environment]::GetFolderPath('DesktopDirectory');programs=[Environment]::GetFolderPath('Programs')} | ConvertTo-Json -Compress";
            const preflight=()=>JSON.parse(execFileSync(powershell,['-NoProfile','-NonInteractive','-Command',preflightCommand],
              {windowsHide:true,encoding:'utf8',timeout:30000}));
            const before=preflight();assert.ok(before.desktop&&before.programs);
            const original=await fs.readFile(path.join(project,'installer.nsi'),'utf8');
            const reviewed=original.replace(/\$\{PROJECT_DIR\}\/[^"\r\n]+/g,value=>value.replaceAll('/','\\'))
              .replace('SetCompressor /SOLID lzma','SetCompressor /SOLID zlib');
            assert.equal(reviewed.match(/nsExec::ExecToLog /g)?.length,1);
            const reports=[];
            for(const mode of choice==='both'?['original','capture']:[choice]){
              // Recheck immediately before each execution. No helper install is performed
              // by this preflight, and the already-installed path cannot request UAC.
              const guarded=preflight();assert.equal(guarded.installedVersion,before.installedVersion);
              const root=await fs.mkdtemp(path.join(os.tmpdir(),'fasakhansta-vc-control-'));
              const fixture=path.join(root,'fixture'),target=path.join(root,'installed'),setup=path.join(root,'control.exe');
              const childLog=path.join(root,'diagnostic-child.log');
              const key='FasakhanstaVcControl-'+path.basename(root),product='Fasakhansta VC Control '+path.basename(root);
              const registrationPath='HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\'+key;
              const shortcut=path.join(before.desktop,product+'.lnk'),menu=path.join(before.programs,product);
              const report={format:1,diagnosticOnly:true,mode,sourceSha256:digest(original),reviewedSha256:digest(reviewed),
                prerequisiteSha256:digest(payload),registeredBefore:guarded.installedVersion};
              try{
                await fs.mkdir(path.join(fixture,'dist/win-unpacked/resources'),{recursive:true});
                await fs.mkdir(path.join(fixture,'dist/prerequisites'),{recursive:true});
                await fs.mkdir(path.join(fixture,'src/assets'),{recursive:true});
                await fs.mkdir(target);await fs.writeFile(path.join(target,'KEEP.txt'),'unrelated original file');
                await fs.copyFile(path.join(project,'src/assets/app.ico'),path.join(fixture,'src/assets/app.ico'));
                await fs.copyFile(path.join(project,'src/assets/app.ico'),path.join(fixture,'dist/win-unpacked/resources/app.ico'));
                for(const name of ['windows-vcredist.json','windows-vcredist.ps1'])await fs.copyFile(path.join(project,name),path.join(fixture,name));
                await fs.writeFile(path.join(fixture,'dist/prerequisites/vc_redist.x64.exe'),payload);
                await fs.writeFile(path.join(fixture,'dist/win-unpacked/CONTROL-PAYLOAD.txt'),'untampered prerequisite control');
                await fs.writeFile(path.join(fixture,'dist/installer-version.nsh'),
                  '!define FASAKHANSTA_VERSION "0.0.0"\n!define FASAKHANSTA_PRODUCT_NAME "'+product+'"\n'
                  +'!define FASAKHANSTA_UNINSTALL_KEY "'+key+'"\n');
                await fs.writeFile(path.join(fixture,'dist/uninstall-files.nsh'),
                  'Delete "$INSTDIR\\CONTROL-PAYLOAD.txt"\nDelete "$INSTDIR\\resources\\app.ico"\nRMDir "$INSTDIR\\resources"\n');
                let source=reviewed;
                if(mode==='capture'){
                  // The diagnostic variant changes only the plugin's output destination
                  // and drains its extra output stack entry into a private temporary log.
                  // $0 still contains the original return code; every branch is unchanged.
                  source=source.replace('nsExec::ExecToLog ','nsExec::ExecToStack ');
                  assert.equal(source.match(/  Pop \$0\r?\n/g)?.length,1);
                  source=source.replace(/  Pop \$0\r?\n/,'  Pop $0\n  Pop $2\n  FileOpen $3 "'+nsisString(childLog)+'" w\n  FileWriteUTF16LE $3 "$0$\\r$\\n$2"\n  FileClose $3\n');
                }
                report.compiledSourceSha256=digest(source);
                const sourcePath=path.join(fixture,'installer-reviewed-windows.nsi');await fs.writeFile(sourcePath,source);
                const wrapper=path.join(root,'control.nsi');
                const wrapperText='Unicode true\nOutFile "'+nsisString(setup)+'"\n!define PROJECT_DIR "'+nsisString(fixture)+'"\n'
                  +'!macro addLangs\n!insertmacro MUI_LANGUAGE "English"\n!macroend\n!include "'+nsisString(sourcePath)+'"\n';
                report.wrapperSha256=digest(wrapperText);await fs.writeFile(wrapper,wrapperText);
                execFileSync(compiler.path,['/V2',wrapper],{windowsHide:true,timeout:300000,maxBuffer:1024*1024,env:{...process.env,...(compiler.env||{})}});
                report.exeSha256=digest(await fs.readFile(setup));
                const started=Date.now();
                const run=spawnSync(setup,['/S','/D='+target],{windowsHide:true,windowsVerbatimArguments:true,encoding:'utf8',timeout:120000,maxBuffer:1024*1024});
                report.durationMs=Date.now()-started;report.status=run.status;report.signal=run.signal||null;
                report.spawnError=run.error?{name:run.error.name,code:run.error.code||null,errno:run.error.errno||null}:null;
                report.stdout=bounded(run.stdout);report.stderr=bounded(run.stderr);
                if(mode==='capture'){
                  try{const log=await fs.readFile(childLog),decoded=log.toString('utf16le').replace(/^\uFEFF/,''),newline=decoded.indexOf('\n');report.childOutputBytes=log.length;report.pluginStatus=newline<0?bounded(decoded):decoded.slice(0,newline).trim();report.childOutput=bounded(newline<0?'':decoded.slice(newline+1));}
                  catch(error){if(error.code!=='ENOENT')throw error;report.childOutputBytes=0;report.childOutput=null;}
                }
                report.targetTopLevel=(await fs.readdir(target)).sort().slice(0,16);
                report.keepPreserved=await fs.readFile(path.join(target,'KEEP.txt'),'utf8')==='unrelated original file';
                try{report.applicationExtracted=await fs.readFile(path.join(target,'CONTROL-PAYLOAD.txt'),'utf8')==='untampered prerequisite control';}
                catch(error){if(error.code!=='ENOENT')throw error;report.applicationExtracted=false;}
                report.registrationStatus=spawnSync('reg.exe',['query',registrationPath],{windowsHide:true}).status;
                const after=preflight();report.registeredAfter=after.installedVersion;
                assert.equal(after.installedVersion,before.installedVersion,'The control unexpectedly changed runtime registration.');
                assert.ok(report.keepPreserved,'The control changed an unrelated fixture file.');
                const uninstaller=path.join(target,'Uninstall.exe');
                try{
                  await fs.access(uninstaller);
                  // NSIS _?= runs in-place so its process remains waitable; root is later
                  // removed explicitly and includes only this uniquely named test fixture.
                  const uninstall=spawnSync(uninstaller,['/S','_?='+target],{windowsHide:true,windowsVerbatimArguments:true,encoding:'utf8',timeout:120000,maxBuffer:1024*1024});
                  report.uninstallStatus=uninstall.status;report.uninstallError=uninstall.error?uninstall.error.code||uninstall.error.name:null;
                }catch(error){if(error.code!=='ENOENT')throw error;report.uninstallStatus=null;}
              }finally{
                spawnSync('reg.exe',['delete',registrationPath,'/f'],{windowsHide:true});
                await fs.rm(shortcut,{force:true});await fs.rm(menu,{recursive:true,force:true});
                await fs.rm(root,{recursive:true,force:true,maxRetries:5,retryDelay:100});
                report.cleanupComplete=true;reports.push(report);
                process.stdout.write(JSON.stringify(report)+'\n');
              }
            }
            return reports;
          }
          main().catch(error=>{process.stderr.write('CONTROL_DIAGNOSTIC_FAILED '+bounded(error.stack)+'\n');process.exitCode=1;});
          '@
          $controlPath = Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control.cjs'
          [IO.File]::WriteAllText($controlPath, $control, (New-Object Text.UTF8Encoding($false)))
          $output = @(node $controlPath desktop-pos both 2>&1)
          $code = $LASTEXITCODE
          $raw = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
          $raw | Set-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-output.txt') -Encoding utf8NoBOM
          Write-Output $raw
          [ordered]@{ format = 1; diagnosticOnly = $true; sourceRevision = '48b1d0fae8de73a97ab07b53ca0a0667830bf3d9'; harnessExitCode = $code; releaseVerified = $false } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'desktop-prerequisite-control-state.json') -Encoding utf8NoBOM
      - name: Retain the diagnostic control reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-prerequisite-control-DIAGNOSTIC-ONLY
          path: |
            ${{ runner.temp }}/desktop-prerequisite-control-output.txt
            ${{ runner.temp }}/desktop-prerequisite-control-state.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop after the diagnostic without rebuilding or publishing a release
        shell: pwsh
        run: throw 'Diagnostic-only run complete. Review the original and captured prerequisite results before rebuilding the product.'
  windows-installer:
    needs: prerequisite-control
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DESKTOP_TESTED_RUN: ${{ inputs.runtime_run_id || '39363944148' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the original runtime checks to have passed
        shell: pwsh
        env:
          DESKTOP_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          if ($env:DESKTOP_TESTED_RUN -cne '39363944148') { throw 'This follow-up is pinned to the completed original-runtime checks in run176.' }
          $headers = @{ Authorization = "Bearer $env:DESKTOP_ARTIFACT_TOKEN"; Accept = 'application/vnd.github+json' }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN"
          if ($run.head_sha -cne '939408badb7d3de771b6c9953a4bfd5dbd08df1c' -or $run.run_attempt -ne 1 -or $run.event -cne 'pull_request') { throw 'The reviewed runtime run identity changed.' }
          $jobs = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN/jobs?per_page=100"
          if (!($jobs.jobs | Where-Object { $_.id -eq 118436478259 -and $_.name -ceq 'original-runtime' -and $_.conclusion -ceq 'success' })) { throw 'The exact source runtime has not passed its original application checks.' }
          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:DESKTOP_TESTED_RUN/artifacts?per_page=100"
          $runtime = @($artifacts.artifacts | Where-Object { $_.name -ceq 'tested-dashboard-runtime' })
          if ($runtime.Count -ne 1 -or $runtime[0].id -ne 12240055641 -or $runtime[0].expired -or $runtime[0].digest -cne 'sha256:7083f656f50cf2ef1d5c40bbf95ea5f71c460bb25ef81406a54e682f8d11513a') { throw 'The original tested runtime artifact changed.' }
          Write-Output 'DESKTOP_TESTED_RUNTIME run=39363944148 attempt=1 job=118436478259 artifact=12240055641 sha256=7083f656f50cf2ef1d5c40bbf95ea5f71c460bb25ef81406a54e682f8d11513a'
      - name: Restore the exact tested runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/runtime-download
          run-id: ${{ env.DESKTOP_TESTED_RUN }}
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Extract the verified archive with Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/runtime-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified runtime archive.' }
          $runtimeZip = "$env:RUNNER_TEMP/tested-runtime.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $runtimeZip
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath "$env:RUNNER_TEMP/tested-runtime" -Force
          Remove-Item -LiteralPath $runtimeZip
      - name: Require identical current product code
        id: source
        working-directory: current-source
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:RUNNER_TEMP/tested-runtime/runtime-bundle/manifest.json" -Raw | ConvertFrom-Json
          $sourceRevision = $manifest.sourceRevision
          if ($sourceRevision -cne '48b1d0fae8de73a97ab07b53ca0a0667830bf3d9' -or $manifest.sourceFingerprint.files -ne 1317 -or $manifest.sourceFingerprint.sha256 -cne '4288c371691750f5278d145b4d036be0d78d7c170d18fd7d61217954c2866a56' -or $manifest.runtimeFramework -cne '12.70.0') { throw 'The downloaded runtime does not identify the exact passed application.' }
          git fetch --depth=1 origin $sourceRevision
          if ($LASTEXITCODE -ne 0) { throw 'The tested revision cannot be independently checked.' }
          $acceptanceRevision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $acceptanceRevision -cne $env:GITHUB_SHA) { throw 'The acceptance checkout does not match this workflow revision.' }
          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'The acceptance checkout is not clean.' }
          $fixture = 'desktop-pos/test/installer-prerequisite-native.cjs'
          $workflow = '.github/workflows/desktop-dashboard-installer-verify.yml'
          $expectedFixtureBlob = 'ad24ab9392a7ea0ba37b507ad9310ad739ba8f80'
          # Every tracked file and mode is compared, including build tools and other fixtures.
          $changes = @(& git diff --raw --no-abbrev --no-renames $sourceRevision HEAD)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 2) { throw 'Only the reviewed acceptance fixture and this follow-up workflow may differ.' }
          foreach ($change in $changes) {
            if ($change -cnotmatch '^:100644 100644 [a-f0-9]{40} [a-f0-9]{40} M\t(.+)$') { throw 'An unreviewed file mode, type or change entered the acceptance checkout.' }
            if (@($fixture, $workflow) -cnotcontains $Matches[1]) { throw 'Product code, dependencies, build tools or another fixture differs; run the full original checks first.' }
          }
          $actualFixtureBlob = (& git rev-parse ("HEAD:" + $fixture)).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualFixtureBlob -cne $expectedFixtureBlob) { throw 'The reviewed acceptance fixture blob changed.' }
          "revision=$sourceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "acceptance=$acceptanceRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "fixture=$expectedFixtureBlob" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: b
      - name: Restore verified inputs into their tested checkout
        shell: pwsh
        run: |
          Move-Item "$env:RUNNER_TEMP/tested-runtime/runtime-bundle" b/desktop-pos/runtime-bundle
          New-Item -ItemType Directory -Path b/desktop-pos/dist -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/runtime-audit.json" b/desktop-pos/dist/runtime-audit.json
          Copy-Item "$env:RUNNER_TEMP/tested-runtime/dist/dashboard-synthetic-snapshot.json" b/desktop-pos/dist/dashboard-synthetic-snapshot.json
      - name: Verify the signed prerequisite with both tested PowerShell versions
        working-directory: b
        shell: pwsh
        run: |
          & .github/scripts/prepare-desktop-vcredist.ps1 -Project desktop-pos
          & ./desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File desktop-pos/test/windows-prerequisite.ps1 -Project desktop-pos -PayloadPath desktop-pos/dist/prerequisites/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell prerequisite checks failed.' }
      - name: Diagnose the actual prerequisite without changing the machine
        shell: pwsh
        run: |
          $probe = @'
          # Diagnostic only: never calls EnsureInstalled, Initialize-DesktopVcRuntime or an installer.
          [CmdletBinding()]
          param([Parameter(Mandatory = $true)][string] $Project)
          $ErrorActionPreference = 'Stop'

          function Get-ProbeFailure {
              param($Record)
              $exception = $Record.Exception
              $current = $exception
              $traversals = 0
              $nativeErrorCode = $null
              $reason = 'unclassified'
              # Inspect the outer exception plus at most four inner links; never emit messages or paths.
              for ($index = 0; $index -le 4; $index++) {
                  if ($current.HResult -eq -2147024864) { $reason = 'sharing-violation' }
                  elseif ($current.HResult -eq -2147024891) { $reason = 'access-denied' }
                  if ($current -is [ComponentModel.Win32Exception]) { $nativeErrorCode = [int]$current.NativeErrorCode }
                  if ($index -eq 4 -or $null -eq $current.InnerException) { break }
                  $current = $current.InnerException
                  $traversals++
              }
              return [ordered]@{
                  type = [string]$exception.GetType().FullName
                  hresult = [int]$exception.HResult
                  innermostType = [string]$current.GetType().FullName
                  innermostHresult = [int]$current.HResult
                  innerTraversals = [int]$traversals
                  nativeErrorCode = $nativeErrorCode
                  reason = [string]$reason
              }
          }

          function Read-ProbeRegistry {
              param([Microsoft.Win32.RegistryView] $View)
              $hive = $null; $key = $null
              try {
                  $hive = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, $View)
                  $key = $hive.OpenSubKey('SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64')
                  $fields = [ordered]@{}
                  if ($null -ne $key) {
                      foreach ($name in @('Installed', 'Major', 'Minor', 'Bld', 'Rbld', 'Version')) {
                          $value = $key.GetValue($name)
                          if ($null -eq $value) { $fields[$name] = [ordered]@{ present = $false; value = $null }; continue }
                          $safeValue = $null
                          if ($value -is [int] -or $value -is [long] -or $value -is [uint32]) { $safeValue = [long]$value }
                          elseif ($value -is [string] -and $value -match '^[vV]?[0-9.]{1,64}$') { $safeValue = [string]$value }
                          $fields[$name] = [ordered]@{
                              present = $true
                              kind = [string]$key.GetValueKind($name).ToString()
                              type = [string]$value.GetType().FullName
                              value = $safeValue
                              recognized = [bool]($null -ne $safeValue)
                          }
                      }
                  }
                  return [ordered]@{ success = $true; keyExists = [bool]($null -ne $key); fields = $fields }
              } catch {
                  return [ordered]@{ success = $false; keyExists = $null; error = (Get-ProbeFailure $_) }
              } finally {
                  if ($null -ne $key) { $key.Dispose() }
                  if ($null -ne $hive) { $hive.Dispose() }
              }
          }

          function Test-ProbePayload {
              param([string] $Path, $Policy, [bool] $Locked)
              $handle = $null
              try {
                  if ($Locked) { $handle = [IO.File]::Open($Path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read) }
                  $result = Test-DesktopVcPayload -Path $Path -Policy $Policy
                  return [ordered]@{
                      success = $true
                      readSharingLock = $Locked
                      payload = [ordered]@{
                          architecture = [string]$result.architecture
                          version = [string]$result.version
                          bytes = [long]$result.bytes
                          sha256 = [string]$result.sha256
                          signerSha256 = [string]$result.signerSha256
                          signatureValid = [bool]$result.signatureValid
                      }
                  }
              } catch {
                  return [ordered]@{ success = $false; readSharingLock = $Locked; error = (Get-ProbeFailure $_) }
              } finally {
                  if ($null -ne $handle) { $handle.Dispose() }
              }
          }

          $report = [ordered]@{
              format = 1
              readOnly = $true
              is64BitOperatingSystem = [bool][Environment]::Is64BitOperatingSystem
              is64BitProcess = [bool][Environment]::Is64BitProcess
              pointerBytes = [int][IntPtr]::Size
              powershellVersion = [string]$PSVersionTable.PSVersion.ToString()
              sourceLoaded = $false
          }
          $failed = $false
          try {
              $projectRoot = [IO.Path]::GetFullPath($Project)
              $payloadPath = Join-Path $projectRoot 'dist/prerequisites/vc_redist.x64.exe'
              $policyPath = Join-Path $projectRoot 'windows-vcredist.json'
              # Dot-sourcing defines functions only; the source's executable entry point is not entered.
              . (Join-Path $projectRoot 'windows-vcredist.ps1') -Action ValidatePayload -PayloadPath $payloadPath -PolicyPath $policyPath
              $report.sourceLoaded = $true
              $policy = Read-DesktopVcPolicy -Path $policyPath
              $report.policy = [ordered]@{
                  architecture = [string]$policy.architecture; minimumVersion = [string]$policy.version
                  bytes = [long]$policy.bytes; sha256 = [string]$policy.sha256; signerSha256 = [string]$policy.signerSha256
              }
              $report.unlocked = Test-ProbePayload -Path $payloadPath -Policy $policy -Locked $false
              $report.locked = Test-ProbePayload -Path $payloadPath -Policy $policy -Locked $true
              if (-not $report.unlocked.success -or -not $report.locked.success) { $failed = $true }
              try {
                  $installed = Get-DesktopVcInstalledVersion
                  $report.sourceInstalledVersion = [ordered]@{
                      success = $true
                      version = $(if ($null -eq $installed) { $null } else { [string]$installed.ToString() })
                      minimumSatisfied = [bool]($null -ne $installed -and $installed -ge [version]$policy.version)
                  }
              } catch {
                  $report.sourceInstalledVersion = [ordered]@{ success = $false; error = (Get-ProbeFailure $_) }
                  $failed = $true
              }
          } catch {
              $report.sourceError = Get-ProbeFailure $_
              $failed = $true
          }
          $report.registry32 = Read-ProbeRegistry -View ([Microsoft.Win32.RegistryView]::Registry32)
          $report.registry64 = Read-ProbeRegistry -View ([Microsoft.Win32.RegistryView]::Registry64)
          if (-not $report.registry32.success -or -not $report.registry64.success) { $failed = $true }
          $report.validationPassed = [bool](-not $failed)
          [Console]::Out.WriteLine(($report | ConvertTo-Json -Depth 12 -Compress))
          if ($failed) { exit 1 }
          exit 0
          '@
          $probeFile = Join-Path $env:RUNNER_TEMP 'desktop-vc-readonly-probe.ps1'
          [IO.File]::WriteAllText($probeFile, $probe, (New-Object Text.UTF8Encoding($false)))
          $project = (Resolve-Path b/desktop-pos).Path
          $results = @()
          foreach ($entry in @(@{ label = '64'; directory = 'System32'; expected64 = $true }, @{ label = '32'; directory = 'SysWOW64'; expected64 = $false })) {
            $executable = Join-Path $env:SystemRoot ($entry.directory + '\WindowsPowerShell\v1.0\powershell.exe')
            $output = @(& $executable -NoProfile -NonInteractive -File $probeFile -Project $project 2>&1)
            $code = $LASTEXITCODE
            $raw = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP ('desktop-vc-readonly-' + $entry.label + '.json')), $raw, (New-Object Text.UTF8Encoding($false)))
            $valid = $false
            try {
              $proof = $raw | ConvertFrom-Json -ErrorAction Stop
              $valid = ($code -eq 0 -and $proof.readOnly -is [bool] -and $proof.readOnly -eq $true -and $proof.validationPassed -is [bool] -and $proof.validationPassed -eq $true -and $proof.is64BitProcess -is [bool] -and $proof.is64BitProcess -eq $entry.expected64)
              Write-Output ('DESKTOP_PREREQUISITE_READONLY_' + $entry.label + ' ' + ($proof | ConvertTo-Json -Depth 12 -Compress))
            } catch { Write-Output ('DESKTOP_PREREQUISITE_READONLY_' + $entry.label + ' invalid JSON; exit=' + $code) }
            $results += [ordered]@{ processBits = [int]$entry.label; exitCode = $code; validationPassed = [bool]$valid }
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'desktop-vc-readonly-results.json'), (ConvertTo-Json -InputObject $results -Depth 4), (New-Object Text.UTF8Encoding($false)))
      - name: Retain both read-only prerequisite diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: desktop-prerequisite-readonly-diagnostics
          path: ${{ runner.temp }}/desktop-vc-readonly-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Require both real locked payload validations before building
        shell: pwsh
        run: |
          $results = @(Get-Content (Join-Path $env:RUNNER_TEMP 'desktop-vc-readonly-results.json') -Raw | ConvertFrom-Json)
          if ($results.Count -ne 2 -or @($results | Where-Object { $_.validationPassed -isnot [bool] -or $_.validationPassed -ne $true -or $_.exitCode -ne 0 }).Count -ne 0) { throw 'Read-only prerequisite validation failed; both architecture diagnostics were retained.' }
      - name: Build the installer with exact source and dependency verification
        working-directory: b
        shell: pwsh
        run: |
          npm ci --prefix desktop-pos --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Electron build dependencies failed.' }
          node desktop-pos/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0 -or !(Test-Path desktop-pos/node_modules/electron/dist/electron.exe)) { throw 'Pinned Electron binary download did not complete.' }
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/print-effects-native.cjs desktop-pos/dist/offline-print-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron print lifecycle acceptance failed.' }
          $printProof = Get-Content desktop-pos/dist/offline-print-native.json -Raw | ConvertFrom-Json
          if ($printProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $printProof.platform -ne 'win32' -or $printProof.hardware -ne $false -or $printProof.invocations -ne 7 -or $printProof.accepted -ne 6 -or $printProof.review -ne 1) { throw 'Native print proof is incomplete or from another source.' }
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/outbox-review-native.cjs desktop-pos/dist/outbox-review-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Electron synchronization review and Windows DPAPI audit checks failed.' }
          $reviewProof = Get-Content desktop-pos/dist/outbox-review-native.json -Raw | ConvertFrom-Json
          if ($reviewProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $reviewProof.platform -ne 'win32' -or $reviewProof.completed -ne $true -or $reviewProof.actualDpapiAudit -ne $true -or $reviewProof.durableIntentBeforeRetry -ne $true -or $reviewProof.unchangedCommandId -ne $true) { throw 'Native review proof is incomplete or from another source.' }
          node desktop-pos/test/run-electron-native.cjs desktop-pos/test/connected-request-native.cjs desktop-pos/dist/connected-request-native.json
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Electron connected request acceptance failed.' }
          $connectedProof = Get-Content desktop-pos/dist/connected-request-native.json -Raw | ConvertFrom-Json
          $lockedConnectedElectron = (Get-Content desktop-pos/package-lock.json -Raw | ConvertFrom-Json -AsHashtable)['packages']['node_modules/electron']['version']
          if ($connectedProof.electronVersion -isnot [string] -or $connectedProof.electronVersion -ne $lockedConnectedElectron) { throw 'The actual connected Electron process differs from its exact lock.' }
          if ($connectedProof.sourceRevision -ne '${{ steps.source.outputs.revision }}' -or $connectedProof.platform -ne 'win32' -or $connectedProof.hardware -isnot [bool] -or $connectedProof.hardware -ne $false -or $connectedProof.completed -isnot [bool] -or $connectedProof.completed -ne $true) { throw 'Native connected proof is incomplete or from another source.' }
          foreach ($field in @('actualElectronSessionFetch', 'actualWebRequest', 'actualDpapi', 'pinnedLoopbackHttps', 'pairedProofOnWire', 'internalMarkerStripped', 'foreignProofStripped', 'nativeReplayBlocked', 'fragmentNormalized', 'oldProtocolBlocked', 'lostReplyRetained', 'unboundedOriginalWrite', 'nativeReauthentication', 'expiredCookieBlocked', 'reauthSameActorProtocol', 'reauthWrongActorBlocked', 'reauthOldProtocolBlocked', 'reauthMutationBlocked', 'reauthCancelled', 'reauthPreservedMode', 'reauthNoPreload', 'reauthRedirectBlocked', 'nativeLocalReauthentication')) {
            if ($connectedProof.$field -isnot [bool] -or $connectedProof.$field -ne $true) { throw "Native connected proof is missing $field." }
          }
          if ($connectedProof.printedSources -ne 4 -or $connectedProof.originalWrites -ne 1 -or $connectedProof.invocations -ne 4 -or $connectedProof.lostPrintRequests -ne 1 -or $connectedProof.reauthentications -ne 6 -or $connectedProof.reauthOriginalSignins -ne 5 -or $connectedProof.reauthSuccesses -ne 3 -or $connectedProof.localReauthentications -ne 1) { throw 'Native connected proof did not complete every original request and print lifecycle.' }
          node ../current-source/.github/scripts/desktop-nsis-compile-deadline.cjs desktop-pos
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed compiler deadline setup failed.' }
          # The preview preserves long installation paths and every verified runtime byte.
          Copy-Item ../current-source/.github/scripts/desktop-runtime-copy-hook.cjs desktop-pos/runtime-copy-hook.cjs
          try {
            npm run build:win --prefix desktop-pos -- --config.afterPack=./runtime-copy-hook.cjs --config.nsis.script=installer-windows.nsi
            $buildResult = $LASTEXITCODE
          } finally {
            if (Test-Path desktop-pos/dist/nsis-build-drive.json) {
              $mapping = Get-Content desktop-pos/dist/nsis-build-drive.json -Raw | ConvertFrom-Json
              if ($mapping.drive -ne 'R:') { throw 'Unexpected compiler mapping.' }
              subst.exe $mapping.drive /d
            }
          }
          if ($buildResult -ne 0) { throw 'Windows installer preview failed.' }
      - name: Record the compiled candidate identity before acceptance
        working-directory: b
        shell: pwsh
        env:
          DESKTOP_PRODUCT_SOURCE: ${{ steps.source.outputs.revision }}
          DESKTOP_ACCEPTANCE_REVISION: ${{ steps.source.outputs.acceptance }}
        run: |
          $candidate = Get-Item desktop-pos/dist/Fasakhansta-Dashboard-Preview-Setup.exe
          $proof = [ordered]@{ format = 1; verifiedRelease = $false; sourceRevision = $env:DESKTOP_PRODUCT_SOURCE; acceptanceRevision = $env:DESKTOP_ACCEPTANCE_REVISION; productChanged = $false; bytes = $candidate.Length; sha256 = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $proof | ConvertTo-Json | Set-Content desktop-pos/dist/UNVERIFIED-compiled-candidate.json -Encoding utf8NoBOM
          Write-Output ('DESKTOP_UNVERIFIED_COMPILED_CANDIDATE ' + ($proof | ConvertTo-Json -Compress))
      - name: Preserve the UNVERIFIED candidate for diagnosis only
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-compiled-installer-for-diagnostics
          path: |
            b/desktop-pos/dist/Fasakhansta-Dashboard-Preview-Setup.exe
            b/desktop-pos/dist/UNVERIFIED-compiled-candidate.json
            b/desktop-pos/dist/runtime-package.json
            b/desktop-pos/dist/runtime-audit.json
            b/desktop-pos/dist/prerequisites/vcredist-package.json
            b/desktop-pos/dist/offline-print-native.json
            b/desktop-pos/dist/outbox-review-native.json
            b/desktop-pos/dist/connected-request-native.json
            b/desktop-pos/dist/dashboard-synthetic-snapshot.json
          if-no-files-found: error
          retention-days: 7
      - name: Apply only the pinned acceptance fixture after the clean product build
        shell: pwsh
        env:
          DESKTOP_ACCEPTANCE_FIXTURE_BLOB: ${{ steps.source.outputs.fixture }}
          DESKTOP_ACCEPTANCE_REVISION: ${{ steps.source.outputs.acceptance }}
          DESKTOP_PRODUCT_SOURCE: ${{ steps.source.outputs.revision }}
        run: |
          # The installer has already been built from the untouched tested checkout.
          # Write exact Git blob bytes rather than relying on Windows text conversion.
          node -e "const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),crypto=require('node:crypto');const blob=process.env.DESKTOP_ACCEPTANCE_FIXTURE_BLOB;const bytes=cp.execFileSync('git',['cat-file','blob',blob],{cwd:'current-source'});const hash=data=>crypto.createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');if(hash(bytes)!==blob)throw Error('Acceptance source blob mismatch');const file=path.join('b','desktop-pos','test','installer-prerequisite-native.cjs');fs.writeFileSync(file,bytes);if(hash(fs.readFileSync(file))!==blob)throw Error('Acceptance overlay changed');const proof={format:1,testedRun:39363944148,testedArtifact:12240055641,sourceRevision:process.env.DESKTOP_PRODUCT_SOURCE,acceptanceRevision:process.env.DESKTOP_ACCEPTANCE_REVISION,fixturePath:'desktop-pos/test/installer-prerequisite-native.cjs',fixtureBlob:blob,productChanged:false};fs.writeFileSync(path.join('b','desktop-pos','dist','installer-acceptance-provenance.json'),JSON.stringify(proof,null,2)+'\n');console.log('DESKTOP_INSTALLER_ACCEPTANCE_PROVENANCE '+JSON.stringify(proof));"
          if ($LASTEXITCODE -ne 0) { throw 'The exact reviewed acceptance overlay could not be applied.' }
      - name: Verify actual installed dashboard recovery and retained unsynced data
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        working-directory: b
        shell: pwsh
        run: |
          $diagnosedAcceptance = @'
          'use strict';
          const cp = require('node:child_process');
          const original = cp.execFileSync;
          cp.execFileSync = function (...args) {
            try { return Reflect.apply(original, this, args); }
            catch (error) {
              const bounded = value => value == null ? null : String(value).slice(0, 8192);
              process.stderr.write('DESKTOP_ACTUAL_CHILD_FAILURE ' + JSON.stringify({ executable: require('node:path').basename(String(args[0])), status: error.status ?? null, code: error.code ?? null, signal: error.signal ?? null, killed: error.killed ?? null, stdout: bounded(error.stdout), stderr: bounded(error.stderr) }) + '\n');
              throw error;
            }
          };
          require('./desktop-pos/test/installer-native.cjs');
          '@
          node -e $diagnosedAcceptance
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed dashboard acceptance failed; original child failure metadata was logged.' }
      - name: Retain only the verified installer and receipts
        uses: actions/upload-artifact@v4
        with:
          name: fasakhansta-dashboard-installer-preview
          path: |
            b/desktop-pos/dist/Fasakhansta-Dashboard-Preview-Setup.exe
            b/desktop-pos/dist/installer-checks.json
            b/desktop-pos/dist/runtime-package.json
            b/desktop-pos/dist/runtime-audit.json
            b/desktop-pos/dist/prerequisites/vcredist-package.json
            b/desktop-pos/dist/offline-print-native.json
            b/desktop-pos/dist/outbox-review-native.json
            b/desktop-pos/dist/connected-request-native.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain the separate source and acceptance provenance
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-acceptance-provenance
          path: b/desktop-pos/dist/installer-acceptance-provenance.json
          if-no-files-found: error
          retention-days: 30
