              }
          }

          $report = [ordered]@{
              format = 1
              readOnly = $true
              is64BitOperatingSystem = [bool][Environment]::Is64BitOperatingSystem
              is64BitProcess = [bool][Environment]::Is64BitProcess
              pointerBytes = [int][IntPtr]::Size
