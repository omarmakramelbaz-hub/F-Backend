            $raw = ($output | ForEach-Object { $_.ToString() }) -join [Environment]::NewLine
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP ('desktop-vc-readonly-' + $entry.label + '.json')), $raw, (New-Object Text.UTF8Encoding($false)))
            $valid = $false
            try {
              $proof = $raw | ConvertFrom-Json -ErrorAction Stop
              $valid = ($code -eq 0 -and $proof.readOnly -is [bool] -and $proof.readOnly -eq $true -and $proof.validationPassed -is [bool] -and $proof.validationPassed -eq $true -and $proof.is64BitProcess -is [bool] -and $proof.is64BitProcess -eq $entry.expected64)
              Write-Output ('DESKTOP_PREREQUISITE_READONLY_' + $entry.label + ' ' + ($proof | ConvertTo-Json -Depth 12 -Compress))
            } catch { Write-Output ('DESKTOP_PREREQUISITE_READONLY_' + $entry.label + ' invalid JSON; exit=' + $code) }
            $results += [ordered]@{ processBits = [int]$entry.label; exitCode = $code; validationPassed = [bool]$valid }
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'desktop-vc-readonly-results.json'), (ConvertTo-Json -InputObject $results -Depth 4), (New-Object Text.UTF8Encoding($false)))
      - name: Retain both read-only prerequisite diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: desktop-prerequisite-readonly-diagnostics
          path: ${{ runner.temp }}/desktop-vc-readonly-*.json
          if-no-files-found: error
          retention-days: 7
