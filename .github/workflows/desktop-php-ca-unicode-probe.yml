name: Verify real TLS with bundled PHP CA paths

on:
  push:
    branches: ['codex/php-ca-unicode-probe-20261010']
    paths: ['.github/workflows/desktop-php-ca-unicode-probe.yml', '.github/scripts/desktop-php-ca-unicode-probe.cjs']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  php-ca-unicode-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore the exact independently tested runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dashboard-runtime
          path: ${{ runner.temp }}/php-ca-probe-download
          run-id: 38000617682
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
      - name: Verify the pinned artifact digest and extract with Windows
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/php-ca-probe-download" -File)
          if ($archives.Count -ne 1) { throw 'Expected one verified runtime archive.' }
          $actual = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '66c8e7be5ca3d5590105bc6833af4242a95e7bfc6e9d1599a08fb72661bcdfff') { throw 'The independently tested runtime archive digest changed.' }
          $zip = "$env:RUNNER_TEMP/php-ca-probe.zip"
          Move-Item -LiteralPath $archives[0].FullName -Destination $zip
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/php-ca-probe" -Force
      - name: Verify public TLS with the original absolute CA settings
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/scripts/desktop-php-ca-unicode-probe.cjs "${{ runner.temp }}/php-ca-probe/runtime-bundle" "${{ runner.temp }}/php-ca-path-results.json"
      - name: Retain bounded public TLS diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-php-ca-path-diagnostic
          path: ${{ runner.temp }}/php-ca-path-results.json
          retention-days: 3
          if-no-files-found: ignore
