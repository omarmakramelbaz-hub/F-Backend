name: GO ERP approved source backup families
on:
  push:
    branches: [codex/go-erp-source-backup-families-20261021]
  pull_request:
    paths:
      - 'deployment/archive_go_erp_meta_backups_root.py'
      - 'tests/test_go_erp_meta_backup_archive_root.py'
      - '.github/workflows/go-erp-source-backup-families.yml'
permissions:
  contents: read
jobs:
  approved-backup-families:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 14
      - name: Verify exact backup families, private custody and unchanged source
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_meta_backup_archive_root.py
