name: ERP branch link diagnostic

on:
  push:
    branches:
      - codex/fix-erp-branch-linking-20261002
    paths:
      - '.github/workflows/erp-branch-link-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Inspect production branch/order linking
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_ed25519             -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20             root@187.127.92.124 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/fasakha/public_html
          runuser -u fasakha -- php artisan tinker --execute='
          echo "__ERP_BRANCHES__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("erp_branches")->orderBy("id")->get() as $b) {
              echo json_encode($b,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }

          echo "__RESTAURANTS_WITH_ORDERS__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("resturants as r")
            ->leftJoin("orders as o","o.resturant_id","=","r.id")
            ->select("r.id","r.name","r.user_id","r.parent_id","r.status",\Illuminate\Support\Facades\DB::raw("COUNT(o.id) as orders_count"))
            ->groupBy("r.id","r.name","r.user_id","r.parent_id","r.status")
            ->orderByDesc("orders_count")->orderBy("r.id")->limit(80)->get() as $r) {
              echo json_encode($r,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }

          echo "__RECENT_ORDERS__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("orders as o")
            ->leftJoin("resturants as r","r.id","=","o.resturant_id")
            ->whereNotNull("o.status")
            ->select("o.id","o.order_no","o.resturant_id","o.status","o.type","o.created_at","r.name as restaurant_name")
            ->orderByDesc("o.id")->limit(40)->get() as $o) {
              echo json_encode($o,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }

          echo "__BRANCH_ACCOUNT_LINKS__".PHP_EOL;
          foreach (\Illuminate\Support\Facades\DB::table("users as u")
            ->leftJoin("resturants as r","r.user_id","=","u.id")
            ->whereIn("u.account_type",["vendor","resturant_owner","admin"])
            ->select("u.id","u.name","u.email","u.account_type","u.owner_resturant_id","r.id as restaurant_id","r.name as restaurant_name")
            ->orderBy("u.id")->limit(120)->get() as $u) {
              echo json_encode($u,JSON_UNESCAPED_UNICODE).PHP_EOL;
          }'
          REMOTE
