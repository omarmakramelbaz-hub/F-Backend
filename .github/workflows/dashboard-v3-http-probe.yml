name: Verify admin session and CSRF

on:
  push:
    branches:
      - codex/dashboard-v3-http-probe-20261003
    paths:
      - .github/workflows/dashboard-v3-http-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check login session and CSRF round trip
        shell: bash
        run: |
          set -euo pipefail
          base='https://fasakhaninja.com'
          curl -k -sS -c /tmp/cookies.txt             --connect-timeout 10 --max-time 30             "$base/admin/login" -o /tmp/login.html

          token=$(python3 - <<'PY'
          import re
          s=open('/tmp/login.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'name="_token"\s+value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
          )

          test -n "$token"
          code=$(curl -k -sS -b /tmp/cookies.txt -c /tmp/cookies.txt             -o /tmp/post.out -w '%{http_code}'             --connect-timeout 10 --max-time 30             -X POST "$base/admin/login"             --data-urlencode "_token=$token")

          echo "GET_LOGIN_OK=1"
          echo "CSRF_TOKEN_PRESENT=1"
          echo "POST_LOGIN_HTTP=$code"
          if [ "$code" = "419" ]; then
            echo "CSRF_ROUND_TRIP_FAILED"
            exit 1
          fi
          echo "CSRF_ROUND_TRIP_OK=1"
