name: Dashboard server installer safety
on:
  push:
    branches: ['codex/dashboard-server-integration-20261012', 'codex/dashboard-owner-repair-20261013', 'codex/dashboard-baseline-diagnosis-20261013']
    paths: ['deployment/*desktop*', 'deployment/install_whatsapp_inbox.py', 'tests/desktop_dashboard_server_install_test.py', 'tests/desktop_dashboard_actual_baseline_test.py', 'tests/desktop_dashboard_expense_rejection_baseline_test.py', 'tests/desktop_dashboard_owner_repair_test.py', 'tests/desktop_dashboard_publication_metadata_test.py', 'tests/desktop_dashboard_current_source_diagnosis_test.py', 'tests/fixtures/desktop-actual-server-baseline.json', 'tests/fixtures/desktop-derived-expense-rejection-baseline.json', '.github/workflows/desktop-dashboard-server-install-tests.yml']
  pull_request:
    paths: ['deployment/*desktop*', 'deployment/install_whatsapp_inbox.py', 'tests/desktop_dashboard_server_install_test.py', 'tests/desktop_dashboard_actual_baseline_test.py', 'tests/desktop_dashboard_expense_rejection_baseline_test.py', 'tests/desktop_dashboard_owner_repair_test.py', 'tests/desktop_dashboard_publication_metadata_test.py', 'tests/desktop_dashboard_current_source_diagnosis_test.py', 'tests/fixtures/desktop-actual-server-baseline.json', 'tests/fixtures/desktop-derived-expense-rejection-baseline.json', '.github/workflows/desktop-dashboard-server-install-tests.yml']
permissions:
  contents: read
jobs:
  installer-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate PHP and root launcher
        run: |
          php -l deployment/desktop_dashboard_release.php
          bash -n deployment/apply_desktop_dashboard_server_root.sh
      - name: Exercise backup, publication and recovery failures
        run: python3 -B tests/desktop_dashboard_server_install_test.py
      - name: Check exact measured baseline and reject mixed source
        run: python3 -B tests/desktop_dashboard_actual_baseline_test.py
      - name: Verify the exact derived expense update cohort
        run: python3 -B tests/desktop_dashboard_expense_rejection_baseline_test.py
      - name: Exercise scoped ownership repair as real root
        run: sudo python3 -B tests/desktop_dashboard_owner_repair_test.py --require-real-owners
      - name: Exercise exact38 publication metadata repairs as real root
        run: sudo python3 -B tests/desktop_dashboard_publication_metadata_test.py --require-real-owners
      - name: Check source diagnosis privacy and concurrent change guards
        run: python3 -B tests/desktop_dashboard_current_source_diagnosis_test.py
      - name: Check immutable helper and source manifest pins
        run: |
          python3 -B - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path.cwd()
          blob = lambda d: hashlib.sha1(b'blob ' + str(len(d)).encode() + b'\0' + d).hexdigest()
          source = (root / 'deployment/apply_desktop_dashboard_server_root.sh').read_text()
          pins = re.findall(r"'(deployment/[^']+)': '([a-f0-9]{40})'", source)
          assert len(pins) == 4
          for name, pin in pins:
              assert blob((root / name).read_bytes()) == pin, name
          for name in ['desktop_dashboard_server_manifest.json']:
              manifest = json.loads((root / 'deployment' / name).read_text())
              profile = {}
              for row in manifest['sources']:
                  assert blob((root / row['path']).read_bytes()) == row['after_blob'], row['path']
                  profile[row['path']] = row['after_blob']
              for row in manifest['protected']:
                  assert blob((root / row['path']).read_bytes()) == row['blob'], row['path']
                  profile[row['path']] = row['blob']
              print('VERIFIED_INSTALLER_PAYLOAD', name, len(manifest['sources']))
          assert not (root / 'deployment/desktop_dashboard_server_manifest_attachments.json').exists()
          assert 'deployment/desktop_dashboard_server_manifest_attachments.json' not in dict(pins)
          scope_path = root / 'deployment/desktop_dashboard_publication_metadata_scope.json'
          scope = json.loads(scope_path.read_text())
          # Metadata repair remains pinned to its historical measured cohort.
          manifest_pin = blob((root / 'deployment/desktop_dashboard_server_manifest-20261019-1323.json').read_bytes())
          assert manifest_pin != blob((root / 'deployment/desktop_dashboard_server_manifest.json').read_bytes())
          assert scope['version'] == 2 and 'release' not in scope
          assert scope['manifest_blob'] == manifest_pin and len(scope['rows']) == 38
          repair = (root / 'deployment/repair_desktop_dashboard_publication_metadata.py').read_text()
          for key, expected in [('SCOPE_BLOB', blob(scope_path.read_bytes())), ('MANIFEST_BLOB', manifest_pin)]:
              assert re.search(r"^" + key + r" = '([a-f0-9]{40})'", repair, re.M).group(1) == expected
          diagnosis = (root / 'deployment/diagnose_desktop_dashboard_current_source.py').read_text()
          diagnosis_pins = re.findall(r"'([^']+)': '([a-f0-9]{40})'", diagnosis)
          assert len(diagnosis_pins) == 4
          for name, pin in diagnosis_pins:
              directory = 'tests/fixtures' if name == 'desktop-actual-server-baseline.json' else 'deployment'
              archived = {'desktop-actual-server-baseline.json': 'desktop-actual-server-baseline-20261019-1323.json',
                          'desktop_dashboard_server_manifest.json': 'desktop_dashboard_server_manifest-20261019-1323.json'}
              assert blob((root / directory / archived.get(name, name)).read_bytes()) == pin, name
          assert blob((root / 'deployment/meta_messaging_route_check.php').read_bytes()) == 'cac1fbec511eb246fdef5b2ec87410638e45e08e'
          print('VERIFIED_REPAIR_AND_READ_ONLY_DIAGNOSIS_PINS', scope['version'], len(scope['rows']))
          PY
