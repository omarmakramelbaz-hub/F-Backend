name: Deploy ERP Order Center to Fasakhansta VPS

on:
  push:
    branches:
      - codex/fasakhansta-erp-foundation-20260930
    paths:
      - '.github/workflows/erp-order-center-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: fasakhansta-erp-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Safely deploy reviewed ERP order center
        shell: bash
        run: |
          set -euo pipefail
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@187.127.92.124 \
            'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          export LC_ALL=C
          root=/home/fasakha/public_html
          branch=codex/fasakhansta-erp-foundation-20260930
          target=84f56d3c276a30d46ee3cb87218d6cc177fd2eaf
          expected_host=srv1836524

          [[ "$(hostname)" == "$expected_host" ]] || { echo "STOP: unexpected host $(hostname)"; exit 1; }
          [[ -d "$root/.git" && -f "$root/artisan" && -f "$root/.env" && -f "$root/vendor/autoload.php" ]] || { echo 'STOP: Fasakhansta application root not found.'; exit 1; }
          cd "$root"
          git config --global --add safe.directory "$root" >/dev/null 2>&1 || true

          app_user=$(stat -c %U .env)
          app_group=$(stat -c %G .env)
          [[ "$app_user" == "fasakha" ]] || { echo "STOP: unexpected application owner: $app_user"; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo 'STOP: production has tracked local edits; no files changed.'; git status --short --untracked-files=no; exit 1; }

          echo "SERVER_HOST=$(hostname)"
          echo "APPLICATION_ROOT=$root"
          echo "CURRENT_COMMIT=$(git rev-parse HEAD)"

          runuser -u "$app_user" -- php -r '$loader=require "vendor/autoload.php"; if ($loader->isClassMapAuthoritative()) { fwrite(STDERR,"Authoritative autoload is unsupported for this release\n"); exit(1); }'
          runuser -u "$app_user" -- php artisan tinker --execute='echo (config("erp.enabled") && \Illuminate\Support\Facades\Schema::hasTable("erp_users") && \Illuminate\Support\Facades\Schema::hasTable("erp_branches") && \Illuminate\Support\Facades\Schema::hasTable("erp_ledger_state")) ? "__ERP_EXISTING_OK__" : "__ERP_EXISTING_NOT_READY__";' | grep -q __ERP_EXISTING_OK__

          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git cat-file -e "$target^{commit}"
          current=$(git rev-parse HEAD)

          if [[ "$current" == "$target" ]]; then
            echo 'ERP_ORDER_CENTER_ALREADY_AT_TARGET'
            exit 0
          fi

          git merge-base --is-ancestor "$current" "$target" || { echo 'STOP: target is not a forward update of the live commit.'; exit 1; }
          if git diff --name-only "$current" "$target" | grep -q '^database/migrations/'; then
            echo 'STOP: this order-center release unexpectedly contains database migrations.'
            exit 1
          fi

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="/home/fasakha/erp-release-backups/order-center-$stamp-${current:0:12}"
          mkdir -p "$backup"
          git archive --format=tar.gz -o "$backup/application-tracked.tar.gz" "$current"
          git diff --name-status "$current" "$target" > "$backup/changed-files.txt"
          {
            echo "previous_commit=$current"
            echo "target_commit=$target"
            echo "created_utc=$stamp"
            echo "application_root=$root"
            echo "database_changed=no"
          } > "$backup/manifest.txt"
          sha256sum "$backup/application-tracked.tar.gz" > "$backup/application-tracked.sha256"
          chmod -R go-rwx "$backup"
          echo "BACKUP_DIRECTORY=$backup"

          maintenance=0
          switched=0
          success=0

          restore_runtime_ownership() {
            for p in app/Http/Controllers/Erp app/Services/Erp resources/views/erp public/erp-assets; do
              [[ -e "$p" ]] && chown -R "$app_user:$app_group" "$p"
            done
          }

          clear_runtime_caches() {
            runuser -u "$app_user" -- php artisan config:clear
            runuser -u "$app_user" -- php artisan route:clear
            runuser -u "$app_user" -- php artisan view:clear
            runuser -u "$app_user" -- php artisan clear-compiled
          }

          recover() {
            code=$?
            trap - EXIT INT TERM HUP
            if [[ "$success" == 1 ]]; then exit "$code"; fi
            set +e
            echo "DEPLOY_FAILED; ROLLING_BACK_TO=$current"
            if [[ "$switched" == 1 ]]; then
              git checkout --detach --no-overwrite-ignore "$current"
              restore_runtime_ownership
              clear_runtime_caches
            fi
            if [[ "$maintenance" == 1 ]]; then
              runuser -u "$app_user" -- php artisan up
            fi
            echo "ROLLBACK_COMPLETE; BACKUP_DIRECTORY=$backup"
            exit "$code"
          }
          trap recover EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          runuser -u "$app_user" -- php artisan down --retry=60
          maintenance=1

          git checkout --detach --no-overwrite-ignore "$target"
          switched=1
          restore_runtime_ownership

          runuser -u "$app_user" -- php -l app/Services/Erp/UnifiedOrders.php
          runuser -u "$app_user" -- php -l app/Http/Controllers/Erp/WorkspaceController.php
          clear_runtime_caches

          runuser -u "$app_user" -- php artisan route:list --name=erp.orders | grep -q 'erp/orders'
          runuser -u "$app_user" -- php artisan tinker --execute='
          $owner = new \App\Services\Erp\Actor("deploy:probe","Deployment probe","owner",null,\App\Services\Erp\Actor::CAPABILITIES);
          $service = app(\App\Services\Erp\UnifiedOrders::class);
          $day = now(config("erp.timezone"))->format("Y-m-d");
          $central = $service->dashboard($owner,null,$day,[]);
          if (!isset($central["columns"],$central["stats"],$central["version"])) { throw new \RuntimeException("Central order center payload invalid"); }
          $branchId = (int) \Illuminate\Support\Facades\DB::table("erp_branches")->where("active",true)->value("id");
          if ($branchId > 0) {
              $manager = new \App\Services\Erp\Actor("deploy:branch","Branch probe","branch_manager",$branchId,\App\Services\Erp\Actor::defaults("branch_manager"));
              $scoped = $service->dashboard($manager,$branchId,$day,["app"=>"fasakhansta","kind"=>"branch"]);
              foreach ($scoped["columns"] as $column) {
                  foreach ($column["rows"] as $row) {
                      if (($row["source_app"] ?? null) !== "fasakhansta" || (int)($row["branch_id"] ?? 0) !== $branchId) {
                          throw new \RuntimeException("Branch isolation check failed");
                      }
                  }
              }
          }
          app("blade.compiler")->compile(resource_path("views/erp/orders.blade.php"));
          echo "__ERP_ORDER_CENTER_RUNTIME_OK__ total=".$central["stats"]["total"]." go=".$central["stats"]["go"];
          ' | grep -q __ERP_ORDER_CENTER_RUNTIME_OK__

          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo 'STOP: tracked checkout became dirty.'; git status --short --untracked-files=no; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$target" ]] || { echo 'STOP: deployed commit mismatch.'; exit 1; }

          runuser -u "$app_user" -- php artisan up
          maintenance=0
          success=1
          trap - EXIT INT TERM HUP
          echo "ERP_ORDER_CENTER_DEPLOYED"
          echo "DEPLOYED_COMMIT=$target"
          echo "ROLLBACK_COMMIT=$current"
          echo "BACKUP_DIRECTORY=$backup"
          REMOTE

      - name: Verify server stayed on reviewed target
        shell: bash
        run: |
          set -euo pipefail
          ssh -T \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@187.127.92.124 \
            'set -e; cd /home/fasakha/public_html; test "$(git rev-parse HEAD)" = "84f56d3c276a30d46ee3cb87218d6cc177fd2eaf"; test ! -e storage/framework/down; echo __ERP_ORDER_CENTER_DEPLOY_VERIFIED__'
