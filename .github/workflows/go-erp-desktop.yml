name: GO ERP Desktop

on:
  push:
    branches: ['claude/go-erp-desktop-v2']
    paths:
      - 'go-erp-desktop/**'
      - 'app/Services/DesktopSync/**'
      - 'app/Http/Controllers/Api/DesktopSyncController.php'
      - 'app/Providers/RouteServiceProvider.php'
      - 'app/Services/Dashboard/BranchPayroll.php'
      - 'app/Services/Dashboard/EmployeeAttendanceRules.php'
      - 'public/dashboard/js/branch-operations.js'
      - 'resources/views/admin/takeaway/**'
      - 'resources/views/admin/pos_service/**'
      - 'resources/views/admin/phone_orders/batch_receipt.blade.php'
      - 'resources/views/admin/branch_shifts/receipt.blade.php'
      - 'app/Services/Dashboard/BranchShiftClosing.php'
      - 'app/Services/Dashboard/BranchExpenses.php'
      - 'resources/lang/ar/takeaway.php'
      - 'resources/lang/ar/pos_service.php'
      - 'resources/lang/ar/phone_orders.php'
      - 'app/Services/Dashboard/PosService*.php'
      - 'app/Services/Dashboard/PhoneDeliveryBoard.php'
      - 'app/Services/Dashboard/PhoneDelivery.php'
      - 'app/Services/Dashboard/BranchDeliveryTariff.php'
      - 'app/Services/Dashboard/BranchCustomers.php'
      - 'app/Services/Dashboard/PosServicePhone.php'
      - 'resources/views/admin/phone_orders/index.blade.php'
      - 'resources/views/admin/desktop-dashboard.blade.php'
      - 'public/dashboard/js/branch-print-receiver.js'
      - 'public/dashboard/js/takeaway-pos.js'
      - 'public/dashboard/js/dining-pos.js'
      - 'public/dashboard/js/phone-orders.js'
      - 'public/dashboard/js/dashboard-print.js'
      - 'routes/desktop_sync.php'
      - 'database/migrations/2026_10_30_000001_create_desktop_sync_tables.php'
      - 'tests/Feature/DesktopSyncTest.php'
      - 'deployment/install_go_erp_desktop_sync_root.py'
      - 'tests/test_install_go_erp_desktop_sync_root.py'
      - 'deployment/publish_go_erp_desktop_download_root.py'
      - 'tests/test_publish_go_erp_desktop_download_root.py'
      - 'deployment/activate_employee_auto_absence_root.py'
      - 'tests/test_activate_employee_auto_absence_root.py'
      - 'deployment/reset_branch_operations_root.py'
      - 'deployment/reset_branch_operations.php'
      - 'tests/test_reset_branch_operations_root.py'
      - 'deployment/install_login_hud_root.py'
      - 'tests/test_install_login_hud_root.py'
      - 'resources/views/admin/login.blade.php'
      - 'deployment/login_hud/login.blade.php'
      - 'public/dashboard/js/dashboard-order-alerts.js'
      - 'public/dashboard/js/pos-line-quantity.js'
      - 'tests/pos_line_quantity_test.js'
      - 'resources/views/admin/dining/index.blade.php'
      - 'tests/order_alerts_shared_feed_test.js'
      - 'tests/order_alerts_delivery_tone_test.js'
      - 'public/dashboard/js/order-board.js'
      - 'resources/views/admin/orders/board_card.blade.php'
      - 'app/Services/Dashboard/HomeHologramMetrics.php'
      - 'app/Services/Dashboard/OrderBoardService.php'
      - 'tests/Feature/DashboardOrderBoardTest.php'
      - 'tests/Feature/DashboardHomeHologramMetricsTest.php'
      - 'deployment/install_dashboard_branch_updates_root.py'
      - 'deployment/backup_server_full_root.py'
      - 'tests/test_backup_server_full_root.py'
      - 'tests/test_install_dashboard_branch_updates_root.py'
      - 'deployment/compare_live_code_root.py'
      - 'tests/test_compare_live_code_root.py'
      - 'deployment/inspect_live_server_root.py'
      - 'tests/test_inspect_live_server_root.py'
      - 'deployment/tune_server_root.py'
      - 'tests/test_tune_server_root.py'
      - 'deployment/cleanup_server_root.py'
      - 'tests/test_cleanup_server_root.py'
      - 'deployment/analyze_live_server_root.py'
      - 'tests/test_analyze_live_server_root.py'
      - 'deployment/release_root.py'
      - 'tests/test_release_root.py'
      - 'deployment/add_speed_indexes_root.py'
      - 'tests/test_add_speed_indexes_root.py'
      - 'deployment/diagnose_load_root.py'
      - 'tests/test_diagnose_load_root.py'
      - 'public/sounds/go-delivery-order.wav'
      - '.github/workflows/go-erp-desktop.yml'
  pull_request:
    paths:
      - 'go-erp-desktop/**'
      - 'app/Services/DesktopSync/**'
      - 'app/Http/Controllers/Api/DesktopSyncController.php'
      - 'routes/desktop_sync.php'
      - 'database/migrations/2026_10_30_000001_create_desktop_sync_tables.php'
      - 'tests/Feature/DesktopSyncTest.php'
      - 'deployment/install_go_erp_desktop_sync_root.py'
      - '.github/workflows/go-erp-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-erp-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Server API, pricing parity and end-to-end check
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: go-erp-desktop/package-lock.json
      - name: Install the existing application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-req=php+ --no-security-blocking
      - name: Prepare the isolated runtime
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views} bootstrap/cache
          cp .env.example .env
          php artisan key:generate
      - name: Desktop sync API tests
        run: vendor/bin/phpunit --filter DesktopSyncTest
      - name: The app orders board («مندوب الفرع» prints) and the GO opening's counters (the owner's drawers)
        run: vendor/bin/phpunit --filter 'DashboardOrderBoardTest|DashboardHomeHologramMetricsTest'
      - name: Server installer tests
        run: python3 -B -m unittest tests/test_install_go_erp_desktop_sync_root.py tests/test_publish_go_erp_desktop_download_root.py tests/test_activate_employee_auto_absence_root.py tests/test_reset_branch_operations_root.py tests/test_install_login_hud_root.py tests/test_install_dashboard_branch_updates_root.py tests/test_backup_server_full_root.py tests/test_compare_live_code_root.py tests/test_inspect_live_server_root.py tests/test_tune_server_root.py tests/test_cleanup_server_root.py tests/test_analyze_live_server_root.py tests/test_release_root.py tests/test_add_speed_indexes_root.py tests/test_diagnose_load_root.py
      - name: Order alerts (one feed for every tab; delivery orders sent to a branch ring with their own tone)
        run: |
          node tests/order_alerts_shared_feed_test.js
          node tests/order_alerts_delivery_tone_test.js
      - name: An item's quantity in an invoice (".5", "0,5" and Arabic digits are read; money boxes never touched)
        run: node tests/pos_line_quantity_test.js
      - name: The dashboard's own attendance rules still pass (BranchPayroll gained the device punch option)
        run: |
          composer install --working-dir=tests/desktop_pos_runtime --no-interaction --prefer-dist --no-progress --no-scripts
          php tests/desktop_pos_runtime/attendance.php
      - name: The app prices invoices exactly like the current dashboard code
        run: |
          php go-erp-desktop/test/quote-vectors.php > "$RUNNER_TEMP/quote-vectors.json"
          cmp "$RUNNER_TEMP/quote-vectors.json" go-erp-desktop/test/fixtures/quote-vectors.json
      - name: Offline receipts are the dashboard's own receipt page
        run: |
          php go-erp-desktop/test/receipt-fixtures.php > "$RUNNER_TEMP/receipts.json"
          cmp "$RUNNER_TEMP/receipts.json" go-erp-desktop/test/fixtures/receipts.json
          php go-erp-desktop/test/receipt-fixtures.php labels > "$RUNNER_TEMP/labels.json"
          cmp "$RUNNER_TEMP/labels.json" go-erp-desktop/src/main/offline/labels.json
      - name: The app's delivery fee is the dashboard's own calculation
        run: |
          php go-erp-desktop/test/delivery-vectors.php > "$RUNNER_TEMP/delivery-vectors.json"
          cmp "$RUNNER_TEMP/delivery-vectors.json" go-erp-desktop/test/fixtures/delivery-vectors.json
      - name: The dine-in and delivery pages still answer in the shapes the app answers with offline
        run: |
          php go-erp-desktop/test/dining-capture.php "$RUNNER_TEMP/dining.json"
          python3 -B go-erp-desktop/test/dining-shapes.py "$RUNNER_TEMP/dining.json" go-erp-desktop/test/fixtures/dining.json
      - name: Install the app's packages
        working-directory: go-erp-desktop
        run: npm ci
      - name: App unit tests
        working-directory: go-erp-desktop
        run: npm test
      - name: Build the screens
        working-directory: go-erp-desktop
        run: npm run build
      - name: End-to-end check (setup, offline sales, dine-in and delivery, sync, offline sign-in)
        working-directory: go-erp-desktop
        env:
          GOERP_E2E_DIR: ${{ runner.temp }}/goerp-e2e
        run: |
          if ! command -v xvfb-run > /dev/null; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e > "$RUNNER_TEMP/e2e.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/e2e.log"
          if [ "$code" -ne 0 ]; then
            # The run's log is not always reachable; an annotation is.
            python3 - "$RUNNER_TEMP/e2e.log" <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()[-3500:]
          print('::error title=End-to-end output::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: end-to-end-screenshots
          path: ${{ runner.temp }}/goerp-e2e/shots
          if-no-files-found: ignore

  windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: go-erp-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: go-erp-desktop/package-lock.json
      - run: npm ci
      - name: App unit tests on Windows
        run: npm test
      - name: Build the installer
        run: npm run dist
      - name: List the installer files
        run: ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: GO-ERP-Desktop-Setup
          path: |
            go-erp-desktop/release/*.exe
            go-erp-desktop/release/*.blockmap
            go-erp-desktop/release/latest.yml
          if-no-files-found: error
      - name: Publish this version for download and automatic updates
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="desktop-v${version}"
          files="release/GO-ERP-Desktop-Setup-${version}.exe release/GO-ERP-Desktop-Setup-${version}.exe.blockmap release/latest.yml"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for attempt in 1 2 3; do
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
                --title "GO ERP Desktop ${version}" --notes-file release-notes.md $files && break
              sleep 20
              # A release created before an upload broke is completed below, never created twice.
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            done
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          for file in $files; do
            name=$(basename "$file")
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
              for attempt in 1 2 3; do gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" && break; sleep 20; done
            fi
          done
          echo "Version ${version} is published. Raise the version in go-erp-desktop/package.json to publish a new one."
