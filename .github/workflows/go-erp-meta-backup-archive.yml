name: GO ERP exact backup archive
on:
  push:
    branches: [codex/go-erp-meta-backup-archive-20261021]
  pull_request:
    paths:
      - 'deployment/archive_go_erp_meta_backups_root.py'
      - 'tests/test_go_erp_meta_backup_archive_root.py'
      - '.github/workflows/go-erp-meta-backup-archive.yml'
permissions:
  contents: read
jobs:
  exact-backup-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
      - name: Preserve backup bytes and verify unchanged application source
        run: sudo -n -- env GO_ERP_TEST_REQUIRE_REAL_CHOWN=1 python3 -B tests/test_go_erp_meta_backup_archive_root.py
